<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MgO Experiment | Mpoxel</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    background:#07111d;

    color:white;

    user-select:none;
}


/* =========================================================
   CANVAS
========================================================= */

canvas{
    display:block;

    width:100%;
    height:100%;
}


/* =========================================================
   TOP INFORMATION CARD
========================================================= */

#title{

    position:absolute;

    top:20px;
    left:20px;

    width:min(430px,calc(100vw - 40px));

    padding:18px 20px;

    background:#101c2b;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:16px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.30);

    z-index:10;

    pointer-events:none;
}

#title h2{

    font-size:22px;

    line-height:1.3;

    color:#69dcff;

    margin-bottom:6px;

}

#title p{

    font-size:13px;

    color:#9caabd;

    line-height:1.5;

}


/* =========================================================
   STATUS
========================================================= */

#status{

    position:absolute;

    top:20px;
    right:20px;

    padding:10px 15px;

    background:#101c2b;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:12px;

    font-size:13px;

    color:#b8c7d9;

    z-index:10;

}


/* =========================================================
   BUTTONS
========================================================= */

button{

    position:absolute;

    left:50%;

    border:none;

    cursor:pointer;

    z-index:100;

    font-family:inherit;

    font-size:16px;

    font-weight:700;

    color:white;

    border-radius:13px;

    padding:14px 28px;

    transform:translateX(-50%);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.35);

    transition:
        transform .15s ease,
        background .15s ease;

}

button:hover{

    transform:
        translateX(-50%)
        translateY(-2px);

}

button:active{

    transform:
        translateX(-50%)
        scale(.97);

}


/* =========================================================
   START
========================================================= */

#startBtn{

    top:50%;

    background:#19b866;

    min-width:220px;

}

#startBtn:hover{

    background:#20ce76;

}


/* =========================================================
   RESET
========================================================= */

#resetBtn{

    display:none;

    top:50%;

    background:#1689e8;

    min-width:200px;

}

#resetBtn:hover{

    background:#299cf3;

}


/* =========================================================
   EQUATION
========================================================= */

#equation{

    position:absolute;

    left:50%;

    bottom:24px;

    transform:translateX(-50%);

    display:none;

    width:max-content;

    max-width:
        calc(100vw - 30px);

    padding:12px 24px;

    background:#101c2b;

    border:
        1px solid
        rgba(105,220,255,.25);

    border-radius:12px;

    color:#ffffff;

    font-size:24px;

    font-weight:700;

    letter-spacing:.5px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.30);

    z-index:20;

}


/* =========================================================
   CREDIT
========================================================= */

#credit{

    position:absolute;

    right:18px;
    bottom:15px;

    color:
        rgba(255,255,255,.35);

    font-size:11px;

    pointer-events:none;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    #title{

        top:12px;
        left:12px;

        width:
            calc(100vw - 24px);

        padding:14px 16px;

    }

    #title h2{

        font-size:18px;

    }

    #title p{

        font-size:12px;

    }

    #status{

        top:auto;
        right:12px;
        bottom:14px;

        font-size:11px;

        padding:8px 11px;

    }

    #equation{

        bottom:58px;

        font-size:19px;

        padding:10px 17px;

    }

    button{

        font-size:15px;

        padding:13px 22px;

    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *{
        scroll-behavior:auto !important;
    }

}

</style>


<script type="importmap">
{
    "imports":{
        "three":
        "https://unpkg.com/three@0.170.0/build/three.module.js",

        "OrbitControls":
        "https://unpkg.com/three@0.170.0/examples/jsm/controls/OrbitControls.js"
    }
}
</script>

</head>


<body>


<!-- =========================================================
     INFORMATION
========================================================= -->

<div id="title">

    <h2>
        Magnesium + Oxygen → Magnesium Oxide
    </h2>

    <p>
        Drag the magnesium ribbon toward the flame
        to start the reaction.
    </p>

</div>


<div id="status">
    Experiment ready
</div>


<div id="credit">
    Mpoxel Science Lab
</div>


<script type="module">

import * as THREE from "three";
import { OrbitControls } from "OrbitControls";


/* =========================================================
   BASIC SETUP
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x07111d);


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        55,
        innerWidth / innerHeight,
        .1,
        100
    );

camera.position.set(
    6,
    4.5,
    8
);


/* =========================================================
   LOW-END FRIENDLY RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        antialias:false,

        powerPreference:"high-performance"

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.25
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);


/*
    Shadows intentionally disabled.
    This is a science demonstration,
    not a photorealistic scene.
*/

renderer.shadowMap.enabled = false;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   CAMERA CONTROLS
========================================================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = false;

controls.enablePan = false;

controls.minDistance = 5;

controls.maxDistance = 14;


/* =========================================================
   LIGHTING
========================================================= */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x243447,
        1.7
    )
);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        1.8
    );

sun.position.set(
    5,
    8,
    5
);

scene.add(sun);


/* =========================================================
   FLAME LIGHT
========================================================= */

const flameLight =
    new THREE.PointLight(
        0xffa333,
        1.8,
        5
    );

flameLight.position.set(
    0,
    .7,
    0
);

scene.add(flameLight);


/* =========================================================
   TABLE
========================================================= */

const table =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            10,
            .4,
            6
        ),

        new THREE.MeshStandardMaterial({
            color:0x70451f,
            roughness:.8
        })

    );

table.position.y = -1;

scene.add(table);


/* =========================================================
   BURNER STAND
========================================================= */

const stand =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .12,
            .12,
            1.2,
            12
        ),

        new THREE.MeshStandardMaterial({
            color:0x444444,
            roughness:.65
        })

    );

stand.position.set(
    0,
    -.4,
    0
);

scene.add(stand);


/* =========================================================
   BASE
========================================================= */

const base =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .45,
            .55,
            .2,
            16
        ),

        new THREE.MeshStandardMaterial({

            color:0x1b1b1b,

            metalness:.75,

            roughness:.25

        })

    );

base.position.set(
    0,
    -.9,
    0
);

scene.add(base);


/* =========================================================
   NOZZLE
========================================================= */

const nozzle =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .05,
            .05,
            .25,
            10
        ),

        new THREE.MeshStandardMaterial({
            color:0x777777
        })

    );

nozzle.position.set(
    0,
    .25,
    0
);

scene.add(nozzle);


/* =========================================================
   FLAME
   Only 12 particles instead of 40.
========================================================= */

const flameGroup =
    new THREE.Group();

scene.add(flameGroup);


const flames = [];


for(let i = 0; i < 12; i++){

    const flame =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .06,
                6,
                6
            ),

            new THREE.MeshBasicMaterial({
                color:
                    i % 2
                    ? 0xff6a00
                    : 0xffff44
            })

        );

    flameGroup.add(
        flame
    );

    flames.push(
        flame
    );

}


/* =========================================================
   MAGNESIUM RIBBON
========================================================= */

const ribbonMat =
    new THREE.MeshStandardMaterial({

        color:0xcfcfcf,

        metalness:.55,

        roughness:.18,

        emissive:0x000000

    });


const ribbon =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            2,
            .05,
            .18
        ),

        ribbonMat

    );


ribbon.position.set(
    -2,
    1.2,
    0
);

ribbon.rotation.z =
    .35;

scene.add(ribbon);


/* =========================================================
   GLASS / OXIDE CONTAINER
   MeshPhysicalMaterial + transmission removed.
========================================================= */

const glass =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            1,
            20,
            12,
            0,
            Math.PI * 2,
            0,
            Math.PI / 3
        ),

        new THREE.MeshStandardMaterial({

            color:0x65cfff,

            transparent:true,

            opacity:.20,

            roughness:.25

        })

    );


glass.position.set(
    2,
    -.35,
    0
);

glass.rotation.x =
    Math.PI;

scene.add(glass);


/* =========================================================
   PARTICLE SYSTEM
========================================================= */

/*
    Original:
        80 smoke
        120 powder
        50 sparks

    New:
        18 smoke
        22 powder
        10 sparks

    Huge reduction in draw calls.
*/

const smoke = [];

const powder = [];

const sparks = [];


function makeParticle(
    color,
    size
){

    const particle =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                size,
                5,
                5
            ),

            new THREE.MeshBasicMaterial({

                color,

                transparent:true,

                opacity:1

            })

        );

    particle.visible =
        false;

    scene.add(
        particle
    );

    return particle;

}


/* =========================================================
   CREATE PARTICLES
========================================================= */

for(let i = 0; i < 18; i++){

    smoke.push(
        makeParticle(
            0xaaaaaa,
            .055
        )
    );

}


for(let i = 0; i < 22; i++){

    powder.push(
        makeParticle(
            0xffffff,
            .035
        )
    );

}


for(let i = 0; i < 10; i++){

    sparks.push(
        makeParticle(
            0xffdd55,
            .028
        )
    );

}


/* =========================================================
   PARTICLE INDEXES
========================================================= */

let smokeIndex = 0;

let powderIndex = 0;

let sparkIndex = 0;


/* =========================================================
   UI
========================================================= */

const startBtn =
    document.createElement(
        "button"
    );

startBtn.id =
    "startBtn";

startBtn.textContent =
    "▶ Start Experiment";

document.body.appendChild(
    startBtn
);


const reset =
    document.createElement(
        "button"
    );

reset.id =
    "resetBtn";

reset.textContent =
    "↻ Perform Again";

document.body.appendChild(
    reset
);


const eq =
    document.createElement(
        "div"
    );

eq.id =
    "equation";

eq.textContent =
    "2Mg + O₂ → 2MgO";

document.body.appendChild(
    eq
);


const status =
    document.getElementById(
        "status"
    );


/* =========================================================
   EXPERIMENT STATE
========================================================= */

let experimentStarted =
    false;

let burning =
    false;

let reactionDone =
    false;

let dragging =
    false;


/* =========================================================
   START
========================================================= */

startBtn.onclick = () => {

    experimentStarted =
        true;

    status.textContent =
        "Drag Mg ribbon to the flame";

    startBtn.style.display =
        "none";

};


/* =========================================================
   RESET
========================================================= */

reset.onclick = () => {

    experimentStarted =
        false;

    burning =
        false;

    reactionDone =
        false;

    dragging =
        false;


    ribbon.scale.set(
        1,
        1,
        1
    );

    ribbon.position.set(
        -2,
        1.2,
        0
    );


    ribbonMat.emissive.set(
        0x000000
    );


    flameLight.intensity =
        1.8;


    eq.style.display =
        "none";


    smokeIndex =
        0;

    powderIndex =
        0;

    sparkIndex =
        0;


    smoke.forEach(
        p => {

            p.visible =
                false;

            p.material.opacity =
                1;

            p.scale.set(
                1,
                1,
                1
            );

        }
    );


    powder.forEach(
        p => {

            p.visible =
                false;

        }
    );


    sparks.forEach(
        p => {

            p.visible =
                false;

            p.material.opacity =
                1;

        }
    );


    startBtn.style.display =
        "block";

    reset.style.display =
        "none";


    status.textContent =
        "Experiment ready";

};


/* =========================================================
   RAYCASTING
========================================================= */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();


/* =========================================================
   POINTER DOWN
========================================================= */

window.addEventListener(
    "pointerdown",
    e => {

        if(!experimentStarted)
            return;

        mouse.x =
            e.clientX /
            innerWidth *
            2 - 1;

        mouse.y =
            -(e.clientY /
            innerHeight) *
            2 + 1;


        raycaster.setFromCamera(
            mouse,
            camera
        );


        if(
            raycaster.intersectObject(
                ribbon
            ).length
        ){

            dragging =
                true;

            controls.enabled =
                false;

        }

    }
);


/* =========================================================
   POINTER UP
========================================================= */

window.addEventListener(
    "pointerup",
    () => {

        dragging =
            false;

        controls.enabled =
            true;

    }
);


/* =========================================================
   POINTER MOVE
========================================================= */

window.addEventListener(
    "pointermove",
    e => {

        if(!dragging)
            return;


        mouse.x =
            e.clientX /
            innerWidth *
            2 - 1;

        mouse.y =
            -(e.clientY /
            innerHeight) *
            2 + 1;


        const p =
            new THREE.Vector3(
                mouse.x,
                mouse.y,
                .5
            );


        p.unproject(
            camera
        );


        const dir =
            p.sub(
                camera.position
            ).normalize();


        const d =
            (
                ribbon.position.y -
                camera.position.y
            ) / dir.y;


        const pos =
            camera.position
                .clone()
                .add(
                    dir.multiplyScalar(d)
                );


        ribbon.position.x =
            THREE.MathUtils.clamp(
                pos.x,
                -4,
                4
            );


        ribbon.position.z =
            THREE.MathUtils.clamp(
                pos.z,
                -2,
                2
            );

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                1.25
            )
        );

    }
);


/* =========================================================
   ANIMATION CLOCK
========================================================= */

const clock =
    new THREE.Clock();


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
        clock.getElapsedTime();


    /* -----------------------------------------
       CONTROLS
    ----------------------------------------- */

    controls.update();


    /* -----------------------------------------
       DETECT FLAME CONTACT
    ----------------------------------------- */

    if(

        experimentStarted &&

        Math.abs(
            ribbon.position.x
        ) < .4 &&

        Math.abs(
            ribbon.position.z
        ) < .4 &&

        ribbon.position.y > .6

    ){

        burning =
            true;

        status.textContent =
            "🔥 Magnesium is burning";

    }


    /* -----------------------------------------
       BURNING
    ----------------------------------------- */

    if(burning){

        ribbonMat.emissive.set(
            0xffffff
        );


        flameLight.intensity =
            4.5 +
            Math.sin(time * 10) * .6;


        /* Shrink ribbon */

        if(
            ribbon.scale.x > .15
        ){

            const burn =
                .0025;

            ribbon.scale.x -=
                burn;

            ribbon.position.x +=
                burn * .9;

        }


        /* -------------------------------------
           SMOKE
        ------------------------------------- */

        if(
            smokeIndex <
            smoke.length &&
            Math.random() < .025
        ){

            const p =
                smoke[
                    smokeIndex++
                ];

            p.visible =
                true;

            p.position.set(
                ribbon.position.x,
                1,
                0
            );

            p.userData = {

                vx:
                    (Math.random() - .5)
                    * .008,

                vy:.018

            };

        }


        /* -------------------------------------
           POWDER
        ------------------------------------- */

        if(
            powderIndex <
            powder.length &&
            Math.random() < .08
        ){

            const p =
                powder[
                    powderIndex++
                ];

            p.visible =
                true;

            p.position.set(
                ribbon.position.x,
                1,
                0
            );

            p.userData = {

                vy:-.018,

                target:
                    glass.position.y +
                    .12

            };

        }


        /* -------------------------------------
           SPARKS
        ------------------------------------- */

        if(
            sparkIndex <
            sparks.length &&
            Math.random() < .10
        ){

            const s =
                sparks[
                    sparkIndex++
                ];

            s.visible =
                true;

            s.position.set(
                ribbon.position.x,
                1,
                0
            );

            s.userData = {

                vx:
                    (Math.random() - .5)
                    * .05,

                vy:
                    Math.random()
                    * .04 +
                    .02,

                life:1

            };

        }

    }
    else{

        ribbonMat.emissive.set(
            0x000000
        );

        flameLight.intensity =
            1.8;

    }


    /* =====================================================
       SMOKE UPDATE
    ===================================================== */

    for(
        let i = 0;
        i < smoke.length;
        i++
    ){

        const p =
            smoke[i];

        if(!p.visible)
            continue;


        p.position.x +=
            p.userData.vx;

        p.position.y +=
            p.userData.vy;


        p.material.opacity -=
            .012;


        p.scale.multiplyScalar(
            1.008
        );


        if(
            p.material.opacity <= 0
        ){

            p.visible =
                false;

            p.material.opacity =
                1;

            p.scale.set(
                1,
                1,
                1
            );

        }

    }


    /* =====================================================
       POWDER UPDATE
    ===================================================== */

    for(
        let i = 0;
        i < powder.length;
        i++
    ){

        const p =
            powder[i];

        if(!p.visible)
            continue;


        p.position.y +=
            p.userData.vy;


        if(
            p.position.y <=
            p.userData.target
        ){

            p.userData.vy =
                0;

        }

    }


    /* =====================================================
       SPARK UPDATE
    ===================================================== */

    for(
        let i = 0;
        i < sparks.length;
        i++
    ){

        const s =
            sparks[i];

        if(!s.visible)
            continue;


        s.position.x +=
            s.userData.vx;

        s.position.y +=
            s.userData.vy;


        s.material.opacity -=
            .05;


        if(
            s.material.opacity <= 0
        ){

            s.visible =
                false;

            s.material.opacity =
                1;

        }

    }


    /* =====================================================
       REACTION COMPLETE
    ===================================================== */

    if(

        burning &&

        ribbon.scale.x <= .15 &&

        !reactionDone

    ){

        reactionDone =
            true;


        eq.style.display =
            "block";


        reset.style.display =
            "block";


        status.textContent =
            "✓ Magnesium oxide formed";

    }


    /* =====================================================
       FLAME ANIMATION
       Deterministic — no Math.random() every frame.
    ===================================================== */

    for(
        let i = 0;
        i < flames.length;
        i++
    ){

        const f =
            flames[i];


        f.visible =
            experimentStarted;


        const phase =
            time * 4 +
            i * .8;


        f.position.x =
            Math.sin(phase * 1.7)
            * .07;


        f.position.z =
            Math.cos(phase * 1.3)
            * .06;


        f.position.y =
            .42 +
            (i / flames.length)
            * .45;


        const pulse =
            .55 +
            Math.sin(phase)
            * .18;


        f.scale.setScalar(
            pulse
        );


        if(burning){

            f.material.color.set(
                i % 2
                ? 0xff6600
                : 0xffff55
            );

        }
        else{

            f.material.color.set(
                0xff8800
            );

        }

    }


    /* =====================================================
       RENDER
    ===================================================== */

    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   START LOOP
========================================================= */

animate();

</script>

</body>

</html>
