<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadside Coder</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#fff7df;
    color:#171717;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

.page{
    min-height:100vh;
    position:relative;
    padding:40px 18px 80px;
}

.content{
    position:relative;
    z-index:5;
    width:100%;
    max-width:720px;
    margin:auto;
    text-align:center;
}

/* =========================
   DOODLE ART
========================= */

.doodle{
    position:absolute;
    z-index:2;
    width:90px;
    height:90px;
    pointer-events:none;
}

.doodle svg{
    width:100%;
    height:100%;
}

.doodle *{
    fill:none;
    stroke:#171717;
    stroke-width:4;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* many doodles */

.star1{top:25px;left:3%;transform:rotate(-12deg)}
.star2{top:130px;right:3%;transform:rotate(15deg)}
.star3{top:500px;left:2%;transform:rotate(8deg)}

.lightning1{top:240px;left:5%;transform:rotate(-15deg)}
.lightning2{top:630px;right:5%;transform:rotate(12deg)}

.smile1{top:350px;right:4%;transform:rotate(10deg)}
.smile2{top:760px;left:5%;transform:rotate(-8deg)}

.cloud1{top:90px;left:20%;transform:rotate(-4deg)}
.cloud2{top:680px;right:18%;transform:rotate(7deg)}

.pencil1{top:420px;left:8%;transform:rotate(-25deg)}

.computer1{top:180px;right:12%;transform:rotate(7deg)}

.arrow1{top:570px;left:25%;transform:rotate(-8deg)}
.arrow2{top:300px;left:28%;transform:rotate(20deg)}

.bubble1{top:50px;right:22%;transform:rotate(-7deg)}

.heart1{top:440px;right:20%;transform:rotate(12deg)}

.question1{top:820px;right:7%;transform:rotate(12deg)}

.lines1{top:350px;left:25%;transform:rotate(-20deg)}

.cross1{top:250px;right:27%;transform:rotate(15deg)}

.rocket1{top:850px;left:12%;transform:rotate(-15deg)}

/* =========================
   HEADER
========================= */

.thanks{
    padding-top:50px;
}

.thanks h1{
    margin:0;
    font-size:clamp(45px,10vw,88px);
    line-height:.86;
    letter-spacing:-5px;
    font-weight:1000;
}

.thanks p{
    font-size:18px;
    font-weight:700;
    opacity:.65;
    margin-top:24px;
}

/* =========================
   PASSWORD
========================= */

.password{
    max-width:520px;
    margin:65px auto 0;
}

.password label{
    display:block;
    font-size:14px;
    font-weight:1000;
    margin-bottom:13px;
}

.password-box{
    display:flex;
    background:white;
    border:3px solid #171717;
    border-radius:18px;
    padding:7px;
    box-shadow:7px 7px 0 #171717;
}

.password-box input{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    padding:14px;
    font-size:16px;
}

.password-box button{
    border:0;
    border-radius:12px;
    background:#171717;
    color:white;
    padding:0 25px;
    font-weight:1000;
    cursor:pointer;
}

.error{
    min-height:25px;
    margin-top:13px;
    color:#c62828;
    font-weight:800;
    font-size:14px;
}

/* =========================
   COLLECTION
========================= */

.collection{
    display:none;
    margin-top:70px;
}

.collection.show{
    display:block;
}

.collection h2{
    margin:0;
    font-size:clamp(40px,9vw,68px);
    line-height:.9;
    letter-spacing:-4px;
    font-weight:1000;
}

.collection p{
    opacity:.6;
    font-weight:700;
}

/* =========================
   COMIC
========================= */

.card{
    margin-top:35px;
    background:white;
    border:3px solid #171717;
    border-radius:24px;
    padding:14px;
    text-align:left;
    box-shadow:9px 9px 0 #171717;
}

.cover{
    min-height:350px;
    border:3px solid #171717;
    border-radius:17px;
    position:relative;
    overflow:hidden;

    background:
        repeating-linear-gradient(
            135deg,
            #eeeeee 0px,
            #eeeeee 10px,
            #fafafa 10px,
            #fafafa 20px
        );

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.cover:after{
    content:"";
    position:absolute;
    width:220px;
    height:220px;
    border:5px dashed #171717;
    border-radius:50%;
    opacity:.12;
}

.cover-small{
    font-size:14px;
    font-weight:1000;
    z-index:2;
}

.cover-title{
    font-size:clamp(42px,9vw,75px);
    font-weight:1000;
    line-height:.82;
    letter-spacing:-5px;
    z-index:2;
}

.unit{
    margin-top:22px;
    background:white;
    border:3px solid #171717;
    border-radius:10px;
    padding:8px 16px;
    font-weight:1000;
    transform:rotate(-3deg);
    z-index:2;
}

.info{
    padding:20px 5px 5px;
}

.info h3{
    margin:0;
    font-size:22px;
    font-weight:1000;
}

.info p{
    font-size:14px;
}

.view{
    width:100%;
    min-height:54px;
    border:0;
    border-radius:13px;
    background:#171717;
    color:white;
    font-weight:1000;
    font-size:15px;
    cursor:pointer;
}

.view:active{
    transform:translateY(2px);
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .page{
        padding:25px 14px 60px;
    }

    .thanks{
        padding-top:35px;
    }

    .thanks h1{
        letter-spacing:-3px;
    }

    .password{
        margin-top:48px;
    }

    .password-box{
        display:block;
    }

    .password-box input{
        width:100%;
        min-height:48px;
    }

    .password-box button{
        width:100%;
        min-height:50px;
        margin-top:4px;
    }

    .collection{
        margin-top:55px;
    }

    .card{
        box-shadow:6px 6px 0 #171717;
    }

    .cover{
        min-height:290px;
    }

    .doodle{
        width:65px;
        height:65px;
    }

    .cloud1,
    .computer1,
    .lines1,
    .cross1{
        display:none;
    }
}
</style>
</head>

<body>

<!-- ==================================================
     MAIN CONTENT
================================================== -->

<div class="content">

<section class="thanks">
<h1>THANKS<br>FOR BUYING :)</h1>
<p>Your digital collection is waiting.</p>
</section>


<section class="password">

<label>
ENTER THE PASSWORD THAT THE OWNER GAVE YOU
</label>

<form class="password-box" id="passwordForm">

<input
id="password"
type="password"
placeholder="Enter password..."
autocomplete="off"
required
>

<button type="submit">
ENTER
</button>

</form>

<div class="error" id="error"></div>

</section>


<section class="collection" id="collection">

<h2>OUR COLLECTION</h2>

<p>Your purchased digital comics</p>


<div class="card">

<div class="cover">

<div class="cover-small">
ROADSIDE CODER
</div>

<div class="cover-title">
ROADSIDE<br>CODER
</div>

<div class="unit">
UNIT 1
</div>

</div>


<div class="info">

<h3>
ROADSIDE CODER — UNIT 1
</h3>

<p>
Digital Comic • Unit 1
</p>

<button
class="view"
id="viewComic"
type="button"
>
VIEW + DOWNLOAD COMIC →
</button>

</div>

</div>

</section>

</div>
</div>


<script>

const PASSWORD = "booboo5545";

const form = document.getElementById("passwordForm");
const input = document.getElementById("password");
const error = document.getElementById("error");
const collection = document.getElementById("collection");
const viewComic = document.getElementById("viewComic");

form.addEventListener("submit",function(e){

    e.preventDefault();

    if(input.value === PASSWORD){

        error.textContent = "";

        collection.classList.add("show");

        collection.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    }else{

        error.textContent = "WRONG PASSWORD.";

        input.value = "";
        input.focus();

    }

});


viewComic.addEventListener("click",function(){

    const pdf = "comic.pdf";

    /* Open PDF */
    window.open(pdf,"_blank");

    /* Download PDF */
    const download = document.createElement("a");

    download.href = pdf;
    download.download = "Roadside-Coder-Unit-1.pdf";

    document.body.appendChild(download);
    download.click();
    download.remove();

});

</script>
