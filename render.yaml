services:
  - type: web
    name: mpoxel-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --worker-class gthread --timeout 120
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: CLOUDFLARE_IMAGE_MODEL
        value: '@cf/black-forest-labs/flux-1-schnell'
      - key: MPOXEL_ALLOWED_ORIGINS
        value: 'https://mpoxel.in,https://www.mpoxel.in'
      - key: MAX_CONCURRENT_REQUESTS
        value: '4'
      - key: MAX_QUEUE_SIZE
        value: '30'
