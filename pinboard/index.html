<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Pinboard — Offline Board</title>
<style>
:root{--bg:#101827;--panel:#172235;--panel2:#202e43;--ink:#edf3fb;--muted:#9aabc1;--accent:#79d7c4;--line:#51647d;--shadow:0 14px 38px #0005}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
body{display:flex;flex-direction:column;min-height:0}
button{border:1px solid #ffffff20;background:#26364c;color:var(--ink);border-radius:11px;padding:10px 13px;font:600 13px/1.2 inherit;cursor:pointer;white-space:nowrap;min-height:40px;touch-action:manipulation}
button:hover{background:#344a65}button.primary{background:var(--accent);color:#10232a;border-color:transparent}button.danger{color:#ffb7b7}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#131f30;border-bottom:1px solid #ffffff15;position:relative;z-index:10;flex-wrap:wrap;max-height:35dvh;overflow:auto;overscroll-behavior:contain;transition:transform .2s ease,max-height .2s ease,padding .2s ease}
.brand{font-weight:800;letter-spacing:.2px;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:9px;min-height:38px}.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#10232a;display:grid;place-items:center;font-weight:900}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.toolbar{display:flex;gap:7px;align-items:center;flex:1 1 100%;min-width:0;flex-wrap:wrap}
.toolbar button{flex:0 0 auto}
#navToggle{min-width:42px;padding:8px 11px}
#showNav{display:none;position:fixed;top:10px;left:10px;z-index:30;box-shadow:var(--shadow);background:#202e43;border-color:#ffffff30}
body.nav-hidden .topbar{display:none}
body.nav-hidden #showNav{display:block}
#workspace{position:relative;flex:1 1 auto;min-height:0;width:100%;overflow:auto;background-color:#111d2c;background-image:radial-gradient(#71839a42 1px,transparent 1px);background-size:24px 24px;touch-action:pan-x pan-y;overscroll-behavior:contain}
#board{position:relative;width:2400px;height:1600px}
#canvas{position:absolute;left:0;top:0;width:2400px;height:1600px;transform-origin:top left}
#threads{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.thread{fill:none;stroke:#78d7c5;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 2px 2px #0008)}
.thread-hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}
.card{position:absolute;width:240px;min-height:120px;background:#f8e8a8;color:#29303a;border-radius:7px 7px 11px 11px;padding:17px 15px 14px;box-shadow:var(--shadow);transform:rotate(var(--tilt,0deg));user-select:none;touch-action:none}
.card:nth-of-type(3n){background:#c9e9df}.card:nth-of-type(4n){background:#d9d4f4}
.card.selected{outline:3px solid var(--accent);outline-offset:4px;z-index:5}
.card .pin{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:#dc665b;box-shadow:0 2px 4px #0005}
.card .content{white-space:pre-wrap;overflow-wrap:anywhere;min-height:62px;outline:none;cursor:text;font-size:15px}
.card img{display:block;max-width:100%;max-height:230px;object-fit:contain;border-radius:5px;margin:2px auto 8px;user-select:none;pointer-events:none}
.card .meta{font-size:10px;opacity:.5;margin-top:9px;display:flex;justify-content:space-between}
.card .remove{position:absolute;right:6px;top:5px;border:0;background:#0001;color:#344;padding:2px 6px;border-radius:5px;font-size:12px;min-height:26px}
.card .remove:hover{background:#0002}
#empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#a8b6c9;text-align:center;padding:20px}
#empty div{max-width:390px;background:#172235df;border:1px solid #ffffff15;border-radius:18px;padding:24px;box-shadow:var(--shadow)}
#empty strong{display:block;font-size:18px;color:#edf3fb;margin-bottom:7px}
#connectHint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);padding:10px 15px;background:#20344a;border:1px solid #ffffff25;border-radius:12px;z-index:20;display:none;box-shadow:var(--shadow);font-size:13px;max-width:calc(100vw - 24px);text-align:center}
.zoom-readout{min-width:48px;text-align:center;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.file-picker{display:none}
@media(max-width:760px){
 .topbar{padding:8px 10px;gap:7px;max-height:42dvh}
 .brand{font-size:16px}.logo{width:28px;height:28px}
 .toolbar{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;flex:1 1 100%;padding:2px 1px 7px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
 .toolbar button{padding:9px 11px;min-height:39px;font-size:12px}
 .status{font-size:11px}
}
@media(max-width:420px){
 .topbar{padding:7px 8px}
 .brand{font-size:15px;gap:7px}
 .status{display:none}
 .toolbar{gap:6px}
 .toolbar button{padding:9px 10px}
 #empty div{padding:18px;max-width:290px}
}

/* Refined soft UI and two dark palettes */
:root{--board-bg:#101d2e;--dots:#7f95af38;--bar:#162338;--button:#263850;--button-hover:#354b67;--card-shadow:0 16px 36px #0004}
body[data-theme="midnight"]{--bg:#0b1020;--panel:#151e34;--panel2:#202b47;--ink:#eff0ff;--muted:#a6afd1;--accent:#b5a2ff;--board-bg:#0d1428;--dots:#a7a2ef30;--bar:#121a31;--button:#273252;--button-hover:#394568}
body{background:var(--bg)}
.topbar{background:var(--bar);border-bottom:1px solid #ffffff13;box-shadow:0 8px 30px #0002;border-radius:0 0 20px 20px}
button{background:var(--button);border:1px solid #ffffff14;border-radius:14px;transition:background .15s,transform .15s,box-shadow .15s;box-shadow:0 2px 8px #0001}
button:hover{background:var(--button-hover)}button:active{transform:scale(.97)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#workspace{background-color:var(--board-bg);background-image:radial-gradient(var(--dots) 1px,transparent 1px)}
.card,.card:nth-of-type(3n),.card:nth-of-type(4n){border-radius:19px;background:var(--note-color,#f8e8a8);box-shadow:var(--card-shadow);padding:22px 16px 15px;border:1px solid #ffffff44;overflow:visible}
.card .remove{border-radius:10px;right:8px;top:8px}.card .content{line-height:1.5;padding-top:7px}
.card .meta{margin-top:14px}.card .pin{width:9px;height:9px;top:9px}
.card .color-edit{position:absolute;right:39px;top:8px;padding:2px 8px;min-height:26px;background:#0001;color:#29303a;border:0;border-radius:10px;font-size:14px}
#showNav{border-radius:15px;background:var(--button)}
#empty div{border-radius:24px;background:var(--panel)}
#themeToggle{border-color:var(--accent);color:var(--ink)}
#notePalette{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid #ffffff22;border-radius:17px;padding:10px 12px;box-shadow:var(--shadow);position:fixed;z-index:40;left:50%;bottom:16px;transform:translateX(-50%);max-width:calc(100vw - 20px)}
#notePalette[hidden]{display:none}#notePalette .swatch{width:30px;height:30px;min-height:30px;border-radius:50%;padding:0;border:2px solid #ffffffaa;flex:none}#notePalette input[type=color]{width:38px;height:34px;padding:2px;border-radius:9px;background:transparent;cursor:pointer}#notePalette span{font-size:12px;color:var(--muted)}
@media(max-width:760px){.topbar{max-height:none;overflow:visible}.toolbar{flex-wrap:nowrap;overflow-x:auto}.card{border-radius:18px}}
</style>
</head>
<body>
<header class="topbar" id="topbar">
 <div class="brand"><span class="logo">P</span> Pinboard <span style="font-size:11px;color:#9aabc1;font-weight:500">OFFLINE</span></div>
 <div class="status" id="saveStatus">● Saved locally</div>
 <button id="themeToggle" title="Switch dark theme">☾ Midnight</button>
 <button id="navToggle" aria-expanded="true" title="Hide toolbar">⌃ Hide</button>
 <nav class="toolbar" aria-label="Board tools">
  <button class="primary" id="addText">＋ Text note</button>
  <button id="addImage">▧ Add pictures</button>
  <button id="connect">↗ Connect</button>
  <button id="disconnect">⌁ Disconnect</button>
  <button id="zoomOut" aria-label="Zoom out">−</button><span class="zoom-readout" id="zoomReadout">100%</span><button id="zoomIn" aria-label="Zoom in">＋</button><button id="zoomReset">Reset zoom</button>
  <button id="export">↓ Export board</button>
  <button id="import">↑ Import board</button>
  <button id="clear" class="danger">Clear</button>
 </nav>
</header>
<button id="showNav" aria-label="Show toolbar">☰ Tools</button>
<main id="workspace"><div id="board"><div id="canvas"><svg id="threads"><g id="threadLayer"></g></svg><div id="cards"></div></div></div></main>
<div id="empty"><div><strong>Your board is ready.</strong>Add text notes or pictures, drag them around, then connect related cards with threads. Everything saves on this device.</div></div>
<div id="notePalette" hidden><span>Note color</span><button class="swatch" data-color="#f8e8a8" style="background:#f8e8a8" aria-label="Yellow"></button><button class="swatch" data-color="#c9e9df" style="background:#c9e9df" aria-label="Mint"></button><button class="swatch" data-color="#d9d4f4" style="background:#d9d4f4" aria-label="Lilac"></button><button class="swatch" data-color="#ffd6d9" style="background:#ffd6d9" aria-label="Pink"></button><button class="swatch" data-color="#d0e8ff" style="background:#d0e8ff" aria-label="Blue"></button><input type="color" id="customNoteColor" value="#f8e8a8" title="Custom note color" aria-label="Custom note color"><button id="closePalette">Done</button></div>
<div id="connectHint">Select the first card, then the second card to connect them. Press Esc to cancel.</div>
<input id="imageInput" class="file-picker" type="file" accept="image/*" multiple>
<input id="importInput" class="file-picker" type="file" accept=".json,application/json">
<script>
(()=> {
const DB_NAME='pinboard-offline-v1', STORE='boards', KEY='main';
const boardFrame=document.getElementById('board'), boardEl=document.getElementById('canvas'), workspace=document.getElementById('workspace'), cardsEl=document.getElementById('cards'), layer=document.getElementById('threadLayer');
const statusEl=document.getElementById('saveStatus'), empty=document.getElementById('empty');
let state={version:1,cards:[],threads:[]}, selected=null, connectMode=false, disconnectMode=false, connectFirst=null, saveTimer, zoom=1;
function applyZoom(next,focusX=null,focusY=null){const old=zoom;zoom=Math.max(.35,Math.min(2,next));const cx=focusX===null?workspace.scrollLeft+workspace.clientWidth/2:focusX;const cy=focusY===null?workspace.scrollTop+workspace.clientHeight/2:focusY;const boardX=cx/old,boardY=cy/old;boardEl.style.transform=`scale(${zoom})`;boardFrame.style.width=(2400*zoom)+'px';boardFrame.style.height=(1600*zoom)+'px';workspace.scrollLeft=Math.max(0,boardX*zoom-workspace.clientWidth/2);workspace.scrollTop=Math.max(0,boardY*zoom-workspace.clientHeight/2);document.getElementById('zoomReadout').textContent=Math.round(zoom*100)+'%';}
const uid=()=> 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbGet(){try{const db=await dbOpen();return await new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).get(KEY);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return null}}
async function dbSet(value){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(value,KEY);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function save(){clearTimeout(saveTimer);statusEl.textContent='● Saving…';saveTimer=setTimeout(async()=>{try{await dbSet(state);statusEl.textContent='● Saved locally'}catch(e){statusEl.textContent='Save failed — export a backup';console.error(e)}},250)}
function render(){
 cardsEl.innerHTML='';layer.innerHTML='';
 state.cards.forEach((c,i)=>{
  const el=document.createElement('article');el.className='card'+(selected===c.id?' selected':'');el.dataset.id=c.id;el.style.left=c.x+'px';el.style.top=c.y+'px';el.style.setProperty('--tilt',c.tilt+'deg');el.style.setProperty('--note-color',c.color||['#f8e8a8','#c9e9df','#d9d4f4'][i%3]);
  if(c.image){const img=document.createElement('img');img.src=c.image;img.alt=c.name||'Board picture';el.appendChild(img)}
  const content=document.createElement('div');content.className='content';content.contentEditable='true';content.spellcheck=true;content.textContent=c.text||'';content.addEventListener('input',()=>{c.text=content.innerText;save()});content.addEventListener('blur',()=>{c.text=content.innerText;save()});content.addEventListener('pointerdown',e=>e.stopPropagation());content.addEventListener('dblclick',e=>e.stopPropagation());el.appendChild(content);
  const meta=document.createElement('div');meta.className='meta';meta.innerHTML='<span>NOTE</span><span>drag to move</span>';el.appendChild(meta);
  const colorBtn=document.createElement('button');colorBtn.className='color-edit';colorBtn.textContent='◉';colorBtn.title='Change note color';colorBtn.setAttribute('aria-label','Change note color');colorBtn.addEventListener('pointerdown',e=>e.stopPropagation());colorBtn.addEventListener('click',e=>{e.stopPropagation();selected=c.id;openPalette(c.id)});el.appendChild(colorBtn);
  const del=document.createElement('button');del.className='remove';del.textContent='×';del.title='Delete note';del.addEventListener('click',e=>{e.stopPropagation();removeCard(c.id)});el.appendChild(del);
  el.addEventListener('pointerdown',e=>startDrag(e,c,el));el.addEventListener('click',e=>{if(connectMode){chooseConnection(c.id);return}selected=c.id;if(!e.target.isContentEditable && !e.target.closest('.content'))render();else el.classList.add('selected')});cardsEl.appendChild(el);
 });
 drawThreads();empty.style.display=state.cards.length?'none':'grid';
}
function drawThreads(){
 state.threads.forEach(t=>{const a=state.cards.find(c=>c.id===t.a),b=state.cards.find(c=>c.id===t.b);if(!a||!b)return;
  const ax=a.x+120,ay=a.y+60,bx=b.x+120,by=b.y+60,dx=bx-ax;
  const path=`M ${ax} ${ay} C ${ax+dx*.42} ${ay}, ${bx-dx*.42} ${by}, ${bx} ${by}`;
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',path);p.setAttribute('class','thread');layer.appendChild(p);
  const hit=document.createElementNS('http://www.w3.org/2000/svg','path');hit.setAttribute('d',path);hit.setAttribute('class','thread-hit');hit.setAttribute('pointer-events','stroke');hit.addEventListener('click',e=>{e.stopPropagation();if(disconnectMode||confirm('Disconnect this wire?')){state.threads=state.threads.filter(x=>x.id!==t.id);drawThreads();save();if(disconnectMode){disconnectMode=false;document.getElementById('disconnect').classList.remove('primary')}}});hit.addEventListener('touchend',()=>{}, {passive:true});layer.appendChild(hit);
 });
}
function startDrag(e,c,el){
 if(e.target.closest('button')||e.target.isContentEditable)return;
 if(connectMode)return;
 e.preventDefault();selected=c.id;const scale=zoom;
 const sx=e.clientX,sy=e.clientY,ox=c.x,oy=c.y;el.setPointerCapture(e.pointerId);el.classList.add('selected');
 const move=ev=>{c.x=Math.max(0,ox+(ev.clientX-sx)/scale);c.y=Math.max(0,oy+(ev.clientY-sy)/scale);el.style.left=c.x+'px';el.style.top=c.y+'px';drawThreads()};
 const up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);save();render()};
 el.addEventListener('pointermove',move);el.addEventListener('pointerup',up,{once:true});
}
function addCard(data={}){const c={id:uid(),x:120+Math.random()*260,y:100+Math.random()*220,text:'',image:null,color:defaultNoteColor,tilt:(Math.random()*2-1)*1.3,...data};state.cards.push(c);selected=c.id;render();save();setTimeout(()=>{const el=cardsEl.querySelector(`[data-id="${c.id}"] .content`);if(el)el.focus()},40)}
function removeCard(id){state.cards=state.cards.filter(c=>c.id!==id);state.threads=state.threads.filter(t=>t.a!==id&&t.b!==id);if(selected===id)selected=null;render();save()}
function chooseConnection(id){if(!connectFirst){connectFirst=id;document.getElementById('connectHint').textContent='Now select the second card. Press Esc to cancel.';return}if(connectFirst!==id&&!state.threads.some(t=>(t.a===connectFirst&&t.b===id)||(t.a===id&&t.b===connectFirst))){state.threads.push({id:uid(),a:connectFirst,b:id})}connectFirst=null;connectMode=false;document.getElementById('connectHint').style.display='none';document.getElementById('connect').classList.remove('primary');render();save()}
let defaultNoteColor='#f8e8a8';
const palette=document.getElementById('notePalette');let paletteCardId=null;
function openPalette(id){paletteCardId=id;palette.hidden=false;const c=state.cards.find(x=>x.id===id);if(c)document.getElementById('customNoteColor').value=c.color||'#f8e8a8'}
function setNoteColor(color){if(!/^#[0-9a-f]{6}$/i.test(color))return;const c=state.cards.find(x=>x.id===paletteCardId);if(c){c.color=color;defaultNoteColor=color;const el=Array.from(cardsEl.children).find(x=>x.dataset.id===c.id);if(el)el.style.setProperty('--note-color',color);save()}}
palette.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>setNoteColor(b.dataset.color));
document.getElementById('customNoteColor').addEventListener('input',e=>setNoteColor(e.target.value));
document.getElementById('closePalette').onclick=()=>{palette.hidden=true;paletteCardId=null};
const themeButton=document.getElementById('themeToggle');
function setTheme(theme){document.body.dataset.theme=theme;themeButton.textContent=theme==='midnight'?'☾ Ocean':'☾ Midnight';try{localStorage.setItem('pinboard-theme',theme)}catch(e){}}
setTheme((()=>{try{return localStorage.getItem('pinboard-theme')==='midnight'?'midnight':'ocean'}catch(e){return 'ocean'}})());
themeButton.onclick=()=>setTheme(document.body.dataset.theme==='midnight'?'ocean':'midnight');
document.getElementById('addText').onclick=()=>addCard();
const imageInput=document.getElementById('imageInput');
document.getElementById('addImage').onclick=()=>{imageInput.value='';imageInput.click()};
function isDecodableImage(file){
 return new Promise(resolve=>{
  if(file.type && !file.type.toLowerCase().startsWith('image/')) return resolve(false);
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);resolve(img.naturalWidth>0&&img.naturalHeight>0)};
  img.onerror=()=>{URL.revokeObjectURL(url);resolve(false)};
  img.src=url;
 });
}
function readAsDataURL(file){
 return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error||new Error('Could not read file'));reader.readAsDataURL(file)});
}
imageInput.addEventListener('change',async e=>{
 const files=Array.from(e.target.files||[]);if(!files.length)return;
 let added=0, rejected=0;
 for(const file of files){
  if(file.size>12*1024*1024){rejected++;continue}
  if(!(await isDecodableImage(file))){rejected++;continue}
  try{const data=await readAsDataURL(file);addCard({image:data,text:file.name});added++}catch(err){rejected++}
 }
 imageInput.value='';
 if(rejected)alert(`${added} picture(s) added. ${rejected} file(s) skipped because they were not supported images or exceeded 12 MB.`);
});
document.getElementById('connect').onclick=()=>{connectMode=!connectMode;disconnectMode=false;connectFirst=null;document.getElementById('disconnect').classList.remove('primary');document.getElementById('connectHint').textContent='Select the first card, then the second card to connect them. Press Esc to cancel.';document.getElementById('connectHint').style.display=connectMode?'block':'none';document.getElementById('connect').classList.toggle('primary',connectMode)};
document.getElementById('disconnect').onclick=()=>{disconnectMode=!disconnectMode;connectMode=false;connectFirst=null;document.getElementById('connect').classList.remove('primary');document.getElementById('connectHint').textContent='Tap a wire to disconnect it. Tap Disconnect again to cancel.';document.getElementById('connectHint').style.display=disconnectMode?'block':'none';document.getElementById('disconnect').classList.toggle('primary',disconnectMode)};
document.getElementById('zoomIn').onclick=()=>applyZoom(zoom+.15);
document.getElementById('zoomOut').onclick=()=>applyZoom(zoom-.15);
document.getElementById('zoomReset').onclick=()=>applyZoom(1);
const navToggle=document.getElementById('navToggle');
navToggle.onclick=()=>{document.body.classList.add('nav-hidden');};
document.getElementById('showNav').onclick=()=>{document.body.classList.remove('nav-hidden');};

let pinchStart=null;workspace.addEventListener('touchstart',e=>{if(e.touches.length===2)pinchStart={distance:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),zoom};},{passive:true});workspace.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinchStart){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);applyZoom(pinchStart.zoom*d/pinchStart.distance,(e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2)}},{passive:true});workspace.addEventListener('touchend',e=>{if(e.touches.length<2)pinchStart=null},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(connectMode||disconnectMode)){connectMode=false;disconnectMode=false;connectFirst=null;document.getElementById('connectHint').style.display='none';document.getElementById('connect').classList.remove('primary');document.getElementById('disconnect').classList.remove('primary')}});
document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({app:'Pinboard Offline',version:1,exportedAt:new Date().toISOString(),board:state})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pinboard-board.json';a.click();URL.revokeObjectURL(a.href)};
const importInput=document.getElementById('importInput');
document.getElementById('import').onclick=()=>{importInput.value='';importInput.click()};
importInput.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text()),incoming=data.board;if(!incoming||!Array.isArray(incoming.cards)||!Array.isArray(incoming.threads))throw Error('This is not a valid Pinboard export.');if(!confirm('Import this board? Your current board will be replaced. Export a backup first if needed.'))return;state={version:1,cards:incoming.cards,threads:incoming.threads};selected=null;render();save();alert('Board imported with its pictures, positions and threads.')}catch(err){alert('Import failed: '+err.message)}e.target.value=''};
document.getElementById('clear').onclick=()=>{if(confirm('Clear the entire board? This cannot be undone unless you exported it.')){state={version:1,cards:[],threads:[]};selected=null;render();save()}};
(async()=>{const saved=await dbGet();if(saved&&Array.isArray(saved.cards)&&Array.isArray(saved.threads))state=saved;render();applyZoom(1)})();
})();
</script>
