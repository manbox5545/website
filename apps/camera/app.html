<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>CAMPLAGUE</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #000;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action: manipulation;
}


/* =====================================================
   LOADING SCREEN
===================================================== */

#loadingScreen {
    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #000;

    transition:
        opacity .7s ease,
        visibility .7s ease;
}

#loadingScreen.hide {
    opacity: 0;
    visibility: hidden;
}

.loadingAura {
    position: absolute;

    width: 70vw;
    height: 70vw;

    max-width: 650px;
    max-height: 650px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,255,130,.22),
            rgba(0,220,255,.16),
            rgba(0,70,255,.10),
            transparent 70%
        );

    filter: blur(45px);

    animation:
        auraPulse 3s ease-in-out infinite,
        auraRotate 8s linear infinite;
}

.loadingContent {
    position: relative;

    z-index: 2;

    text-align: center;
}

.logo {
    font-size:
        clamp(45px, 12vw, 105px);

    font-weight: 900;

    letter-spacing: 5px;

    background:
        linear-gradient(
            100deg,
            #00ff88,
            #00f5d4,
            #00cfff,
            #0066ff,
            #00ff88
        );

    background-size: 300% 300%;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        gradientMove 4s ease infinite,
        logoFloat 2s ease-in-out infinite;
}

.loadingSubtitle {
    margin-top: 16px;

    color:
        rgba(180,255,240,.55);

    font-size: 11px;

    letter-spacing: 5px;

    text-transform: uppercase;
}

.loader {
    width: min(280px,65vw);

    height: 4px;

    margin:
        38px auto 0;

    border-radius: 10px;

    overflow: hidden;

    background:
        rgba(255,255,255,.08);
}

.loaderBar {
    width: 0%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #00ff88,
            #00f5d4,
            #00cfff,
            #0066ff
        );

    box-shadow:
        0 0 18px rgba(0,255,200,.8);

    animation:
        loadingProgress 2s
        cubic-bezier(.22,1,.36,1)
        forwards;
}


/* =====================================================
   APP
===================================================== */

#app {
    position: fixed;

    inset: 0;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity .6s ease;
}

#app.show {
    opacity: 1;

    visibility: visible;
}


/* =====================================================
   GALLERY
===================================================== */

#galleryScreen {
    position: absolute;

    inset: 0;

    overflow-y: auto;

    padding:
        25px 18px
        110px;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(0,255,180,.08),
            transparent 35%
        ),
        #050505;
}

.galleryHeader {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 22px;
}

.galleryTitle {
    font-size: 27px;

    font-weight: 800;

    letter-spacing: 1px;

    background:
        linear-gradient(
            90deg,
            #00ff88,
            #00d9ff,
            #0066ff
        );

    -webkit-background-clip: text;

    color: transparent;
}

.photoCount {
    color: #777;

    font-size: 12px;
}

#photoGrid {
    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 12px;
}

.photoCard {
    position: relative;

    overflow: hidden;

    border-radius: 18px;

    background: #111;

    border:
        1px solid
        rgba(255,255,255,.08);

    aspect-ratio: 1 / 1;

    animation:
        photoAppear .35s ease;
}

.photoCard img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}

.photoActions {
    position: absolute;

    left: 8px;
    right: 8px;
    bottom: 8px;

    display: flex;

    gap: 7px;
}

.photoAction {
    flex: 1;

    min-height: 36px;

    border: 1px solid
        rgba(255,255,255,.12);

    border-radius: 12px;

    background:
        rgba(0,0,0,.65);

    backdrop-filter:
        blur(12px);

    color: white;

    cursor: pointer;

    font-size: 14px;
}

.photoAction:active {
    transform: scale(.94);
}


/* =====================================================
   EMPTY GALLERY
===================================================== */

#emptyGallery {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    text-align: center;

    width: 90%;

    color: #666;
}

.emptyIcon {
    font-size: 55px;

    margin-bottom: 14px;

    opacity: .6;
}

.emptyTitle {
    color: #aaa;

    font-size: 18px;

    font-weight: 700;

    margin-bottom: 7px;
}

.emptyText {
    font-size: 13px;

    line-height: 1.5;
}


/* =====================================================
   CAMERA SCREEN
===================================================== */

#cameraScreen {
    position: absolute;

    inset: 0;

    background: #000;

    display: none;
}

#cameraScreen.active {
    display: block;
}

#camera {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
}

#camera.frontCamera {
    transform: scaleX(-1);
}



/* =====================================================
   CAMERA TOP BAR
===================================================== */

.cameraTop {
    position: absolute;

    top: 18px;

    left: 18px;
    right: 18px;

    z-index: 20;

    display: flex;

    justify-content:
        space-between;

    align-items:
        flex-start;
}

.cameraTopButton {
    width: 48px;
    height: 48px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(0,0,0,.42);

    backdrop-filter:
        blur(16px);

    color: white;

    font-size: 21px;

    cursor: pointer;

    transition:
        transform .2s ease,
        background .2s ease;
}

.cameraTopButton:active {
    transform: scale(.88);
}

.cameraTools {
    display: flex;

    flex-direction: column;

    gap: 10px;
}

.cameraTool {
    width: 48px;
    height: 48px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(0,0,0,.42);

    backdrop-filter:
        blur(16px);

    color: white;

    font-size: 20px;

    cursor: pointer;

    transition:
        .25s ease;
}

.cameraTool.active {
    background:
        rgba(0,255,180,.22);

    border-color:
        rgba(0,255,180,.5);

    box-shadow:
        0 0 20px
        rgba(0,255,180,.2);
}

.cameraTool.disabled {
    opacity: .25;

    pointer-events: none;
}


/* =====================================================
   CAMERA BOTTOM
===================================================== */

.cameraBottom {
    position: absolute;

    left: 0;
    right: 0;

    bottom: 30px;

    z-index: 20;

    display: flex;

    align-items: center;

    justify-content: center;

    height: 100px;
}


/* =====================================================
   SHUTTER AREA
===================================================== */

.cameraControls {
    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 20px;

    transition:
        transform .42s
        cubic-bezier(.22,1,.36,1);
}




/* =====================================================
   SHUTTER
===================================================== */

.shutterOuter {
    width: 76px;
    height: 76px;

    border-radius: 50%;

    border:
        3px solid white;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    flex-shrink: 0;

    transition:
        transform .18s ease;
}

.shutterOuter:active {
    transform: scale(.88);
}

.shutterInner {
    width: 62px;
    height: 62px;

    border-radius: 50%;

    background: white;

    transition:
        transform .15s ease,
        border-radius .2s ease;
}

.shutterOuter.capture
.shutterInner {
    transform: scale(.75);

    border-radius: 18px;
}


/* =====================================================
   FILTER BUTTON
===================================================== */

.filterButton {
    width: 76px;
    height: 76px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.25);

    background:
        rgba(0,0,0,.45);

    backdrop-filter:
        blur(18px);

    display: flex;

    align-items: center;

    justify-content: center;

    color: white;

    font-size: 27px;

    cursor: pointer;

    flex-shrink: 0;

    transition:
        transform .42s
        cubic-bezier(.22,1,.36,1),
        background .3s ease,
        border-color .3s ease;
}

.filterButton.active {
    background:
        rgba(255,255,255,.22);

    border-color:
        rgba(255,255,255,.65);

    transform:
        scale(.94);
}


/* =====================================================
   FILTER SLIDER HINT
===================================================== */

.filterHint {
    position: absolute;

    bottom: 105px;

    left: 50%;

    transform:
        translateX(-50%);

    color:
        rgba(255,255,255,.5);

    font-size: 10px;

    letter-spacing: 2px;

    white-space: nowrap;

    opacity: 0;

    transition:
        opacity .3s ease;
}

.cameraControls.filterActive
~ .filterHint {
    opacity: 1;
}


/* =====================================================
   FLASH MESSAGE
===================================================== */

#cameraMessage {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    z-index: 100;

    width: min(320px,85vw);

    padding: 18px;

    text-align: center;

    border-radius: 18px;

    background:
        rgba(0,0,0,.75);

    backdrop-filter:
        blur(18px);

    color: white;

    font-size: 13px;

    line-height: 1.5;

    display: none;
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes loadingProgress {

    from {
        width: 0%;
    }

    to {
        width: 100%;
    }

}

@keyframes gradientMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}

@keyframes logoFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }

}

@keyframes auraPulse {

    0%,
    100% {
        transform: scale(.9);
        opacity: .7;
    }

    50% {
        transform: scale(1.1);
        opacity: 1;
    }

}

@keyframes auraRotate {

    from {
        rotate: 0deg;
    }

    to {
        rotate: 360deg;
    }

}

@keyframes photoAppear {

    from {
        opacity: 0;
        transform: scale(.92);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}


/* =====================================================
   DESKTOP
===================================================== */


/* IMAGE PREVIEW */
#imagePreview{position:fixed;inset:0;z-index:20000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.9);backdrop-filter:blur(14px)}
#imagePreview.active{display:flex}
.previewFrame{position:relative;width:min(94vw,1100px);height:min(88vh,900px);display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:20px;background:#080808;border:1px solid rgba(255,255,255,.15)}
#previewImage{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;cursor:zoom-in;transform-origin:center center;transition:transform .15s ease}
#previewImage.zoomed{cursor:grab}
.previewClose{position:absolute;top:12px;right:12px;z-index:3;width:46px;height:46px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(0,0,0,.65);color:white;font-size:23px;cursor:pointer}
.previewHint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:7px 12px;border-radius:20px;background:rgba(0,0,0,.6);color:rgba(255,255,255,.65);font-size:10px;white-space:nowrap;pointer-events:none}
.photoCard img{cursor:zoom-in}
.cameraControls.filterActive{transform:translateX(38px)}
.cameraControls.filterActive .filterButton{order:1;border:3px solid white;background:white;color:#111;font-size:0}
.cameraControls.filterActive .filterButton::after{content:"";display:block;width:62px;height:62px;border-radius:50%;background:#111}
.cameraControls.filterActive .shutterOuter{order:2}
@media(max-width:420px){
.cameraControls.filterActive{transform:translateX(35px)}
.cameraControls.filterActive .filterButton::after{width:57px;height:57px}
}


/* B&W shutter click animation */
.cameraControls.filterActive .filterButton.capture {
    transform: scale(.88);
}

.cameraControls.filterActive .filterButton.capture::after {
    transform: scale(.72);
    border-radius: 17px;
}

.filterButton.capture {
    transition:
        transform .12s ease,
        background .12s ease,
        border-color .12s ease;
}


/* CENTER SHUTTER + EFFECTS */
.cameraControls {
    width: 100%;
    justify-content: center;
    transform: none !important;
}

.effectsArea {
    position: absolute;
    right: 22px;
    bottom: 12px;
    z-index: 25;
}

.effectsButton {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.5);
    backdrop-filter: blur(16px);
    color: white;
    font-size: 24px;
    cursor: pointer;
    transition: transform .2s ease, background .2s ease;
}

.effectsButton:active {
    transform: scale(.88);
}

.effectsButton.active {
    background: rgba(0,255,180,.2);
    border-color: rgba(0,255,180,.5);
}

.effectsMenu {
    position: absolute;
    right: 0;
    bottom: 68px;
    width: 175px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 16px;
    background: rgba(5,5,5,.88);
    backdrop-filter: blur(18px);
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px) scale(.95);
    transform-origin: bottom right;
    transition: .22s ease;
}

.effectsMenu.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
}

.effectOption {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 46px;
    padding: 7px 9px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: transparent;
    color: white;
    text-align: left;
    cursor: pointer;
}

.effectOption.active {
    background: rgba(255,255,255,.1);
    border-color: rgba(255,255,255,.15);
}

.effectPreview {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border-radius: 8px;
    background: linear-gradient(135deg,#777,#ddd,#333);
}

.bwPreview {
    filter: grayscale(1);
}

.effectPopup {
    position: absolute;
    left: 50%;
    bottom: 128px;
    z-index: 30;
    transform: translate(-50%,10px);
    padding: 10px 16px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 22px;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(15px);
    color: white;
    font-size: 11px;
    letter-spacing: 1.8px;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    transition: .25s ease;
}

.effectPopup.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%,0);
}

#camera.bwPreviewLive {
    filter: grayscale(1);
}

.shutterOuter.capture {
    transform: scale(.86);
}

.shutterOuter.capture .shutterInner {
    transform: scale(.74);
    border-radius: 18px;
}

@media (max-width:420px) {
    .effectsArea {
        right: 12px;
        bottom: 10px;
    }

    .effectsButton {
        width: 54px;
        height: 54px;
    }

    .effectsMenu {
        bottom: 62px;
    }
}

@media (min-width: 700px) {

    #photoGrid {
        grid-template-columns:
            repeat(4,1fr);

        max-width: 1000px;

        margin: auto;
    }

    .galleryHeader {
        max-width: 1000px;

        margin-left: auto;
        margin-right: auto;
    }

}




.gallerySectionTitle{
    max-width:1000px;
    margin:28px auto 12px;
    color:rgba(180,255,240,.62);
    font-size:11px;
    font-weight:800;
    letter-spacing:2px;
}
#videoGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    max-width:1000px;
    margin:0 auto;
}
.videoCard{
    position:relative;
    overflow:hidden;
    border-radius:18px;
    background:#111;
    border:1px solid rgba(255,255,255,.08);
    aspect-ratio:9/16;
}
.videoCard video{
    width:100%;height:100%;display:block;object-fit:cover;
}
.videoCard::after{
    content:"▶";
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
    background:rgba(0,255,180,.18);border:1px solid rgba(0,255,180,.45);
    color:#8fffd3;backdrop-filter:blur(12px);pointer-events:none;
}
.videoCard .photoActions{z-index:2}
#videoPreview{
    position:fixed;inset:0;z-index:21000;display:none;align-items:center;justify-content:center;
    padding:18px;background:rgba(0,0,0,.92);backdrop-filter:blur(16px);
}
#videoPreview.active{display:flex}
.videoPreviewFrame{
    position:relative;width:min(94vw,720px);height:min(90vh,900px);
    display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:22px;
    background:#050505;border:1px solid rgba(0,255,180,.18);box-shadow:0 0 40px rgba(0,255,180,.08);
}
#previewVideo{width:100%;height:100%;object-fit:contain;background:#000}
.videoControls{
    position:absolute;left:14px;right:14px;bottom:14px;z-index:3;display:flex;align-items:center;gap:9px;
    padding:9px;border:1px solid rgba(0,255,180,.18);border-radius:16px;
    background:rgba(5,5,5,.76);backdrop-filter:blur(16px);
}
.videoControlButton{
    width:40px;height:40px;flex:0 0 40px;border-radius:12px;border:1px solid rgba(0,255,180,.28);
    background:rgba(0,255,180,.10);color:#8fffd3;font-size:16px;cursor:pointer;
}
.videoControlButton:active{transform:scale(.92);background:rgba(0,255,180,.2)}
.videoSeek{flex:1;accent-color:#00ff88;min-width:0}
@media(max-width:420px){
    #videoGrid{gap:8px}
    .videoCard{border-radius:14px}
    .videoControls{left:9px;right:9px;bottom:9px}
}

/* =====================================================
   HAMOOD!! GREEN SCREEN EFFECT
===================================================== */

#hamoodVideo{
    display:none;
    position:absolute;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
}

#compositeCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:5;
    background:#000;
}

#camera.hamoodActive{
    visibility:hidden;
}

#compositeCanvas.hamoodActive{
    display:block;
}

.hamoodBadge{
    position:absolute;
    left:50%;
    top:88px;
    z-index:35;
    transform:translate(-50%,-8px);
    padding:8px 14px;
    border:1px solid rgba(0,255,180,.35);
    border-radius:20px;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(14px);
    color:#8fffd3;
    font-size:10px;
    font-weight:800;
    letter-spacing:2px;
    opacity:0;
    visibility:hidden;
    transition:.25s ease;
    pointer-events:none;
}

.hamoodBadge.show{
    opacity:1;
    visibility:visible;
    transform:translate(-50%,0);
}

#recordingIndicator{
    position:absolute;
    left:50%;
    top:18px;
    z-index:40;
    transform:translateX(-50%);
    display:none;
    align-items:center;
    gap:8px;
    padding:8px 13px;
    border-radius:20px;
    background:rgba(0,0,0,.7);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(14px);
    font-size:11px;
    letter-spacing:1.5px;
}

#recordingIndicator.active{
    display:flex;
}

.recordingDot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#ff334f;
    box-shadow:0 0 12px rgba(255,51,79,.8);
    animation:recordingPulse 1s ease-in-out infinite;
}

@keyframes recordingPulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.45;transform:scale(.72)}
}

.hamoodOption .effectPreview{
    background:linear-gradient(135deg,#20d66b,#39f2c2,#111);
    position:relative;
    overflow:hidden;
}

.hamoodOption .effectPreview::after{
    content:"🕺";
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font-size:18px;
    background:rgba(0,255,90,.16);
}

.hamoodOption.active{
    background:rgba(0,255,160,.13);
    border-color:rgba(0,255,160,.4);
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 420px) {

    #photoGrid {
        gap: 8px;
    }

    .photoCard {
        border-radius: 14px;
    }

    .cameraControls {
        gap: 14px;
    }

    .shutterOuter,
    .filterButton {
        width: 70px;
        height: 70px;
    }

    .shutterInner {
        width: 57px;
        height: 57px;
    }

}

#openCameraButton {
    position: fixed;

    right: 22px;
    bottom: 22px;

    width: 68px;
    height: 68px;

    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2);

    background:
        linear-gradient(
            135deg,
            #00ff88,
            #00d9ff,
            #0066ff

/* =====================================================
   INDEXED DB
===================================================== */

function openDatabase() {

    return new Promise(
        (resolve, reject) => {

            const request =
                indexedDB.open(
                    "CAMPLAGUE_DB",
                    2
                );


            request.onupgradeneeded =
                event => {

                    const database =
                        event.target.result;

                    if (
                        !database.objectStoreNames
                            .contains("photos")
                    ) {

                        database.createObjectStore(
                            "photos",
                            {
                                keyPath: "id",
                                autoIncrement: true
                            }
                        );

                    }

                    if (
                        !database.objectStoreNames
                            .contains("videos")
                    ) {

                        database.createObjectStore(
                            "videos",
                            {
                                keyPath: "id",
                                autoIncrement: true
                            }
                        );

                    }

                };


            request.onsuccess =
                event => {

                    db =
                        event.target.result;

                    resolve(db);

                };


            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* =====================================================
   SAVE PHOTO
===================================================== */

function savePhoto(blob) {

    return new Promise(
        (resolve, reject) => {

            const transaction =
                db.transaction(
                    ["photos"],
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    "photos"
                );


            const request =
                store.add({

                    blob: blob,

                    createdAt:
                        Date.now()

                });


            request.onsuccess =
                () => {

                    resolve(
                        request.result
                    );

                };


            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* =====================================================
   GET ALL PHOTOS
===================================================== */

function getPhotos() {

    return new Promise(
        (resolve, reject) => {

            const transaction =
                db.transaction(
                    ["photos"],
                    "readonly"
                );

            const store =
                transaction.objectStore(
                    "photos"
                );

            const request =
                store.getAll();


            request.onsuccess =
                () => {

                    resolve(
                        request.result
                            .reverse()
                    );

                };


            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


function getVideos() {
    return new Promise((resolve, reject) => {
        const transaction = db.transaction(["videos"], "readonly");
        const store = transaction.objectStore("videos");
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result.reverse());
        request.onerror = () => reject(request.error);
    });
}

function deleteVideo(id) {
    return new Promise((resolve, reject) => {
        const transaction = db.transaction(["videos"], "readwrite");
        const store = transaction.objectStore("videos");
        const request = store.delete(id);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
    });
}

/* =====================================================
   DELETE PHOTO
===================================================== */

function deletePhoto(id) {

    return new Promise(
        (resolve, reject) => {

            const transaction =
                db.transaction(
                    ["photos"],
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    "photos"
                );


            const request =
                store.delete(id);


            request.onsuccess =
                () => resolve();


            request.onerror =
                () => reject(
                    request.error
                );

        }
    );

}

/* =====================================================
   
/* IMAGE PREVIEW */
function updatePreviewTransform(){
    previewImage.style.transform=`translate(${previewPanX}px,${previewPanY}px) scale(${previewZoom})`;
    previewImage.classList.toggle("zoomed",previewZoom>1);
}
function resetPreview(){
    previewZoom=1; previewPanX=0; previewPanY=0; updatePreviewTransform();
}
function openImagePreview(url){
    previewImage.src=url;
    resetPreview();
    imagePreview.classList.add("active");
    imagePreview.setAttribute("aria-hidden","false");
}
function closeImagePreview(){
    imagePreview.classList.remove("active");
    imagePreview.setAttribute("aria-hidden","true");
    previewImage.src="";
    resetPreview();
}
previewClose.addEventListener("click",closeImagePreview);
imagePreview.addEventListener("click",e=>{
    if(e.target===imagePreview) closeImagePreview();
});
document.addEventListener("keydown",e=>{
    if(e.key==="Escape" && imagePreview.classList.contains("active")) closeImagePreview();
});
previewFrame.addEventListener("wheel",e=>{
    e.preventDefault();
    previewZoom=Math.max(1,Math.min(5,previewZoom+(e.deltaY<0?.35:-.35)));
    if(previewZoom===1){previewPanX=0;previewPanY=0;}
    updatePreviewTransform();
},{passive:false});
previewImage.addEventListener("click",e=>{
    e.stopPropagation();
    previewZoom=previewZoom===1?2:1;
    if(previewZoom===1){previewPanX=0;previewPanY=0;}
    updatePreviewTransform();
});
previewImage.addEventListener("pointerdown",e=>{
    if(previewZoom<=1)return;
    previewDragging=true;
    previewDragStartX=e.clientX;
    previewDragStartY=e.clientY;
    previewStartPanX=previewPanX;
    previewStartPanY=previewPanY;
    previewImage.setPointerCapture(e.pointerId);
});
previewImage.addEventListener("pointermove",e=>{
    if(!previewDragging)return;
    previewPanX=previewStartPanX+e.clientX-previewDragStartX;
    previewPanY=previewStartPanY+e.clientY-previewDragStartY;
    updatePreviewTransform();
});
previewImage.addEventListener("pointerup",()=>previewDragging=false);
previewImage.addEventListener("pointercancel",()=>previewDragging=false);

function openVideoPreview(url) {
    previewVideo.src = url;
    previewVideo.currentTime = 0;
    previewVideo.muted = false;
    videoPlayPause.textContent = "▶";
    videoMute.textContent = "🔊";

function closeVideoPreview() {

videoPreviewClose.addEventListener("click", closeVideoPreview);
videoPreview.addEventListener("click", e => {

});
videoPlayPause.addEventListener("click", () => {

        previewVideo.play().catch(() => {});
    } else {

});
previewVideo.addEventListener("play", () => videoPlayPause.textContent = "⏸");
previewVideo.addEventListener("pause", () => videoPlayPause.textContent = "▶");
previewVideo.addEventListener("timeupdate", () => {
    if (previewVideo.duration) videoSeek.value = (previewVideo.currentTime / previewVideo.duration) * 100;
});

/* =====================================================
   CAMERA START
===================================================== */

async function startCamera() {

    stopCamera();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showCameraMessage(
            "Camera is not available in this browser.<br><br>" +
            "Make sure CAMPLAGUE is opened over HTTPS."
        );
        return;
    }

    if (!window.isSecureContext) {
        showCameraMessage(
            "CAMPLAGUE is not running in a secure context.<br><br>" +
            "Open the hosted HTTPS address, not a file:// address."
        );
        return;
    }

    cameraMessage.style.display = "none";

    let videoStream = null;
    let lastCameraError = null;

    // Mobile browsers can be picky about camera constraints.
    // Try the requested lens first, then progressively simpler requests.
    const cameraRequests = [
        {
            video: {
                facingMode: { exact: facingMode },
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            },
            audio: false
        },
        {
            video: {
                facingMode: facingMode,
                width: { ideal: 1280 },
                height: { ideal: 720 }
            },
            audio: false
        },
        {
            video: true,
            audio: false
        }
    ];

    for (const constraints of cameraRequests) {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia(constraints);
            break;
        } catch (error) {
            lastCameraError = error;
            console.warn("Camera request failed:", constraints, error);
        }
    }

    if (!videoStream) {
        console.error("All camera requests failed:", lastCameraError);

        let message = "Camera could not be started.<br><br>";
        const name = lastCameraError?.name || "UnknownError";

        if (name === "NotAllowedError" || name === "PermissionDeniedError") {
            message +=
                "The browser is blocking camera access for this website. " +
                "Open this site's browser permissions and set Camera to Allow, then reload CAMPLAGUE.";
        } else if (name === "NotReadableError" || name === "TrackStartError") {
            message +=
                "The camera is currently busy. Close other apps using the camera and try again.";
        } else if (name === "NotFoundError" || name === "OverconstrainedError") {
            message +=
                "The requested camera is unavailable. Try switching between front and rear camera.";
        } else if (name === "SecurityError") {
            message +=
                "The browser blocked camera access because of the page security settings. Use HTTPS.";
        } else {
            message +=
                `Browser error: ${name}. Reload the page and try again.`;
        }

        showCameraMessage(message);
        return;
    }

    cameraStream = videoStream;
    cameraTrack = videoStream.getVideoTracks()[0] || null;

    // Do NOT request microphone until the camera is already working.
    // A microphone permission failure must never break the camera.
    try {
        const micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            },
            video: false
        });

        micStream.getAudioTracks().forEach(track => {
            cameraStream.addTrack(track);
        });

    } catch (micError) {
        console.warn("Microphone unavailable:", micError);
    }

    camera.srcObject = cameraStream;
    camera.muted = true;
    camera.playsInline = true;

    camera.classList.toggle(
        "frontCamera",
        facingMode === "user"
    );

    torchEnabled = false;
    updateFlashButton();

    try {
        await camera.play();
    } catch (playError) {
        console.warn("Camera autoplay/play failed:", playError);
    }

    if (camera.readyState < 1) {
        await new Promise(resolve => {
            const timeout = setTimeout(resolve, 3000);
            const onLoaded = () => {
                clearTimeout(timeout);
                camera.removeEventListener("loadedmetadata", onLoaded);
                resolve();
            };
            camera.addEventListener("loadedmetadata", onLoaded);
        });
    }

    if (hamoodEnabled) {
        resizeCompositeCanvas();
        setupHamoodAudio();
    }
}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {

    if (!cameraStream)
        return;


    cameraStream
        .getTracks()
        .forEach(
            track =>
                track.stop()
        );


    cameraStream = null;

    cameraTrack = null;

}

===================================================== */

async function openCamera() {

    galleryScreen.style.display =

}

/* =====================================================

function updateFlashButton() {

    if (!cameraTrack) {

        flashButton.classList
            .add("disabled");

        return;

    }


    const capabilities =
        typeof cameraTrack
            .getCapabilities ===
            "function"

            ? cameraTrack
                .getCapabilities()

            : {};


    /*
        Torch is normally available
        only on supported rear cameras.
    */

    const frontCamera =
        facingMode === "user";


    if (
        frontCamera ||
        !capabilities.torch
    ) {

        flashButton.classList
            .add("disabled");

        torchEnabled = false;

        return;

    }


    flashButton.classList
        .remove("disabled");

}


/* =====================================================
   FLASHLIGHT
===================================================== */

flashButton.addEventListener(
    "click",
    async () => {

        if (!cameraTrack)
            return;


        const capabilities =
            cameraTrack
                .getCapabilities();


        if (!capabilities.torch)
            return;


        torchEnabled =
            !torchEnabled;


        try {

            await cameraTrack
                .applyConstraints({

                    advanced: [
                        {
                            torch:
                                torchEnabled
                        }
                    ]

                });


            flashButton
                .classList
                .toggle(
                    "active",
                    torchEnabled
                );


        } catch (error) {

            torchEnabled = false;

            flashButton
                .classList
                .remove(
                    "active"
                );

        }

    }
);

   EFFECTS
===================================================== */

effectsButton.addEventListener("click", event => {
    event.stopPropagation();

    const isOpen = effectsMenu.classList.toggle("open");
    effectsButton.classList.toggle("active", isOpen);
    effectsMenu.setAttribute("aria-hidden", String(!isOpen));
});

defaultEffectButton.addEventListener("click", () => {
    setEffect("default");
});

bwEffectButton.addEventListener("click", () => {
    setEffect("bw");
});

const hamoodEffectButton =
    document.getElementById("hamoodEffectButton");

hamoodEffectButton.addEventListener("click", () => {
    setEffect("hamood");
});

function setEffect(effect) {

    bwEnabled = effect === "bw";
    const enableHamood = effect === "hamood";

    defaultEffectButton.classList.toggle(
        "active",
        effect === "default"
    );

    bwEffectButton.classList.toggle(
        "active",
        effect === "bw"
    );

    hamoodEffectButton.classList.toggle(
        "active",
        enableHamood
    );

    camera.classList.toggle(
        "bwPreviewLive",
        effect === "bw"
    );

    if (enableHamood) {
        startHamood();
    } else {
        stopHamood();

        if (effect === "bw") {

            effectPopup.textContent =
                "BLACK AND WHITE";

            effectPopup.classList.add("show");

            clearTimeout(setEffect.popupTimer);

            setEffect.popupTimer =
                setTimeout(() => {
                    effectPopup.classList.remove("show");
                }, 1800);

        } else {
            effectPopup.classList.remove("show");
        }
    }

    effectsMenu.classList.remove("open");
    effectsButton.classList.remove("active");
    effectsMenu.setAttribute("aria-hidden", "true");
}

document.addEventListener("click", event => {

    if (
        !effectsMenu.contains(event.target) &&
        event.target !== effectsButton
    ) {

        effectsMenu.classList.remove("open");
        effectsButton.classList.remove("active");

        effectsMenu.setAttribute(
            "aria-hidden",
            "true"
        );

    }

});


/* =====================================================
   HAMOOD!! GREEN SCREEN
===================================================== */

function startHamood() {

    hamoodEnabled = true;

    camera.classList.add("hamoodActive");
    compositeCanvas.classList.add("hamoodActive");
    hamoodBadge.classList.add("show");

    hamoodVideo.currentTime = 0;
    hamoodVideo.muted = false;

    hamoodVideo.play().catch(error => {
        console.warn(
            "HAMOOD video could not play:",
            error
        );
    });

    resizeCompositeCanvas();

    if (!hamoodAnimationFrame) {
        renderHamoodFrame();
    }

    setupHamoodAudio();

}


function stopHamood() {

    hamoodEnabled = false;

    if (hamoodAnimationFrame) {
        cancelAnimationFrame(
            hamoodAnimationFrame
        );
        hamoodAnimationFrame = null;
    }

    hamoodVideo.pause();
    hamoodVideo.currentTime = 0;

    camera.classList.remove("hamoodActive");
    compositeCanvas.classList.remove("hamoodActive");
    hamoodBadge.classList.remove("show");

    if (recordingStarted) {
        stopRecording();
    }

    teardownHamoodAudio();

}


function resizeCompositeCanvas() {

    if (!camera.videoWidth || !camera.videoHeight)
        return;

    compositeCanvas.width =
        camera.videoWidth;

    compositeCanvas.height =
        camera.videoHeight;

}


function drawCover(
    context,
    source,
    sourceWidth,
    sourceHeight,
    destinationWidth,
    destinationHeight
) {

    const sourceRatio =
        sourceWidth / sourceHeight;

    const destinationRatio =
        destinationWidth / destinationHeight;

    let sx = 0;
    let sy = 0;
    let sw = sourceWidth;
    let sh = sourceHeight;

    if (sourceRatio > destinationRatio) {

        sw =
            sourceHeight *
            destinationRatio;

        sx =
            (sourceWidth - sw) / 2;

    } else {

        sh =
            sourceWidth /
            destinationRatio;

        sy =
            (sourceHeight - sh) / 2;

    }

    context.drawImage(
        source,
        sx,
        sy,
        sw,
        sh,
        0,
        0,
        destinationWidth,
        destinationHeight
    );

}


function drawHamoodWithChromaKey(context, video, canvasWidth, canvasHeight) {
    if (!video.videoWidth || !video.videoHeight) return;

    const targetHeight = canvasHeight * HAMOOD_SCALE;
    const targetWidth = targetHeight * video.videoWidth / video.videoHeight;
    const x = (canvasWidth - targetWidth) / 2;
    const y = canvasHeight - targetHeight;

    const scale = Math.min(1, HAMOOD_PROCESS_MAX_WIDTH / video.videoWidth);
    const bufferWidth = Math.max(1, Math.round(video.videoWidth * scale));
    const bufferHeight = Math.max(1, Math.round(video.videoHeight * scale));

    if (!drawHamoodWithChromaKey.buffer ||
        drawHamoodWithChromaKey.buffer.width !== bufferWidth ||
        drawHamoodWithChromaKey.buffer.height !== bufferHeight) {
        drawHamoodWithChromaKey.buffer = document.createElement("canvas");
        drawHamoodWithChromaKey.buffer.width = bufferWidth;
        drawHamoodWithChromaKey.buffer.height = bufferHeight;
        drawHamoodWithChromaKey.bufferContext = drawHamoodWithChromaKey.buffer.getContext("2d", { willReadFrequently: true });
    }

    const buffer = drawHamoodWithChromaKey.buffer;
    const bufferContext = drawHamoodWithChromaKey.bufferContext;
    bufferContext.clearRect(0, 0, bufferWidth, bufferHeight);
    bufferContext.drawImage(video, 0, 0, bufferWidth, bufferHeight);

    const image = bufferContext.getImageData(0, 0, bufferWidth, bufferHeight);
    const pixels = image.data;

    for (let i = 0; i < pixels.length; i += 4) {
        const r = pixels[i];
        const g = pixels[i + 1];
        const b = pixels[i + 2];
        const greenStrength = g - Math.max(r, b);
        const isGreen = g > HAMOOD_GREEN_THRESHOLD &&
                        g > r * HAMOOD_GREEN_DOMINANCE &&
                        g > b * HAMOOD_GREEN_DOMINANCE &&
                        greenStrength > 10;

        if (isGreen) {
            const alpha = Math.max(0, Math.min(255, 255 - greenStrength * 10));
            pixels[i + 3] = alpha;
        } else {
            pixels[i + 3] = 255;
        }
    }

    bufferContext.putImageData(image, 0, 0);
    context.save();
    context.imageSmoothingEnabled = true;
    context.imageSmoothingQuality = "high";
    context.drawImage(buffer, x, y, targetWidth, targetHeight);
    context.restore();
}


function renderHamoodFrame(now = performance.now()) {
    if (!hamoodEnabled) return;

    if (now - hamoodLastRenderTime < (1000 / HAMOOD_RENDER_FPS)) {
        hamoodAnimationFrame = requestAnimationFrame(renderHamoodFrame);
        return;
    }
    hamoodLastRenderTime = now;

    if (camera.videoWidth && camera.videoHeight) {
        const context = compositeCanvas.getContext("2d");
        if (compositeCanvas.width !== camera.videoWidth || compositeCanvas.height !== camera.videoHeight) {
            resizeCompositeCanvas();
        }

        context.clearRect(0, 0, compositeCanvas.width, compositeCanvas.height);
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = "high";
        drawCover(context, camera, camera.videoWidth, camera.videoHeight, compositeCanvas.width, compositeCanvas.height);

        if (hamoodVideo.readyState >= 2) {
            drawHamoodWithChromaKey(context, hamoodVideo, compositeCanvas.width, compositeCanvas.height);
        }
    }

    hamoodAnimationFrame = requestAnimationFrame(renderHamoodFrame);
}


window.addEventListener(
    "resize",
    () => {
        if (hamoodEnabled) {
            resizeCompositeCanvas();
        }
    }
);


/* =====================================================
   HAMOOD AUDIO MIXER
===================================================== */

async function setupHamoodAudio() {

    if (hamoodAudioContext)
        return;

    if (!cameraStream)
        return;

    try {

        const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContextClass)
            return;

        hamoodAudioContext =
            new AudioContextClass();

        hamoodAudioDestination =
            hamoodAudioContext
                .createMediaStreamDestination();

        hamoodMicSource =
            hamoodAudioContext
                .createMediaStreamSource(
                    cameraStream
                );

        hamoodMicSource.connect(
            hamoodAudioDestination
        );

        if (
            typeof hamoodVideo.captureStream ===
            "function"
        ) {

            const videoStream =
                hamoodVideo.captureStream();

            if (
                videoStream.getAudioTracks().length
            ) {

                hamoodVideoSource =
                    hamoodAudioContext
                        .createMediaStreamSource(
                            videoStream
                        );

                hamoodVideoSource.connect(
                    hamoodAudioDestination
                );

            }

        }

        await hamoodAudioContext.resume();

    } catch (error) {

        console.error(
            "HAMOOD audio setup failed:",
            error
        );

    }

}


function teardownHamoodAudio() {

    if (hamoodMicSource) {
        try {
            hamoodMicSource.disconnect();
        } catch {}
    }

    if (hamoodVideoSource) {
        try {
            hamoodVideoSource.disconnect();
        } catch {}
    }

    if (hamoodAudioContext) {
        hamoodAudioContext.close().catch(() => {});
    }

    hamoodAudioContext = null;
    hamoodAudioDestination = null;
    hamoodMicSource = null;
    hamoodVideoSource = null;

}


/* =====================================================
   LONG-PRESS RECORDING
===================================================== */

function beginShutterPress() {

    clearTimeout(longPressTimer);

    longPressTriggered = false;

    if (!hamoodEnabled)
        return;

    longPressTimer =
        setTimeout(() => {

            longPressTriggered = true;
            startRecording();

        }, 500);

}


function endShutterPress() {

    clearTimeout(longPressTimer);

    if (
        hamoodEnabled &&
        recordingStarted
    ) {

        stopRecording();
        return;

    }

    if (!longPressTriggered) {

        capturePhoto(bwEnabled);

    }

}


shutterButton.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        shutterButton.setPointerCapture?.(
            event.pointerId
        );

        beginShutterPress();

    }
);


shutterButton.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        endShutterPress();

    }
);


shutterButton.addEventListener(
    "pointercancel",
    () => {

        clearTimeout(longPressTimer);

        if (recordingStarted) {
            stopRecording();
        }

    }
);


shutterButton.addEventListener(
    "click",
    event => {

        event.preventDefault();
        event.stopPropagation();

    }
);


async function startRecording() {

    if (recordingStarted)
        return;

    if (!hamoodEnabled)
        return;

    if (!camera.videoWidth)
        return;

    try {

        await setupHamoodAudio();

        const canvasStream =
            compositeCanvas.captureStream(HAMOOD_RENDER_FPS);

        const mixedStream =
            new MediaStream(
                canvasStream.getVideoTracks()
            );

        if (
            hamoodAudioDestination
        ) {

            hamoodAudioDestination
                .stream
                .getAudioTracks()
                .forEach(track => {

                    mixedStream.addTrack(track);

                });

        }

        const mimeTypes = [
            "video/webm;codecs=vp9,opus",
            "video/webm;codecs=vp8,opus",
            "video/webm"
        ];

        const supportedType =
            mimeTypes.find(
                type =>
                    MediaRecorder.isTypeSupported(
                        type
                    )
            );

        mediaRecorder =
            supportedType
                ? new MediaRecorder(
                    mixedStream,
                    {
                        mimeType:
                            supportedType,
                        videoBitsPerSecond:
                            6000000
                    }
                )
                : new MediaRecorder(
                    mixedStream
                );

        recordedChunks = [];

        mediaRecorder.ondataavailable =
            event => {

                if (event.data.size > 0) {
                    recordedChunks.push(
                        event.data
                    );
                }

            };

        mediaRecorder.onstop =
            async () => {

                const blob =
                    new Blob(
                        recordedChunks,
                        {
                            type:
                                mediaRecorder.mimeType ||
                                "video/webm"
                        }
                    );

                try {

                    await saveRecording(
                        blob
                    );

                } catch (error) {

                    console.error(
                        "Recording save failed:",
                        error
                    );

                }

                showCameraMessage(
                    "HAMOOD!! recording saved to your gallery."
                );

                recordingStarted = false;

                recordingIndicator.classList.remove(
                    "active"
                );

            };

        mediaRecorder.onerror =
            event => {

                console.error(
                    "Recording error:",
                    event.error
                );

                recordingStarted = false;

                recordingIndicator.classList.remove(
                    "active"
                );

                showCameraMessage(
                    "Recording failed."
                );

            };

        mediaRecorder.start(100);

        recordingStarted = true;

        recordingIndicator.classList.add(
            "active"
        );

    } catch (error) {

        console.error(
            "Could not start recording:",
            error
        );

        recordingStarted = false;

        showCameraMessage(
            "Could not start recording."
        );

    }

}


function stopRecording() {

    clearTimeout(longPressTimer);

    if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ) {

        mediaRecorder.stop();

    }

}


function saveRecording(blob) {

    return new Promise(
        (resolve, reject) => {

            if (!db) {
                reject(
                    new Error(
                        "Database is not ready."
                    )
                );
                return;
            }

            const transaction =
                db.transaction(
                    ["videos"],
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    "videos"
                );

            const request =
                store.add({
                    blob: blob,
                    createdAt: Date.now(),
                    type: "HAMOOD!!"
                });

            request.onsuccess =
                () => resolve(
                    request.result
                );

            request.onerror =
                () => reject(
                    request.error
                );

        }
    );

}


hamoodVideo.addEventListener(
    "ended",
    () => {

        if (hamoodEnabled) {

            hamoodVideo.currentTime = 0;

            hamoodVideo.play().catch(() => {});

        }

    }
);


/* CENTER SHUTTER */
shutterButton.addEventListener("click", () => {
    capturePhoto(bwEnabled);
});

/* =====================================================
   CAPTURE PHOTO
===================================================== */

async function capturePhoto(useBW = bwEnabled) {

    if (!camera.videoWidth)
        return;


    /*
        Shutter animation
    */

    const activeShutter =
        shutterButton;

    activeShutter
        .classList
        .add("capture");


    setTimeout(() => {

        activeShutter
            .classList
            .remove("capture");

    }, 180);


    const width =
        camera.videoWidth;

    const height =
        camera.videoHeight;


    captureCanvas.width =
        width;

    captureCanvas.height =
        height;


    const context =
        captureCanvas
            .getContext("2d");


    /*
        Mirror selfie camera
        so front camera behaves
        naturally.
    */

        /*
        Apply B&W only to
        the captured photo.
    */

    if (useBW) {

        context.filter =
            "grayscale(1)";

    } else {

        context.filter =
            "none";

    }


    context.drawImage(
        camera,
        0,
        0,
        width,
        height
    );


    context.filter =
        "none";


    const blob =
        await new Promise(
            resolve => {

                captureCanvas
                    .toBlob(
                        resolve,
                        "image/jpeg",
                        .92
                    );

            }
        );


    if (!blob)
        return;


    try {

        await savePhoto(
            blob
        );

        /*
            Small gallery update
            without leaving camera.
        */

        console.log(
            "Photo saved locally:",
            blob.size,
            "bytes"
        );

    } catch (error) {

        console.error(
            "Save failed:",
            error
        );

        showCameraMessage(
            "Could not save the photo."
        );

    }

}


/* =====================================================
   CAMERA MESSAGE
===================================================== */

function showCameraMessage(
    message
) {

    cameraMessage.innerHTML =
        message;

    cameraMessage.style.display =
        "block";


    setTimeout(() => {

        cameraMessage.style.display =
            "none";

    }, 3000);

}

   INITIALIZATION
===================================================== */

(async function init() {

    try {

        await openDatabase();

        await renderGallery();

    } catch (error) {

        console.error(
            "Database error:",
            error
        );

        alert(
            "CAMPLAGUE could not initialize local storage."
        );

    }

})();
