<!-- Automatic three-second start countdown -->
<script>
window.rideStarted=false;
(function(){
 const overlay=document.getElementById("countdown");
 const card=document.getElementById("countdownCard");
 const number=document.getElementById("countdownNumber");
 let count=3;
 const timer=setInterval(()=>{
  count--;
  if(count>0)number.textContent=String(count);
  else{
   clearInterval(timer);
   card.classList.add("go");
   number.textContent="GO!";
   window.rideStarted=true;
   setTimeout(()=>{overlay.style.display="none";},550);
  }
 },1000);
})();
</script>

// Lightweight painted sky dome with soft cloud bands.
function makeSkyTexture(){
 const c=document.createElement("canvas");
 c.width=1024;c.height=512;
 const ctx=c.getContext("2d");
 const g=ctx.createLinearGradient(0,0,0,512);
 g.addColorStop(0,"#4e83a4");g.addColorStop(.48,"#a8cbd6");
 g.addColorStop(.78,"#d6d6c9");g.addColorStop(1,"#e5c7a8");
 ctx.fillStyle=g;ctx.fillRect(0,0,1024,512);
 for(let i=0;i<115;i++){
  const x=Math.random()*1024,y=70+Math.random()*270;
  const w=35+Math.random()*125,h=8+Math.random()*24;
  const cloud=ctx.createRadialGradient(x,y,2,x,y,w);
  cloud.addColorStop(0,"rgba(255,255,255,.34)");
  cloud.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=cloud;ctx.beginPath();ctx.ellipse(x,y,w,h,0,0,Math.PI*2);ctx.fill();
 }
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;return tex;
}

roadCanvas.width=roadCanvas.height=256;

function box(parent,w,h,d,mat,x,y,z){

  new THREE.BoxGeometry(w,h,d),mat
 );

}

function createBoostPad(chunk){
 const pad=new THREE.Group();
 const laneIndex=Math.floor(Math.random()*3);
 pad.position.set(lanes[laneIndex],.025,-30);
 const base=new THREE.Mesh(new THREE.BoxGeometry(2.65,.075,3.8),
  new THREE.MeshStandardMaterial({color:0x087f79,emissive:0x00d9bd,emissiveIntensity:.75,roughness:.42,metalness:.25}));
 base.position.y=.035;
 pad.add(base);
 const arrowMat=new THREE.MeshStandardMaterial({color:0xeaffff,emissive:0x71fff0,emissiveIntensity:1.4,side:THREE.DoubleSide,roughness:.3});
 const shape=new THREE.Shape();
 shape.moveTo(0,.78);shape.lineTo(-.43,.12);shape.lineTo(-.16,.12);
 shape.lineTo(-.16,-.62);shape.lineTo(.16,-.62);shape.lineTo(.16,.12);
 shape.lineTo(.43,.12);shape.closePath();
 const geometry=new THREE.ShapeGeometry(shape);
 for(let i=0;i<3;i++){
  const arrow=new THREE.Mesh(geometry,arrowMat);
  arrow.rotation.x=-Math.PI/2;
  arrow.position.set(0,.095,-.95+i*.95);
  arrow.scale.setScalar(.72);
  pad.add(arrow);
 }
 chunk.add(pad);
 const record={mesh:pad,chunk,available:true,phase:Math.random()*Math.PI*2};
 boostPads.push(record);
 chunk.userData.boostPad=record;
}

function createChunk(z){
 const group=new THREE.Group();
 group.position.z=z;
 scene.add(group);

 box(group,12,.18,60,asphalt,0,-.12,-30);

 box(group,1,.2,60,material(0x777777),-6.5,-.1,-30);
 box(group,1,.2,60,material(0x777777),6.5,-.1,-30);

 // Road borders
 for(const side of [-1,1]){
  box(group,.13,.03,60,white,side*5.55,.01,-30);
 }

 // Lane markings
 for(let i=0;i<9;i++){

 }

}

function createBike(){

 }

  );
  fork.position.set(x,.95,.78);

  }

 const lamp=new THREE.Mesh(

 );
 lamp.position.set(0,1.35,.83);
 bike.add(lamp);

 // Rider
 const jacket=material(0x24394b);

}

let lastNetworkWrite=0;
let multiplayerReady=false;
const raceStatus=document.getElementById("raceStatus");
function connectMultiplayer(user){
 if(!activeRoomCode || !user)return;
 multiplayerUid=user.uid;
 multiplayerPlayerRef=ref(realtimeDB,`rooms/${activeRoomCode}/members/${user.uid}`);
 onDisconnect(multiplayerPlayerRef).remove().catch(err=>console.warn("Presence setup:",err));
 const membersRef=ref(realtimeDB,`rooms/${activeRoomCode}/members`);
 onValue(membersRef,snapshot=>{
  const members=snapshot.val()||{};
  const ids=new Set(Object.keys(members).filter(id=>id!==multiplayerUid));
  for(const [id,rider] of remoteRacers){
   if(!ids.has(id)){scene.remove(rider.mesh);remoteRacers.delete(id);}
  }
  for(const id of ids){
   const data=members[id]||{};
   let rider=remoteRacers.get(id);
   if(!rider){rider=makeRemoteRider(id,data);remoteRacers.set(id,rider);}
   rider.data=data;
  }
  if(raceStatus){
   raceStatus.style.display="block";
   raceStatus.textContent=`ROOM ${activeRoomCode} · ${Object.keys(members).length} RIDER(S)`;
  }
 },err=>console.warn("Room listener:",err));
 multiplayerReady=true;
}
onAuthStateChanged(firebaseAuth,user=>{
 if(user && activeRoomCode)connectMultiplayer(user);
});
function publishMultiplayerState(now){
 if(!activeRoomCode || !multiplayerUid || !multiplayerPlayerRef || !started || paused)return;
 if(now-lastNetworkWrite<180)return;
 lastNetworkWrite=now;
 set(multiplayerPlayerRef,{
  uid:multiplayerUid,name:playerName,
  distance:Math.round(distance*10)/10,
  lane,speed:Math.round(speed*10)/10,
  updatedAt:Date.now()
 }).catch(err=>console.warn("Race sync:",err));
}

function createCar(z,lane){
 const car=new THREE.Group();
 car.userData.usingGLB=false;

 const colors=[
  0x2767a8,0xc64b36,0xd4d8dc,
  0x242b35,0xd1ad38
 ];

 const body=material(
  colors[Math.floor(Math.random()*colors.length)],
  .35,.25
 );

 box(car,1.72,.62,3.35,body,0,.72,0);
 box(car,1.48,.62,1.65,material(0x8bb4c5,.25),0,1.25,-.2);

 for(const x of [-.92,.92]){
  for(const zc of [-1.05,1.05]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.32,.32,.18,12),black
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.38,zc);
   car.add(wheel);

 for(const x of [-.55,.55]){

 }

 car.position.set(lanes[lane],0,z);
 scene.add(car);

 return {
  mesh:car,
  lane,

  speed:10+Math.random()*15,

 };

/* USER-SUPPLIED GLB ASSETS */
const ASSET_PATHS={
 sportsCar:"./assets/quaternius_cc0-sports-car-1371.glb",
 ambulance:"./assets/waqas-hader-110-ambulance-5477.glb",
 wingsCar:"./assets/wings_of_freedom-car-2721.glb",
 trafficLight:"./assets/quaternius_cc0-traffic-light-1428.glb",
 fence:"./assets/quaternius_cc0-fence-995.glb",
 standardCar:"./assets/car.glb",
 policeCar:"./assets/police.glb",
 bulldozer:"./assets/buildozer.glb"
};
const gltfLoader=new GLTFLoader();
const loadedAssets={};
const pendingAssetLoads={};

function loadAsset(key){
 if(loadedAssets[key])return Promise.resolve(loadedAssets[key]);
 if(pendingAssetLoads[key])return pendingAssetLoads[key];
 pendingAssetLoads[key]=new Promise((resolve)=>{
  gltfLoader.load(ASSET_PATHS[key],gltf=>{
   loadedAssets[key]=gltf.scene;
   resolve(gltf.scene);
  },undefined,error=>{
   console.warn("Could not load model:",key,error);
   resolve(null);
  });
 });
 return pendingAssetLoads[key];
}

function fittedModel(source,targetWidth,targetHeight,targetLength){
 const model=source.clone(true);
 model.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(model);
 const size=bounds.getSize(new THREE.Vector3());
 // Normalize each axis so very differently authored GLBs share the same road scale.
 model.scale.set(
  targetWidth/Math.max(size.x,.001),
  targetHeight/Math.max(size.y,.001),
  targetLength/Math.max(size.z,.001)
 );
 model.updateMatrixWorld(true);
 const fittedBounds=new THREE.Box3().setFromObject(model);
 const center=fittedBounds.getCenter(new THREE.Vector3());
 model.position.x-=center.x;
 model.position.z-=center.z;
 model.position.y-=fittedBounds.min.y;
 model.updateMatrixWorld(true);
 model.traverse(obj=>{
  if(obj.isMesh){
   obj.castShadow=false;
   obj.receiveShadow=false;
   if(obj.material){
    const mats=Array.isArray(obj.material)?obj.material:[obj.material];
    mats.forEach(m=>{m.side=THREE.FrontSide;});
   }
  }
 });
 return model;
}

function replaceTrafficCarModel(car,assetKey){
 const source=loadedAssets[assetKey];
 if(!car || !car.isObject3D || !source)return;
 car.userData=car.userData||{};
 if(car.userData.usingGLB)return;
 const dimensions={
  sportsCar:[1.9,1.45,3.7],
  ambulance:[2.0,1.85,4.5],
  wingsCar:[1.9,1.45,3.7],
  standardCar:[1.9,1.45,3.7],
  policeCar:[2.0,1.55,4.0],
  bulldozer:[2.35,1.9,4.3]
 };
 const [width,height,length]=dimensions[assetKey]||[1.9,1.45,3.7];
 const model=fittedModel(source,width,height,length);
 // Supplied vehicles are aligned with the road's forward Z axis.
 car.clear();
 car.add(model);
 car.userData.usingGLB=true;
 car.userData.assetKey=assetKey;
}

function addRoadsideAsset(chunk,source,x,z,scale=1,rotationY=0){
 if(!source)return;
 const prop=source.clone(true);
 prop.scale.setScalar(scale);
 prop.rotation.y=rotationY;
 prop.position.set(x,0,z);
 prop.traverse(o=>{
  if(o.isMesh){o.castShadow=false;o.receiveShadow=false;}
 });
 chunk.add(prop);
}

function addFittedRoadProp(chunk,source,x,z,width,height,length,rotationY=0){
 if(!source)return;
 const prop=fittedModel(source,width,height,length);
 prop.rotation.y=rotationY;
 prop.position.x+=x;
 prop.position.z+=z;
 prop.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false;}});
 chunk.add(prop);
 return prop;
}

async function loadWorldAssets(){
 const [sports,ambulance,wings,light,fence,standard,police,bulldozer]=await Promise.all([
  loadAsset("sportsCar"),loadAsset("ambulance"),loadAsset("wingsCar"),
  loadAsset("trafficLight"),loadAsset("fence"),
  loadAsset("standardCar"),loadAsset("policeCar"),loadAsset("bulldozer")
 ]);
 // Six vehicle types are distributed through traffic and remain attached
 // to their traffic objects when those objects are recycled.
 const vehicleKeys=["sportsCar","ambulance","wingsCar","standardCar","policeCar","bulldozer"];
 cars.forEach((car,i)=>{
  const key=vehicleKeys[i%vehicleKeys.length];
  if(car && car.mesh)replaceTrafficCarModel(car.mesh,key);
 });

 // Repeating roadside furniture stays attached to each recycled road chunk.
 chunks.forEach((chunk,index)=>{
  const side=index%2===0?1:-1;
  const z=-8;
  if(fence){
   // Aligned end-to-end sections make a continuous fence along both sides.
   for(let n=0;n<3;n++){
    const zz=-10-n*20;
    addFittedRoadProp(chunk,fence,-8.65,zz,19.8,1.45,.30,Math.PI/2);
    addFittedRoadProp(chunk,fence,8.65,zz,19.8,1.45,.30,Math.PI/2);
   }
  }
 });
}

let audioContext=null,engineOsc=null,engineGain=null,windGain=null,windSource=null;
function startRideAudio(){
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;
  if(!audioContext){
   audioContext=new AudioCtx();
   engineOsc=audioContext.createOscillator();
   engineOsc.type="sawtooth";
   const engineFilter=audioContext.createBiquadFilter();
   engineFilter.type="lowpass";
   engineFilter.frequency.value=520;
   engineGain=audioContext.createGain();
   engineGain.gain.value=.018;
   engineOsc.connect(engineFilter).connect(engineGain).connect(audioContext.destination);
   engineOsc.start();

   // Generated broadband wind noise, no external audio files.
   const buffer=audioContext.createBuffer(1,audioContext.sampleRate*2,audioContext.sampleRate);
   const data=buffer.getChannelData(0);
   for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.35;
   windSource=audioContext.createBufferSource();
   windSource.buffer=buffer;
   windSource.loop=true;
   const windFilter=audioContext.createBiquadFilter();
   windFilter.type="lowpass";
   windFilter.frequency.value=700;
   windGain=audioContext.createGain();
   windGain.gain.value=.001;
   windSource.connect(windFilter).connect(windGain).connect(audioContext.destination);
   windSource.start();
  }
  if(audioContext.state==="suspended")audioContext.resume();
 }catch(err){console.warn("Audio unavailable",err);}
}
function updateRideAudio(speedValue,throttle,brake){
 if(!audioContext||!engineOsc)return;
 const t=audioContext.currentTime;
 const normalized=Math.min(speedValue/MAX_SPEED,1);
 engineOsc.frequency.setTargetAtTime(48+speedValue*5.2+(throttle?22:0),t,.08);
 engineGain.gain.setTargetAtTime(.012+normalized*.045+(throttle?.012:0),t,.12);
 windGain.gain.setTargetAtTime(.002+normalized*.075,t,.18);
}

/* GAME LOOP */

let previous=performance.now();
let lastRender=0;
const RENDER_INTERVAL=IS_MOBILE?1000/45:0;

function animate(now){
 requestAnimationFrame(animate);

 const dt=Math.min((now-previous)/1000,.04);
 previous=now;

 // Synchronize with the independent start-button handler
 if(window.rideStarted&&!started)startGame();

 if(started&&!paused){

  // Forward-only speed model (m/s): throttle builds speed, coasting rolls off,
  // and the brake applies stronger progressive deceleration without stopping.
  const accelerating=true; // Automatic acceleration is always enabled.
  const braking=keys.s||keys.arrowdown;

  if(boostTimer>0){
   boostTimer=Math.max(0,boostTimer-dt);
   speed+=(BOOST_MAX_SPEED-speed)*Math.min(1,dt*3.2);
   if(boostTimer===0)boostRecover=BOOST_RECOVERY;
  }else if(boostRecover>0){
   boostRecover=Math.max(0,boostRecover-dt);
   const allowedSpeed=MAX_SPEED+(BOOST_MAX_SPEED-MAX_SPEED)*(boostRecover/BOOST_RECOVERY);
   speed=Math.min(speed,allowedSpeed);
  }else if(accelerating){
   const torque=7.8*(1-Math.min(speed/MAX_SPEED,0.88)*0.48);
   speed+=torque*dt;
  }else{
   const rollingDrag=0.16;
   const aerodynamicDrag=0.00165*speed*speed;
   speed-=(rollingDrag+aerodynamicDrag)*dt;
  }

  if(braking){
   const brakeForce=13.5*(0.72+0.28*Math.min(speed/18,1));
   speed-=brakeForce*dt;
  }

  const currentSpeedLimit=boostTimer>0?BOOST_MAX_SPEED:
   boostRecover>0?MAX_SPEED+(BOOST_MAX_SPEED-MAX_SPEED)*(boostRecover/BOOST_RECOVERY):MAX_SPEED;
  speed=THREE.MathUtils.clamp(speed,MIN_SPEED,currentSpeedLimit);

  const movement=speed*dt;
  distance+=movement;

  crashCooldown=Math.max(0,crashCooldown-dt);
  crashShock=Math.max(0,crashShock-2.8*dt);

  // Smooth lane movement with a motorcycle-style counter-lean.
  const previousBikeX=bike.position.x;
  bike.position.x=THREE.MathUtils.damp(
   bike.position.x,targetX,7,dt
  );
  const lateralVelocity=(bike.position.x-previousBikeX)/Math.max(dt,0.001);
  const lateralAcceleration=(lateralVelocity-(bike.userData.lastLateralVelocity||0))/Math.max(dt,0.001);
  bike.userData.lastLateralVelocity=lateralVelocity;
  const leanTarget=THREE.MathUtils.clamp(
   -lateralAcceleration*0.012-lateralVelocity*0.045,-0.34,0.34
  );
  bike.rotation.z=THREE.MathUtils.damp(
   bike.rotation.z,leanTarget,5.5,dt
  );

  // Suspension bob, engine vibration, braking dive and acceleration squat.
  const engineVibration=Math.sin(now*(0.025+speed*.003))*0.006;
  const roadBob=Math.sin(now*.045)*Math.min(speed/30,1)*.012;
  bike.position.y=engineVibration+roadBob-crashShock*.035;
  const pitchTarget=braking?0.085:(accelerating?-0.045:0.012);
  bike.rotation.x=THREE.MathUtils.damp(
   bike.rotation.x,pitchTarget+crashShock*0.16,3.8,dt
  );

  // Front wheel spin follows road speed.
  for(const wheel of bike.userData.rollingWheels||[]){
   wheel.rotation.x+=movement/.58;
  }

  // Recycle road chunks endlessly
  for(const chunk of chunks){
   chunk.position.z+=movement;

   if(chunk.position.z>CHUNK_LENGTH){
    chunk.position.z-=CHUNK_LENGTH*CHUNK_COUNT;
   }

   if(chunk.position.z< -CHUNK_LENGTH*(CHUNK_COUNT-1)){
    chunk.position.z+=CHUNK_LENGTH*CHUNK_COUNT;
   }
  }

  // Update online opponents relative to this player's travelled distance.
  for(const rider of remoteRacers.values()){
   const remoteDistance=Number(rider.data.distance)||0;
   const relative=remoteDistance-distance;
   const remoteLane=Math.max(0,Math.min(2,Number(rider.data.lane)||0));
   rider.mesh.position.set(lanes[remoteLane],0,bike.position.z-relative);
   rider.mesh.visible=Math.abs(relative)<190;
  }
  // AI opponents advance at different speeds and occasionally change lanes.
  for(const bot of botRacers){
   bot.distance+=bot.speed*dt;
   bot.laneClock-=dt;
   if(bot.laneClock<=0){
    bot.lane=Math.max(0,Math.min(2,bot.lane+(Math.random()<.5?-1:1)));
    bot.laneClock=5+Math.random()*7;
   }
   const relative=bot.distance-distance;
   bot.mesh.position.set(lanes[bot.lane],0,bike.position.z-relative);
   bot.mesh.visible=Math.abs(relative)<190;
  }
  publishMultiplayerState(now);

  // Traffic movement, collisions and arcade-style car blast effects.
  for(const car of cars){
   if(car.exploding){
    car.explodeTime+=dt;
    car.velocityY-=15*dt;
    car.mesh.position.y+=car.velocityY*dt;
    car.mesh.rotation.x+=dt*5.5;
    car.mesh.rotation.z+=dt*4.2;
    car.mesh.position.x+=car.launchX*dt;
    car.mesh.position.z+=car.launchZ*dt;
    if(car.explodeTime>1.25){
     car.exploding=false;
     car.mesh.position.y=0;
     car.mesh.rotation.set(0,0,0);
     car.z=-230-Math.random()*80;
     car.lane=Math.floor(Math.random()*3);
     car.speed=10+Math.random()*15;
     car.mesh.position.x=lanes[car.lane];
     car.mesh.position.z=car.z;
    }
    continue;
   }

   car.z+=movement-car.speed*dt;
   if(car.z>14){
    car.z=-230-Math.random()*80;
    car.lane=Math.floor(Math.random()*3);
    car.speed=10+Math.random()*15;
    car.mesh.position.x=lanes[car.lane];
   }
   car.mesh.position.z=car.z;

   const distanceZ=Math.abs(car.z-bike.position.z);
   const distanceX=Math.abs(car.mesh.position.x-bike.position.x);
   // The collision envelope follows the visible vehicle footprint, not a tiny point.
   // Trigger just before the bike reaches the car so the impact is seen from the rider camera.
   if(distanceZ<3.15&&distanceX<1.55&&speed>MIN_SPEED&&crashCooldown<=0){
    speed=Math.max(MIN_SPEED,speed*0.72);
    crashShock=1;
    crashCooldown=1.0;
    bike.rotation.z+=(bike.position.x<car.mesh.position.x?-.10:.10);
    car.exploding=true;
    car.explodeTime=0;
    car.velocityY=10.5;
    car.launchX=(car.mesh.position.x-bike.position.x)*1.2+(Math.random()-.5)*2;
    car.launchZ=3.2;
    car.mesh.position.y=.15;
    spawnExplosion(car.mesh.position.clone().add(new THREE.Vector3(0,1.05,0)));
   }
  }

  // Animate and clean up the short-lived explosion particles.
  for(let i=explosions.length-1;i>=0;i--){
   const fx=explosions[i];
   fx.age+=dt;
   fx.flash.scale.setScalar(1+fx.age*7);
   fx.flash.material.opacity=Math.max(0,.95-fx.age*1.8);
   for(const spark of fx.sparks){
    spark.velocity.y-=9*dt;
    spark.mesh.position.addScaledVector(spark.velocity,dt);
    spark.mesh.scale.multiplyScalar(Math.max(.01,1-dt*1.8));
   }
   if(fx.age>1.0){
    scene.remove(fx.flash);
    fx.flash.geometry.dispose();
    fx.flash.material.dispose();
    fx.sparks.forEach(s=>{
     scene.remove(s.mesh);
     s.mesh.geometry.dispose();
     s.mesh.material.dispose();
    });
    explosions.splice(i,1);
   }
  }

  // First-person rider camera with subtle helmet vibration and lean.
  const shakeAmount=0.008+Math.min(speed/MAX_SPEED,1)*0.018;
  const impactJitter=crashShock*0.075;
  camera.position.x=THREE.MathUtils.damp(
   camera.position.x,
   bike.position.x+Math.sin(now*0.018)*shakeAmount+
    Math.sin(now*0.09)*impactJitter,
   9,
   dt
  );
  camera.position.y=3+
   Math.sin(now*0.022)*shakeAmount*0.65+
   Math.abs(Math.sin(now*0.075))*impactJitter;
  camera.position.z = bike.position.z + 3.5;

  skyDome.position.x=camera.position.x;
  skyDome.position.z=camera.position.z;
  camera.lookAt(
   bike.position.x+lateralVelocity*.035,
   1.52-crashShock*0.10+(braking?.035:0),
   bike.position.z-27
  );
  // Lean with the rider and widen the view slightly as speed rises.
  camera.rotation.z=bike.rotation.z*0.42+
   Math.sin(now*0.08)*crashShock*0.035;
  const targetFov=78+Math.min(speed/MAX_SPEED,1)*7;
  camera.fov=THREE.MathUtils.damp(camera.fov,targetFov,2.5,dt);
  camera.updateProjectionMatrix();

  if(crashFX)crashFX.style.opacity=String(Math.min(crashShock*0.55,0.55));
  const speedFX=document.getElementById("speedFX");
  if(speedFX)speedFX.style.opacity=String(Math.max(0,(speed-22)/MAX_SPEED)*.48);
  updateRideAudio(speed,accelerating,braking);
  // Dashboard
  const gear="D";

  stats.innerHTML=`
   <strong>${Math.round(speed*3.6)} km/h</strong>
   ${braking?"BRAKING":accelerating?"ACCELERATING":speed<=MIN_SPEED+0.05?"MINIMUM CRUISE":"COASTING"}<br>
   Distance: ${(distance/1000).toFixed(2)} km<br>
   Gear: ${gear}
  `;
 }

 if(!RENDER_INTERVAL || now-lastRender>=RENDER_INTERVAL){
  renderer.render(scene,camera);
  lastRender=now;
 }
}

requestAnimationFrame(animate);

/* RESIZE */

addEventListener("blur",()=>{
 Object.keys(keys).forEach(k=>keys[k]=false);
});
document.addEventListener("visibilitychange",()=>{
 if(document.hidden){
  Object.keys(keys).forEach(k=>keys[k]=false);
  if(started&&!paused)pauseGame();
 }else{
  previous=performance.now();
 }
});
let resizeTimer=0;
function resizeGame(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight,false);
 renderer.setPixelRatio(Math.min(devicePixelRatio,
  settings.graphicsQuality==="performance"?(IS_MOBILE?1:1.15):
  settings.graphicsQuality==="balanced"?(IS_MOBILE?1.2:1.5):(IS_MOBILE?1.35:1.8)));
}
addEventListener("resize",resizeGame,{passive:true});
addEventListener("orientationchange",()=>setTimeout(resizeGame,180),{passive:true});

</script>
