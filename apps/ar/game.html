<!-- Automatic three-second start countdown -->
<script>
window.rideStarted=false;
(function(){
 const overlay=document.getElementById("countdown");
 const card=document.getElementById("countdownCard");
 const number=document.getElementById("countdownNumber");
 let count=3;
 const timer=setInterval(()=>{
  count--;
  if(count>0)number.textContent=String(count);
  else{
   clearInterval(timer);
   card.classList.add("go");
   number.textContent="GO!";
   window.rideStarted=true;
   setTimeout(()=>{overlay.style.display="none";},550);
  }
 },1000);
})();
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
 apiKey: "AIzaSyBc8TNJTV37DovLUmCg8nAPj9zxm3csixY",
 authDomain: "pongalpay-af74b.firebaseapp.com",
 databaseURL: "https://pongalpay-af74b-default-rtdb.firebaseio.com",
 projectId: "pongalpay-af74b",
 storageBucket: "pongalpay-af74b.firebasestorage.app",
 messagingSenderId: "862427180634",
 appId: "1:862427180634:web:76ece7829eac438e71b263",
 measurementId: "G-58EBBBJ3P9"
};
const firebaseApp = initializeApp(firebaseConfig);
const realtimeDB = getDatabase(firebaseApp);
const firebaseAuth = getAuth(firebaseApp);
const gameParams = new URLSearchParams(location.search);
const activeRoomCode = gameParams.get("room");
const playerName = gameParams.get("name") || "Rider";


/* SCENE */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc7d9);
scene.fog=new THREE.Fog(0xb7c9ca,85,460);

// Lightweight painted sky dome with soft cloud bands.
function makeSkyTexture(){
 const c=document.createElement("canvas");
 c.width=1024;c.height=512;
 const ctx=c.getContext("2d");
 const g=ctx.createLinearGradient(0,0,0,512);
 g.addColorStop(0,"#4e83a4");g.addColorStop(.48,"#a8cbd6");
 g.addColorStop(.78,"#d6d6c9");g.addColorStop(1,"#e5c7a8");
 ctx.fillStyle=g;ctx.fillRect(0,0,1024,512);
 for(let i=0;i<115;i++){
  const x=Math.random()*1024,y=70+Math.random()*270;
  const w=35+Math.random()*125,h=8+Math.random()*24;
  const cloud=ctx.createRadialGradient(x,y,2,x,y,w);
  cloud.addColorStop(0,"rgba(255,255,255,.34)");
  cloud.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=cloud;ctx.beginPath();ctx.ellipse(x,y,w,h,0,0,Math.PI*2);ctx.fill();
 }
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;return tex;
}
const skyDome=new THREE.Mesh(
 new THREE.SphereGeometry(420,18,12),
 new THREE.MeshBasicMaterial({map:makeSkyTexture(),side:THREE.BackSide,depthWrite:false})
);
skyDome.position.y=15;scene.add(skyDome);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,0.1,850
);
camera.position.set(0,2.15,7.5);

const IS_MOBILE = matchMedia("(max-width: 900px), (pointer: coarse)").matches;
const DEFAULT_QUALITY = IS_MOBILE ? "performance" : "balanced";
const renderer=new THREE.WebGLRenderer({
 antialias:!IS_MOBILE,
 alpha:false,
 powerPreference:"high-performance",
 stencil:false,
 depth:true
});
renderer.setPixelRatio(Math.min(devicePixelRatio,IS_MOBILE?1.15:1.5));
renderer.setSize(innerWidth,innerHeight,false);
renderer.shadowMap.enabled=false; // expensive on mobile GPUs
renderer.info.autoReset=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.insertBefore(renderer.domElement,document.body.firstChild);

scene.add(new THREE.HemisphereLight(0xffffff,0x526044,2));

const sun=new THREE.DirectionalLight(0xffedcf,2);
sun.position.set(-15,30,20);
sun.castShadow=false;
sun.shadow.mapSize.set(256,256);
scene.add(sun);

/* MATERIALS */

const material=(color,roughness=.8,metalness=0)=>
 new THREE.MeshStandardMaterial({color,roughness,metalness});

const asphalt=material(0x303943,.96,0);
const roadCanvas=document.createElement("canvas");
roadCanvas.width=roadCanvas.height=256;
const roadCtx=roadCanvas.getContext("2d");
roadCtx.fillStyle="#303943";
roadCtx.fillRect(0,0,256,256);
for(let i=0;i<6500;i++){
 const shade=35+Math.floor(Math.random()*35);
 roadCtx.fillStyle=`rgba(${shade},${shade+3},${shade+7},${Math.random()*.22})`;
 const size=Math.random()*2.2+.3;
 roadCtx.fillRect(Math.random()*256,Math.random()*256,size,size);
}
const roadTexture=new THREE.CanvasTexture(roadCanvas);
roadTexture.wrapS=roadTexture.wrapT=THREE.RepeatWrapping;
roadTexture.repeat.set(2,8);
roadTexture.colorSpace=THREE.SRGBColorSpace;
asphalt.map=roadTexture;
asphalt.needsUpdate=true;
const white=material(0xffffff);
const yellow=material(0xffd34e);
const grass=material(0x507c4b);
const trunk=material(0x65432c);
const leaves=material(0x327346);
const black=material(0x101419,.4,.2);
const chrome=material(0xbac6ce,.25,.8);
const red=material(0xd62638,.35,.3);

function box(parent,w,h,d,mat,x,y,z){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),mat
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=false;
 mesh.receiveShadow=false;
 parent.add(mesh);
 return mesh;
}

/* INFINITE ROAD */

const ROAD_WIDTH=12;
// More segments keep the road visible far ahead.
const CHUNK_LENGTH=60;
const CHUNK_COUNT=IS_MOBILE?9:11;
const chunks=[];
const lanes=[-4,0,4];
const boostPads=[];

function createBoostPad(chunk){
 const pad=new THREE.Group();
 const laneIndex=Math.floor(Math.random()*3);
 pad.position.set(lanes[laneIndex],.025,-30);
 const base=new THREE.Mesh(new THREE.BoxGeometry(2.65,.075,3.8),
  new THREE.MeshStandardMaterial({color:0x087f79,emissive:0x00d9bd,emissiveIntensity:.75,roughness:.42,metalness:.25}));
 base.position.y=.035;
 pad.add(base);
 const arrowMat=new THREE.MeshStandardMaterial({color:0xeaffff,emissive:0x71fff0,emissiveIntensity:1.4,side:THREE.DoubleSide,roughness:.3});
 const shape=new THREE.Shape();
 shape.moveTo(0,.78);shape.lineTo(-.43,.12);shape.lineTo(-.16,.12);
 shape.lineTo(-.16,-.62);shape.lineTo(.16,-.62);shape.lineTo(.16,.12);
 shape.lineTo(.43,.12);shape.closePath();
 const geometry=new THREE.ShapeGeometry(shape);
 for(let i=0;i<3;i++){
  const arrow=new THREE.Mesh(geometry,arrowMat);
  arrow.rotation.x=-Math.PI/2;
  arrow.position.set(0,.095,-.95+i*.95);
  arrow.scale.setScalar(.72);
  pad.add(arrow);
 }
 chunk.add(pad);
 const record={mesh:pad,chunk,available:true,phase:Math.random()*Math.PI*2};
 boostPads.push(record);
 chunk.userData.boostPad=record;
}

function createChunk(z){
 const group=new THREE.Group();
 group.position.z=z;
 scene.add(group);

 box(group,12,.18,60,asphalt,0,-.12,-30);

 box(group,1,.2,60,material(0x777777),-6.5,-.1,-30);
 box(group,1,.2,60,material(0x777777),6.5,-.1,-30);

 // Road borders
 for(const side of [-1,1]){
  box(group,.13,.03,60,white,side*5.55,.01,-30);
 }

 // Lane markings
 for(let i=0;i<9;i++){
  box(group,.10,.025,3,white,-2,.01,-i*6.7-2);
  box(group,.10,.025,3,white,2,.01,-i*6.7-2);
 }

 // Wide grassy verges and raised shoulders, following the sketch.
 box(group,34,.12,60,grass,-23,-.23,-30);
 box(group,34,.12,60,grass,23,-.23,-30);
 const raisedShoulder=material(0x667b50,.95);
 for(const side of [-1,1]){
  box(group,1.15,.42,60,raisedShoulder,side*7.45,-.02,-30);
  box(group,.16,.22,60,material(0x9ca7a0,.9),side*6.75,.10,-30);
 }

 // Reflector posts along both shoulders.
 for(let i=0;i<10;i++){
  for(const side of [-1,1]){
   const post=box(group,.12,.85,.12,white,side*7.15,.38,-i*6-2);
   box(group,.16,.12,.14,yellow,side*7.15,.72,-i*6-2);
  }
 }

 // Layered fog banks beyond the verges, never across the driving lanes.
 const fogMat=new THREE.MeshBasicMaterial({
  color:0xdce6e5,transparent:true,opacity:.20,depthWrite:false,side:THREE.DoubleSide
 });
 for(let i=0;i<4;i++){
  for(const side of [-1,1]){
   const mist=new THREE.Mesh(new THREE.PlaneGeometry(18,5),fogMat);
   mist.position.set(side*(17+i*5),2.4,-8-i*13);
   mist.rotation.y=side===1?-Math.PI/2:Math.PI/2;
   group.add(mist);
  }
 }

 // Tree slots are filled with the supplied tree1.glb ... tree6.glb models
 // after the assets load. Slots remain children of this chunk and recycle with it.
 group.userData.treeSlots=[];
 for(let i=0;i<12;i++){
  for(const side of [-1,1]){
   group.userData.treeSlots.push({
    x:side*(13+Math.random()*7),
    z:-2-i*5.05,
    variant:Math.floor(Math.random()*6),
    height:4.0+Math.random()*1.8,
    rotation:Math.random()*Math.PI*2
   });
  }
 }

 chunks.push(group);
}

for(let i=0;i<CHUNK_COUNT;i++){
 createChunk(CHUNK_LENGTH-i*CHUNK_LENGTH);
}

/* MOTORCYCLE */

function createBike(){
 const group=new THREE.Group();
 group.position.set(0,0,4);
 group.userData.rollingWheels=[];
 scene.add(group);
 return group;
}
const bike=createBike();
bike.rotation.y=Math.PI;

// Every rider uses the same supplied GLB motorcycle.
const remoteRacers = new Map();
function makeRemoteRider(uid, data={}) {
 const group=new THREE.Group();
 group.rotation.y=Math.PI;
 scene.add(group);
 return {mesh:group,data};
}
function fittedBikeModel(source){
 const model=source.clone(true);
 // The supplied bike is lengthwise along X; rotate its long axis onto road Z.
 model.rotation.y=-Math.PI/2;
 model.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(model);
 const size=bounds.getSize(new THREE.Vector3());
 // Keep proportions: normalize by the model's length, not independently per axis.
 const scale=2.05/Math.max(size.z,.001);
 model.scale.setScalar(scale);
 model.updateMatrixWorld(true);
 const fitted=new THREE.Box3().setFromObject(model);
 const center=fitted.getCenter(new THREE.Vector3());
 model.position.set(-center.x,-fitted.min.y,-center.z);
 model.updateMatrixWorld(true);
 model.traverse(o=>{
  if(o.isMesh){
   o.castShadow=false;
   o.receiveShadow=false;
   if(o.material){
    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(m=>{m.side=THREE.FrontSide;});
   }
  }
 });
 return model;
}
function attachBikeModel(group,source){
 if(!group||!source||group.userData.hasBikeModel)return;
 const model=fittedBikeModel(source);
 group.add(model);
 group.userData.hasBikeModel=true;
}

let multiplayerUid=null;
let multiplayerPlayerRef=null;
let lastNetworkWrite=0;
let multiplayerReady=false;
const raceStatus=document.getElementById("raceStatus");
function connectMultiplayer(user){
 if(!activeRoomCode || !user)return;
 multiplayerUid=user.uid;
 multiplayerPlayerRef=ref(realtimeDB,`rooms/${activeRoomCode}/members/${user.uid}`);
 onDisconnect(multiplayerPlayerRef).remove().catch(err=>console.warn("Presence setup:",err));
 const membersRef=ref(realtimeDB,`rooms/${activeRoomCode}/members`);
 onValue(membersRef,snapshot=>{
  const members=snapshot.val()||{};
  const ids=new Set(Object.keys(members).filter(id=>id!==multiplayerUid));
  for(const [id,rider] of remoteRacers){
   if(!ids.has(id)){scene.remove(rider.mesh);remoteRacers.delete(id);}
  }
  for(const id of ids){
   const data=members[id]||{};
   let rider=remoteRacers.get(id);
   if(!rider){rider=makeRemoteRider(id,data);remoteRacers.set(id,rider);}
   if(loadedAssets.bike)attachBikeModel(rider.mesh,loadedAssets.bike);
   rider.data=data;
  }
  if(raceStatus){
   raceStatus.style.display="block";
   raceStatus.textContent=`ROOM ${activeRoomCode} · ${Object.keys(members).length} RIDER(S)`;
  }
 },err=>console.warn("Room listener:",err));
 multiplayerReady=true;
}
onAuthStateChanged(firebaseAuth,user=>{
 if(user && activeRoomCode)connectMultiplayer(user);
});
function publishMultiplayerState(now){
 if(!activeRoomCode || !multiplayerUid || !multiplayerPlayerRef || !started || paused)return;
 if(now-lastNetworkWrite<180)return;
 lastNetworkWrite=now;
 set(multiplayerPlayerRef,{
  uid:multiplayerUid,name:playerName,
  distance:Math.round(distance*10)/10,
  lane,speed:Math.round(speed*10)/10,
  updatedAt:Date.now()
 }).catch(err=>console.warn("Race sync:",err));
}

// Three AI opponents race alongside human players.
const botRacers=[];
for(let i=0;i<3;i++){
 const rider=makeRemoteRider("bot-"+i,{lane:i,distance:35+i*24,speed:39+i*2});
 botRacers.push({mesh:rider.mesh,lane:i,distance:35+i*24,speed:39+i*2,laneClock:4+i*2});
}


/* TRAFFIC AND NON-GRAPHIC ARCADE EXPLOSIONS */

const cars=[];
const explosions=[];

function spawnExplosion(position){
 const flash=new THREE.Mesh(
  new THREE.SphereGeometry(.35,12,10),
  new THREE.MeshBasicMaterial({color:0xffb02e,transparent:true,opacity:.95})
 );
 flash.position.copy(position);
 scene.add(flash);
 const sparks=[];
 for(let i=0;i<12;i++){
  const spark=new THREE.Mesh(
   new THREE.SphereGeometry(.09+Math.random()*.08,7,6),
   new THREE.MeshBasicMaterial({color:i%2?0xff5a24:0xffd36a})
  );
  spark.position.copy(position);
  scene.add(spark);
  sparks.push({
   mesh:spark,
   velocity:new THREE.Vector3((Math.random()-.5)*8,Math.random()*7+1,(Math.random()-.5)*8)
  });
 }
 explosions.push({flash,sparks,age:0});
}

function createCar(z,lane){
 const car=new THREE.Group();
 car.userData.usingGLB=false;

 const colors=[
  0x2767a8,0xc64b36,0xd4d8dc,
  0x242b35,0xd1ad38
 ];

 const body=material(
  colors[Math.floor(Math.random()*colors.length)],
  .35,.25
 );

 box(car,1.72,.62,3.35,body,0,.72,0);
 box(car,1.48,.62,1.65,material(0x8bb4c5,.25),0,1.25,-.2);

 for(const x of [-.92,.92]){
  for(const zc of [-1.05,1.05]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.32,.32,.18,12),black
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.38,zc);
   car.add(wheel);
  }
 }

 for(const x of [-.55,.55]){
  box(car,.28,.16,.08,yellow,x,.78,1.7);
  box(car,.3,.16,.08,red,x,.78,-1.7);
 }

 car.position.set(lanes[lane],0,z);
 scene.add(car);

 return {
  mesh:car,
  lane,
  z,
  speed:10+Math.random()*15,
  exploding:false,
  explodeTime:0,
  velocityY:0
 };
}

for(let i=0;i<14;i++){
 cars.push(createCar(-35-i*27,Math.floor(Math.random()*3)));
}

/* USER-SUPPLIED GLB ASSETS */
const ASSET_PATHS={
 bike:"./assets/bike.glb",
 car:"./assets/car.glb",
 ergoninane:"./assets/cer.glb",
 fence:"./assets/fence.glb",
 tree1:"./assets/tree/tree1.glb",
 tree2:"./assets/tree/tree2.glb",
 tree3:"./assets/tree/tree3.glb",
 tree4:"./assets/tree/tree4.glb",
 tree5:"./assets/tree/tree5.glb",
 tree6:"./assets/tree/tree6.glb"
};
const gltfLoader=new GLTFLoader();
const loadedAssets={};
const pendingAssetLoads={};
const assetErrors={};
const assetStatus=document.getElementById("assetStatus");

// Resolve relative to this HTML module so the paths continue to work when the
// game is hosted in a subdirectory.
function assetUrl(key){
 return new URL(ASSET_PATHS[key],import.meta.url).href;
}
function loadAsset(key){
 if(loadedAssets[key])return Promise.resolve(loadedAssets[key]);
 if(pendingAssetLoads[key])return pendingAssetLoads[key];
 pendingAssetLoads[key]=new Promise(resolve=>{
  const url=assetUrl(key);
  gltfLoader.load(url,gltf=>{
   loadedAssets[key]=gltf.scene;
   console.info("Loaded 3D asset:",key,url);
   resolve(gltf.scene);
  },event=>{
   if(event.total && assetStatus){
    const pct=Math.round(event.loaded/event.total*100);
    assetStatus.textContent=`Loading ${key}: ${pct}%`;
   }
  },error=>{
   assetErrors[key]=error;
   console.error("Could not load model:",key,url,error);
   resolve(null);
  });
 });
 return pendingAssetLoads[key];
}

function fittedModel(source,targetWidth,targetHeight,targetLength){
 const model=source.clone(true);
 model.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(model);
 const size=bounds.getSize(new THREE.Vector3());
 // Preserve model proportions and fit it inside the requested vehicle envelope.
 const scale=Math.min(
  targetWidth/Math.max(size.x,.001),
  targetHeight/Math.max(size.y,.001),
  targetLength/Math.max(size.z,.001)
 );
 model.scale.setScalar(scale);
 model.updateMatrixWorld(true);
 const fittedBounds=new THREE.Box3().setFromObject(model);
 const center=fittedBounds.getCenter(new THREE.Vector3());
 model.position.x-=center.x;
 model.position.z-=center.z;
 model.position.y-=fittedBounds.min.y;
 model.updateMatrixWorld(true);
 model.traverse(obj=>{
  if(obj.isMesh){
   obj.castShadow=false;
   obj.receiveShadow=false;
   // Preserve the GLB's original material side/culling settings.
  }
 });
 return model;
}

function replaceTrafficCarModel(car,assetKey){
 const source=loadedAssets[assetKey];
 if(!car || !car.isObject3D || !source)return false;
 if(car.userData.usingGLB)return true;
 const model=fittedModel(source,2.55,1.65,4.15);
 car.clear();
 car.add(model);
 car.userData.usingGLB=true;
 car.userData.assetKey=assetKey;
 return true;
}

function addRoadsideAsset(chunk,source,x,z,scale=1,rotationY=0){
 if(!source)return;
 const prop=source.clone(true);
 prop.scale.setScalar(scale);
 prop.rotation.y=rotationY;
 prop.position.set(x,0,z);
 prop.traverse(o=>{
  if(o.isMesh){o.castShadow=false;o.receiveShadow=false;}
 });
 chunk.add(prop);
}

function addFittedRoadProp(chunk,source,x,z,width,height,length,rotationY=0){
 if(!source)return;
 const prop=fittedModel(source,width,height,length);
 prop.rotation.y=rotationY;
 prop.position.x+=x;
 prop.position.z+=z;
 prop.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false;}});
 chunk.add(prop);
 return prop;
}

function addTreeGLB(chunk,source,slot){
 if(!source)return false;
 const tree=source.clone(true);
 tree.rotation.y=slot.rotation;
 tree.updateMatrixWorld(true);
 const initialBounds=new THREE.Box3().setFromObject(tree);
 const initialSize=initialBounds.getSize(new THREE.Vector3());
 const scale=slot.height/Math.max(initialSize.y,.001);
 tree.scale.multiplyScalar(scale);
 tree.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(tree);
 const center=bounds.getCenter(new THREE.Vector3());
 tree.position.set(slot.x-center.x,-bounds.min.y,slot.z-center.z);
 tree.traverse(obj=>{
  if(obj.isMesh){
   obj.castShadow=false;
   obj.receiveShadow=false;
  }
 });
 chunk.add(tree);
 return true;
}

async function loadWorldAssets(){
 const [bikeModel,carModel,ergoninaneModel,fence,...treeModels]=await Promise.all([
  loadAsset("bike"),loadAsset("car"),loadAsset("ergoninane"),loadAsset("fence"),
  loadAsset("tree1"),loadAsset("tree2"),loadAsset("tree3"),
  loadAsset("tree4"),loadAsset("tree5"),loadAsset("tree6")
 ]);
 const availableTrees=treeModels.filter(Boolean);

 if(bikeModel){
  attachBikeModel(bike,bikeModel);
  for(const rider of remoteRacers.values())attachBikeModel(rider.mesh,bikeModel);
  for(const bot of botRacers)attachBikeModel(bot.mesh,bikeModel);
 }

 let carModelsApplied=0;
 cars.forEach((car,i)=>{
  const key=i%2===0?"car":"ergoninane";
  if(loadedAssets[key] && replaceTrafficCarModel(car.mesh,key))carModelsApplied++;
 });

 chunks.forEach(chunk=>{
  if(fence){
   // Six short, slightly overlapping pieces form an uninterrupted fence
   // along the full 60m segment on BOTH sides of the road.
   for(let n=0;n<6;n++){
    const zz=-5-n*10;
    addFittedRoadProp(chunk,fence,-8.65,zz,10.25,1.45,.30,Math.PI/2);
    addFittedRoadProp(chunk,fence,8.65,zz,10.25,1.45,.30,Math.PI/2);
   }
  }
 });

 // Replace all old tree placeholders with randomized tree1.glb ... tree6.glb.
 // Missing variants are skipped with a console warning; loaded variants are reused.
 let treeInstancesApplied=0;
 chunks.forEach(chunk=>{
  const slots=chunk.userData.treeSlots||[];
  slots.forEach(slot=>{
   if(!availableTrees.length)return;
   const source=treeModels[slot.variant]||availableTrees[slot.variant%availableTrees.length];
   if(addTreeGLB(chunk,source,slot))treeInstancesApplied++;
  });
 });

 const loaded=[
  bikeModel?"bike":"no bike",
  carModel?"car":"no car",
  ergoninaneModel?"Ergoninane":"no Ergoninane",
  fence?"fence":"no fence",
  `trees ${availableTrees.length}/6`
 ];
 if(assetStatus){
  assetStatus.textContent=`3D assets: ${loaded.join(" · ")}`;
  assetStatus.style.color=(bikeModel&&carModel&&ergoninaneModel&&fence)?"#9cf0c8":"#ffd18a";
 }
 console.info("World assets:",{loaded,carModelsApplied,treeInstancesApplied,assetErrors});
}
loadWorldAssets().catch(err=>console.error("World asset loading failed:",err));

/* GAME STATE */

let speed=30/3.6; // 30 km/h minimum automatic forward speed
let boostTimer=0;
let boostRecover=0;
const BOOST_MAX_SPEED=230/3.6;
const BOOST_DURATION=2.8;
const BOOST_RECOVERY=1.5;
let distance=0;
let lane=1;
let targetX=0;
let started=false;
let paused=false;
let cameraMode="follow"; // follow = current over-the-bike view; first = rider POV
const settings={graphicsQuality:DEFAULT_QUALITY};

const stats=document.getElementById("stats");
const keys={};
const MIN_SPEED=30/3.6;
let MAX_SPEED=187/3.6; // editable normal maximum speed, in m/s
let crashShock=0;
let crashCooldown=0;
const crashFX=document.getElementById("crashFX");

let audioContext=null,engineOsc=null,engineGain=null,windGain=null,windSource=null;
function startRideAudio(){
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx)return;
  if(!audioContext){
   audioContext=new AudioCtx();
   engineOsc=audioContext.createOscillator();
   engineOsc.type="sawtooth";
   const engineFilter=audioContext.createBiquadFilter();
   engineFilter.type="lowpass";
   engineFilter.frequency.value=520;
   engineGain=audioContext.createGain();
   engineGain.gain.value=.018;
   engineOsc.connect(engineFilter).connect(engineGain).connect(audioContext.destination);
   engineOsc.start();

   // Generated broadband wind noise, no external audio files.
   const buffer=audioContext.createBuffer(1,audioContext.sampleRate*2,audioContext.sampleRate);
   const data=buffer.getChannelData(0);
   for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.35;
   windSource=audioContext.createBufferSource();
   windSource.buffer=buffer;
   windSource.loop=true;
   const windFilter=audioContext.createBiquadFilter();
   windFilter.type="lowpass";
   windFilter.frequency.value=700;
   windGain=audioContext.createGain();
   windGain.gain.value=.001;
   windSource.connect(windFilter).connect(windGain).connect(audioContext.destination);
   windSource.start();
  }
  if(audioContext.state==="suspended")audioContext.resume();
 }catch(err){console.warn("Audio unavailable",err);}
}
function updateRideAudio(speedValue,throttle,brake){
 if(!audioContext||!engineOsc)return;
 const t=audioContext.currentTime;
 const normalized=Math.min(speedValue/MAX_SPEED,1);
 engineOsc.frequency.setTargetAtTime(48+speedValue*5.2+(throttle?22:0),t,.08);
 engineGain.gain.setTargetAtTime(.012+normalized*.045+(throttle?.012:0),t,.12);
 windGain.gain.setTargetAtTime(.002+normalized*.075,t,.18);
}
function startGame(){
 started=true;
 paused=false;
 startRideAudio();
 document.getElementById("pauseMenu").style.display="none";
}

function pauseGame(){
 if(!started||paused)return;
 paused=true;
 document.getElementById("pauseMenu").style.display="flex";
}

function resumeGame(){
 if(!started)return;
 paused=false;
 document.getElementById("pauseMenu").style.display="none";
}

function applySettings(){
 const quality=document.getElementById("graphicsQuality");
 if(quality)settings.graphicsQuality=quality.value;

 const speedInput=document.getElementById("maxCarSpeed");
 if(speedInput){
  const requested=Number(speedInput.value);
  const valid=Number.isFinite(requested)?THREE.MathUtils.clamp(Math.round(requested),30,300):187;
  speedInput.value=String(valid);
  MAX_SPEED=valid/3.6;
  speed=Math.min(speed,MAX_SPEED);
 }

 const pixelCap=settings.graphicsQuality==="performance"?(IS_MOBILE?1:1.15):
  settings.graphicsQuality==="balanced"?(IS_MOBILE?1.2:1.5):(IS_MOBILE?1.35:1.8);
 renderer.setPixelRatio(Math.min(devicePixelRatio,pixelCap));
 renderer.setSize(innerWidth,innerHeight,false);
}
function restart(){
 speed=30/3.6;
 distance=0;
 lane=1;
 targetX=0;
 bike.position.x=0;
 bike.position.y=0;
 bike.rotation.set(0,Math.PI,0);
 crashShock=0;
 crashCooldown=0;
 cars.forEach((car,i)=>{
  car.z=-35-i*27;
  car.lane=Math.floor(Math.random()*3);
  car.mesh.position.set(lanes[car.lane],0,car.z);
  car.mesh.rotation.set(0,0,0);
  car.exploding=false;
  car.explodeTime=0;
  car.velocityY=0;
 });
 startGame();
}

function changeLane(direction){
 if(!started||paused)return;
 lane=Math.max(0,Math.min(2,lane+direction));
 targetX=lanes[lane];
}

// Competitor bikes use the same collision envelope as the player's bike.
// A contact slows the player and produces a brief camera/lean response.
function checkCompetitorCollision(otherMesh,now){
 if(!otherMesh || !otherMesh.visible || crashCooldown>0)return false;
 const dz=Math.abs(otherMesh.position.z-bike.position.z);
 const dx=Math.abs(otherMesh.position.x-bike.position.x);
 if(dz>2.45 || dx>1.35)return false;
 speed=Math.max(MIN_SPEED,speed*.84);
 crashShock=Math.max(crashShock,.65);
 crashCooldown=.85;
 bike.rotation.z+=(bike.position.x<=otherMesh.position.x?-.12:.12);
 return true;
}

/* KEYBOARD */

addEventListener("keydown",e=>{
 const key=e.key.toLowerCase();
 if(key==="escape"){paused?resumeGame():pauseGame();return;}
 if(key==="r"&&started){restart();return;}
 if(paused)return;
 keys[key]=true;
 if(key==="arrowleft"||key==="a")changeLane(-1);
 if(key==="arrowright"||key==="d")changeLane(1);
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(key))e.preventDefault();
});

addEventListener("keyup",e=>{

/* TOUCH SWIPE CONTROLS: no on-screen steering/brake buttons. */
let swipeStartX=0,swipeStartY=0,swipePointer=null;
renderer.domElement.addEventListener("pointerdown",e=>{
 if(!IS_MOBILE||paused||!started)return;
 swipePointer=e.pointerId;
 swipeStartX=e.clientX;
 swipeStartY=e.clientY;
 try{renderer.domElement.setPointerCapture(e.pointerId);}catch(_){}
});
renderer.domElement.addEventListener("pointerup",e=>{
 if(!IS_MOBILE||e.pointerId!==swipePointer)return;
 const dx=e.clientX-swipeStartX;
 const dy=e.clientY-swipeStartY;
 if(Math.abs(dx)>34&&Math.abs(dx)>Math.abs(dy)*1.15)changeLane(dx<0?-1:1);
 swipePointer=null;
});
renderer.domElement.addEventListener("pointercancel",()=>{swipePointer=null;});

document.getElementById("pauseBtn").addEventListener("click",pauseGame);
document.getElementById("cameraBtn").addEventListener("click",()=>{
 cameraMode=cameraMode==="follow"?"first":"follow";
 document.getElementById("cameraBtn").textContent=cameraMode==="first"?"CAM: 1ST PERSON":"CAM: FOLLOW";
});
document.getElementById("resumeBtn").addEventListener("click",()=>{
 applySettings();
 resumeGame();
});
document.getElementById("restartBtn").addEventListener("click",()=>{
 applySettings();
 restart();
});
document.getElementById("graphicsQuality").value=DEFAULT_QUALITY;
["graphicsQuality","maxCarSpeed"].forEach(id=>{
 document.getElementById(id).addEventListener("change",()=>{
  applySettings();
 });
});
applySettings();

/* GAME LOOP */

let previous=performance.now();
let lastRender=0;
const RENDER_INTERVAL=IS_MOBILE?1000/30:0;

function animate(now){
 requestAnimationFrame(animate);

 const dt=Math.min((now-previous)/1000,.04);
 previous=now;

 // Synchronize with the independent start-button handler
 if(window.rideStarted&&!started)startGame();

 if(started&&!paused){

  // Forward-only speed model (m/s): throttle builds speed, coasting rolls off,
  // and the brake applies stronger progressive deceleration without stopping.
  const accelerating=true; // Automatic acceleration is always enabled.
  const braking=keys.s||keys.arrowdown;

  if(boostTimer>0){
   boostTimer=Math.max(0,boostTimer-dt);
   speed+=(BOOST_MAX_SPEED-speed)*Math.min(1,dt*3.2);
   if(boostTimer===0)boostRecover=BOOST_RECOVERY;
  }else if(boostRecover>0){
   boostRecover=Math.max(0,boostRecover-dt);
   const allowedSpeed=MAX_SPEED+(BOOST_MAX_SPEED-MAX_SPEED)*(boostRecover/BOOST_RECOVERY);
   speed=Math.min(speed,allowedSpeed);
  }else if(accelerating){
   const torque=7.8*(1-Math.min(speed/MAX_SPEED,0.88)*0.48);
   speed+=torque*dt;
  }else{
   const rollingDrag=0.16;
   const aerodynamicDrag=0.00165*speed*speed;
   speed-=(rollingDrag+aerodynamicDrag)*dt;
  }

  if(braking){
   const brakeForce=13.5*(0.72+0.28*Math.min(speed/18,1));
   speed-=brakeForce*dt;
  }

  const currentSpeedLimit=boostTimer>0?BOOST_MAX_SPEED:
   boostRecover>0?MAX_SPEED+(BOOST_MAX_SPEED-MAX_SPEED)*(boostRecover/BOOST_RECOVERY):MAX_SPEED;
  speed=THREE.MathUtils.clamp(speed,MIN_SPEED,currentSpeedLimit);

  const movement=speed*dt;
  distance+=movement;

  crashCooldown=Math.max(0,crashCooldown-dt);
  crashShock=Math.max(0,crashShock-2.8*dt);

  // Smooth lane movement with a motorcycle-style counter-lean.
  const previousBikeX=bike.position.x;
  bike.position.x=THREE.MathUtils.damp(
   bike.position.x,targetX,7,dt
  );
  const lateralVelocity=(bike.position.x-previousBikeX)/Math.max(dt,0.001);
  const lateralAcceleration=(lateralVelocity-(bike.userData.lastLateralVelocity||0))/Math.max(dt,0.001);
  bike.userData.lastLateralVelocity=lateralVelocity;
  const leanTarget=THREE.MathUtils.clamp(
   -lateralAcceleration*0.012-lateralVelocity*0.045,-0.34,0.34
  );
  bike.rotation.z=THREE.MathUtils.damp(
   bike.rotation.z,leanTarget,5.5,dt
  );

  // Suspension bob, engine vibration, braking dive and acceleration squat.
  const engineVibration=Math.sin(now*(0.025+speed*.003))*0.006;
  const roadBob=Math.sin(now*.045)*Math.min(speed/30,1)*.012;
  bike.position.y=engineVibration+roadBob-crashShock*.035;
  const pitchTarget=braking?0.085:(accelerating?-0.045:0.012);
  bike.rotation.x=THREE.MathUtils.damp(
   bike.rotation.x,pitchTarget+crashShock*0.16,3.8,dt
  );

  // Front wheel spin follows road speed.
  for(const wheel of bike.userData.rollingWheels||[]){
   wheel.rotation.x+=movement/.58;
  }

  // Advance every complete terrain chunk at exactly the same speed as traffic.
  // Each chunk contains its road, trees, fences, shoulders and fog props.
  for(const chunk of chunks){
   chunk.position.z+=movement;
  }
  // The player travels toward negative Z. Always recycle a passed chunk
  // BEHIND the smallest (furthest-ahead) Z, never behind the largest Z.
  // Using the largest Z caused chunks to overlap and the distant world to vanish.
  for(const chunk of chunks){
   if(chunk.position.z>CHUNK_LENGTH+24){
    let furthestAhead=Infinity;
    for(const other of chunks){
     if(other!==chunk)furthestAhead=Math.min(furthestAhead,other.position.z);
    }
    chunk.position.z=furthestAhead-CHUNK_LENGTH;
   }
  }

  // Update online opponents relative to this player's travelled distance.
  for(const rider of remoteRacers.values()){
   const remoteDistance=Number(rider.data.distance)||0;
   const relative=remoteDistance-distance;
   const remoteLane=Math.max(0,Math.min(2,Number(rider.data.lane)||0));
   rider.mesh.position.set(lanes[remoteLane],0,bike.position.z-relative);
   rider.mesh.visible=Math.abs(relative)<190;
   if(rider.mesh.visible)checkCompetitorCollision(rider.mesh,now);
  }
  // AI opponents advance at different speeds and occasionally change lanes.
  for(const bot of botRacers){
   bot.distance+=bot.speed*dt;
   bot.laneClock-=dt;
   if(bot.laneClock<=0){
    bot.lane=Math.max(0,Math.min(2,bot.lane+(Math.random()<.5?-1:1)));
    bot.laneClock=5+Math.random()*7;
   }
   const relative=bot.distance-distance;
   bot.mesh.position.set(lanes[bot.lane],0,bike.position.z-relative);
   bot.mesh.visible=Math.abs(relative)<190;
   if(bot.mesh.visible)checkCompetitorCollision(bot.mesh,now);
  }
  publishMultiplayerState(now);

  // Traffic movement, collisions and arcade-style car blast effects.
  for(const car of cars){
   if(car.exploding){
    car.explodeTime+=dt;
    car.velocityY-=15*dt;
    car.mesh.position.y+=car.velocityY*dt;
    car.mesh.rotation.x+=dt*5.5;
    car.mesh.rotation.z+=dt*4.2;
    car.mesh.position.x+=car.launchX*dt;
    car.mesh.position.z+=car.launchZ*dt;
    if(car.explodeTime>1.25){
     car.exploding=false;
     car.mesh.position.y=0;
     car.mesh.rotation.set(0,0,0);
     car.z=-230-Math.random()*80;
     car.lane=Math.floor(Math.random()*3);
     car.speed=10+Math.random()*15;
     car.mesh.position.x=lanes[car.lane];
     car.mesh.position.z=car.z;
    }
    continue;
   }

   car.z+=movement-car.speed*dt;
   if(car.z>14){
    car.z=-230-Math.random()*80;
    car.lane=Math.floor(Math.random()*3);
    car.speed=10+Math.random()*15;
    car.mesh.position.x=lanes[car.lane];
   }
   car.mesh.position.z=car.z;

   const distanceZ=Math.abs(car.z-bike.position.z);
   const distanceX=Math.abs(car.mesh.position.x-bike.position.x);
   // The collision envelope follows the visible vehicle footprint, not a tiny point.
   // Trigger just before the bike reaches the car so the impact is seen from the rider camera.
   if(distanceZ<3.15&&distanceX<1.55&&speed>MIN_SPEED&&crashCooldown<=0){
    speed=Math.max(MIN_SPEED,speed*0.72);
    crashShock=1;
    crashCooldown=1.0;
    bike.rotation.z+=(bike.position.x<car.mesh.position.x?-.10:.10);
    car.exploding=true;
    car.explodeTime=0;
    car.velocityY=10.5;
    car.launchX=(car.mesh.position.x-bike.position.x)*1.2+(Math.random()-.5)*2;
    car.launchZ=3.2;
    car.mesh.position.y=.15;
    spawnExplosion(car.mesh.position.clone().add(new THREE.Vector3(0,1.05,0)));
   }
  }

  // Animate and clean up the short-lived explosion particles.
  for(let i=explosions.length-1;i>=0;i--){
   const fx=explosions[i];
   fx.age+=dt;
   fx.flash.scale.setScalar(1+fx.age*7);
   fx.flash.material.opacity=Math.max(0,.95-fx.age*1.8);
   for(const spark of fx.sparks){
    spark.velocity.y-=9*dt;
    spark.mesh.position.addScaledVector(spark.velocity,dt);
    spark.mesh.scale.multiplyScalar(Math.max(.01,1-dt*1.8));
   }
   if(fx.age>1.0){
    scene.remove(fx.flash);
    fx.flash.geometry.dispose();
    fx.flash.material.dispose();
    fx.sparks.forEach(s=>{
     scene.remove(s.mesh);
     s.mesh.geometry.dispose();
     s.mesh.material.dispose();
    });
    explosions.splice(i,1);
   }
  }

  // First-person rider camera with subtle helmet vibration and lean.
  const shakeAmount=0.008+Math.min(speed/MAX_SPEED,1)*0.018;
  const impactJitter=crashShock*0.075;
  const cameraShakeX=Math.sin(now*0.018)*shakeAmount+Math.sin(now*0.09)*impactJitter;
  const cameraShakeY=Math.sin(now*0.022)*shakeAmount*0.65+
   Math.abs(Math.sin(now*0.075))*impactJitter;
  let desiredCameraX,desiredCameraY,desiredCameraZ,lookY,lookZ;
  if(cameraMode==="first"){
   // Rider eye position: close to the handlebar/head area, looking straight down the road.
   desiredCameraX=bike.position.x+cameraShakeX*.35;
   desiredCameraY=1.72+cameraShakeY*.35;
   desiredCameraZ=bike.position.z+0.02;
   lookY=1.68-crashShock*.06+(braking?.025:0);
   lookZ=bike.position.z-55;
  }else{
   // Existing over-the-bike chase view.
   desiredCameraX=bike.position.x+cameraShakeX;
   desiredCameraY=2.15+cameraShakeY;
   desiredCameraZ=bike.position.z+3.5;
   lookY=1.52-crashShock*0.10+(braking?.035:0);
   lookZ=bike.position.z-45;
  }
  camera.position.x=THREE.MathUtils.damp(camera.position.x,desiredCameraX,9,dt);
  camera.position.y=THREE.MathUtils.damp(camera.position.y,desiredCameraY,9,dt);
  camera.position.z=THREE.MathUtils.damp(camera.position.z,desiredCameraZ,9,dt);

  skyDome.position.x=camera.position.x;
  skyDome.position.z=camera.position.z;
  camera.lookAt(
   bike.position.x+(cameraMode==="first"?0:lateralVelocity*.035),
   lookY,
   lookZ
  );
  // Keep the chase camera's lean subtle; first-person view stays steadier.
  const cameraLean=cameraMode==="first"?.10:.42;
  camera.rotation.z=bike.rotation.z*cameraLean+
   Math.sin(now*0.08)*crashShock*0.035;
  const targetFov=(cameraMode==="first"?82:78)+Math.min(speed/MAX_SPEED,1)*7;
  camera.fov=THREE.MathUtils.damp(camera.fov,targetFov,2.5,dt);
  camera.updateProjectionMatrix();

  if(crashFX)crashFX.style.opacity=String(Math.min(crashShock*0.55,0.55));
  const speedFX=document.getElementById("speedFX");
  if(speedFX)speedFX.style.opacity=String(Math.max(0,(speed-22)/MAX_SPEED)*.48);
  updateRideAudio(speed,accelerating,braking);
  // Dashboard
  const gear="D";

  stats.innerHTML=`<strong>${Math.round(speed*3.6)} km/h</strong>`;
 }

 if(!RENDER_INTERVAL || now-lastRender>=RENDER_INTERVAL){
  renderer.render(scene,camera);
  lastRender=now;
 }
}

requestAnimationFrame(animate);

/* RESIZE */

addEventListener("blur",()=>{
 Object.keys(keys).forEach(k=>keys[k]=false);
});
document.addEventListener("visibilitychange",()=>{
 if(document.hidden){
  Object.keys(keys).forEach(k=>keys[k]=false);
  if(started&&!paused)pauseGame();
 }else{
  previous=performance.now();
 }
});
let resizeTimer=0;
function resizeGame(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight,false);
 renderer.setPixelRatio(Math.min(devicePixelRatio,
  settings.graphicsQuality==="performance"?(IS_MOBILE?1:1.15):
  settings.graphicsQuality==="balanced"?(IS_MOBILE?1.2:1.5):(IS_MOBILE?1.35:1.8)));
}
addEventListener("resize",resizeGame,{passive:true});
addEventListener("orientationchange",()=>setTimeout(resizeGame,180),{passive:true});

</script>
