<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Drawing</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #050505;
}

/* =========================
   LOADING SCREEN
========================= */

#loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(circle at center, #171717 0%, #050505 60%);

    color: white;
    transition: opacity 0.7s ease, visibility 0.7s ease;
}

#loadingScreen.hide {
    opacity: 0;
    visibility: hidden;
}

.logo {
    font-size: 55px;
    margin-bottom: 18px;
    animation: floatLogo 2s ease-in-out infinite;
}

@keyframes floatLogo {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

.loadingTitle {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1px;
}

.loadingText {
    margin-top: 8px;
    color: #888;
    font-size: 14px;
}

.loader {
    width: 180px;
    height: 4px;
    margin-top: 28px;
    border-radius: 20px;
    overflow: hidden;
    background: #222;
}

.loaderBar {
    width: 0%;
    height: 100%;
    background: white;
    border-radius: 20px;
    animation: loading 1.8s ease forwards;
}

@keyframes loading {
    to {
        width: 100%;
    }
}


/* =========================
   WELCOME SCREEN
========================= */

#welcomeScreen {
    position: fixed;
    inset: 0;
    z-index: 50;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(circle at 50% 35%, #202020 0%, #090909 45%, #000 100%);

    color: white;

    opacity: 0;
    visibility: hidden;

    transition: opacity 0.6s ease;
}

#welcomeScreen.show {
    opacity: 1;
    visibility: visible;
}

.welcomeBox {
    width: min(420px, 90%);
    padding: 42px 30px;

    text-align: center;

    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.1);

    border-radius: 28px;

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 30px 80px rgba(0,0,0,0.5);

    animation: boxAppear 0.7s ease;
}

@keyframes boxAppear {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.welcomeIcon {
    width: 75px;
    height: 75px;

    margin: 0 auto 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 38px;

    border-radius: 22px;

    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.12);

    box-shadow: 0 10px 40px rgba(255,255,255,0.05);
}

.welcomeBox h1 {
    font-size: 32px;
    margin-bottom: 12px;
}

.welcomeBox p {
    color: #999;
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 30px;
}

.selectButton {
    width: 100%;
    padding: 16px;

    border: none;
    border-radius: 16px;

    background: white;
    color: black;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.selectButton:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(255,255,255,.15);
}

.selectButton:active {
    transform: scale(.97);
}

#imageInput {
    display: none;
}

.smallText {
    margin-top: 18px !important;
    margin-bottom: 0 !important;
    font-size: 12px !important;
    color: #666 !important;
}


/* =========================
   CAMERA SCREEN
========================= */

#cameraScreen {
    position: fixed;
    inset: 0;

    background: black;

    opacity: 0;
    visibility: hidden;

    transition: opacity .5s ease;
}

#cameraScreen.show {
    opacity: 1;
    visibility: visible;
}

#camera {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
}

/* Selected image over camera */

#overlayImage {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    max-width: 70vw;
    max-height: 70vh;

    object-fit: contain;

    z-index: 5;

    display: none;

    user-select: none;
    pointer-events: none;

    filter:
        drop-shadow(0 8px 20px rgba(0,0,0,.5));
}

/* Camera UI */

.cameraTop {
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;

    display: flex;
    justify-content: space-between;

    z-index: 10;
}

.cameraTitle {
    padding: 11px 16px;

    border-radius: 15px;

    background: rgba(0,0,0,.5);
    backdrop-filter: blur(12px);

    color: white;
    font-size: 14px;
}

.cameraButton {
    border: none;

    padding: 11px 16px;

    border-radius: 15px;

    background: rgba(0,0,0,.55);
    color: white;

    cursor: pointer;

    backdrop-filter: blur(12px);
}

.cameraButton:hover {
    background: rgba(255,255,255,.15);
}

#cameraMessage {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 20;

    color: white;

    text-align: center;

    padding: 25px;

    background: rgba(0,0,0,.7);

    border-radius: 20px;

    display: none;
}
</style>
</head>

<body>


<!-- =========================
     LOADING
========================= -->

<div id="loadingScreen">

    <div class="logo">🎨</div>

    <div class="loadingTitle">
        AR Drawing
    </div>

    <div class="loadingText">
        Preparing your creative space...
    </div>

    <div class="loader">
        <div class="loaderBar"></div>
    </div>

</div>


<!-- =========================
     WELCOME
========================= -->

<div id="welcomeScreen">

    <div class="welcomeBox">

        <div class="welcomeIcon">
            🎨
        </div>

        <h1>
            Welcome to AR Drawing
        </h1>

        <p>
            Turn your camera into a creative canvas.
            Select an image and place it over the real world.
        </p>

        <label class="selectButton">

            Select Image

            <input
                id="imageInput"
                type="file"
                accept="image/*"
            >

        </label>

        <p class="smallText">
            Your image stays on your device.
        </p>

    </div>

</div>


<!-- =========================
     CAMERA
========================= -->

<div id="cameraScreen">

    <video
        id="camera"
        autoplay
        playsinline>
    </video>

    <img
        id="overlayImage"
        alt="Selected drawing">

    <div class="cameraTop">

        <div class="cameraTitle">
            🎨 AR Drawing
        </div>

        <button
            class="cameraButton"
            onclick="changeImage()">
            Change Image
        </button>

    </div>

    <div id="cameraMessage"></div>

</div>


<script>

const loadingScreen =
    document.getElementById("loadingScreen");

const welcomeScreen =
    document.getElementById("welcomeScreen");

const cameraScreen =
    document.getElementById("cameraScreen");

const imageInput =
    document.getElementById("imageInput");

const camera =
    document.getElementById("camera");

const overlayImage =
    document.getElementById("overlayImage");

const cameraMessage =
    document.getElementById("cameraMessage");

let cameraStream = null;


/* =========================
   START APPLICATION
========================= */

window.addEventListener("load", () => {

    setTimeout(() => {

        loadingScreen.classList.add("hide");

        setTimeout(() => {

            welcomeScreen.classList.add("show");

        }, 400);

    }, 2000);

});


/* =========================
   IMAGE SELECTION
========================= */

imageInput.addEventListener("change", async (event) => {

    const file = event.target.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {

        alert("Please select an image.");

        return;
    }

    const imageURL =
        URL.createObjectURL(file);

    overlayImage.src = imageURL;

    welcomeScreen.classList.remove("show");

    setTimeout(() => {

        cameraScreen.classList.add("show");

    }, 300);

    await startCamera();

    overlayImage.style.display = "block";

});


/* =========================
   CAMERA
========================= */

async function startCamera() {

    try {

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {

            throw new Error(
                "Camera API unavailable"
            );
        }

        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    }
                },

                audio: false

            });

        camera.srcObject =
            cameraStream;

        cameraMessage.style.display =
            "none";

    }

    catch (error) {

        console.error(error);

        cameraMessage.innerHTML = `
            <h3>Camera Access Required</h3>
            <br>
            Allow camera permission and
            open this website using HTTPS
            or localhost.
        `;

        cameraMessage.style.display =
            "block";

    }

}


/* =========================
   CHANGE IMAGE
========================= */

function changeImage() {

    imageInput.value = "";

    imageInput.click();

}

</script>

</body>
</html>
