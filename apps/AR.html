<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR Draw</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
        touch-action: none;
    }

    #camera {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        transform: scaleX(-1);
    }

    #drawCanvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        transform: scaleX(-1);
        touch-action: none;
    }

    #topBar {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;

        display: flex;
        align-items: center;
        gap: 10px;

        padding: 10px 15px;
        border-radius: 20px;

        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(12px);
        color: white;
    }

    #topBar h1 {
        font-size: 18px;
        white-space: nowrap;
    }

    #controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;

        display: flex;
        align-items: center;
        gap: 12px;

        padding: 12px 16px;
        border-radius: 25px;

        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(15px);
    }

    button,
    input {
        cursor: pointer;
    }

    button {
        border: none;
        color: white;
        background: #222;
        padding: 10px 14px;
        border-radius: 15px;
        font-size: 14px;
    }

    button:hover {
        background: #444;
    }

    #color {
        width: 40px;
        height: 40px;
        border: none;
        background: transparent;
    }

    #size {
        width: 100px;
    }

    #message {
        position: fixed;
        z-index: 20;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        padding: 20px;
        border-radius: 15px;

        color: white;
        background: rgba(0, 0, 0, 0.75);
        text-align: center;
        max-width: 90%;
    }

    #capture {
        background: #ffffff;
        color: #000;
    }

    @media (max-width: 600px) {
        #topBar h1 {
            font-size: 15px;
        }

        #controls {
            width: 94%;
            justify-content: center;
            gap: 7px;
        }

        button {
            padding: 9px 10px;
            font-size: 12px;
        }

        #size {
            width: 70px;
        }
    }
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<canvas id="drawCanvas"></canvas>

<div id="topBar">
    <h1>🎨 AR Draw</h1>
</div>

<div id="message">
    <div>📷 Camera access is required.</div>
    <br>
    <button onclick="startCamera()">Start Camera</button>
</div>

<div id="controls">

    <input id="color" type="color" value="#ff0000">

    <input id="size"
           type="range"
           min="1"
           max="40"
           value="6">

    <button onclick="clearDrawing()">Clear</button>

    <button onclick="undo()">Undo</button>

    <button id="capture" onclick="captureImage()">
        📸 Save
    </button>

</div>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");

const colorPicker = document.getElementById("color");
const sizeSlider = document.getElementById("size");
const message = document.getElementById("message");

let drawing = false;
let lastX = 0;
let lastY = 0;

let history = [];

// --------------------------------------------------
// CAMERA
// --------------------------------------------------

async function startCamera() {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: "environment"
                },
                width: {
                    ideal: 1920
                },
                height: {
                    ideal: 1080
                }
            },
            audio: false
        });

        video.srcObject = stream;

        message.style.display = "none";

        resizeCanvas();

    } catch (error) {

        message.innerHTML = `
            ❌ Camera could not be started.<br><br>
            Allow camera permission and use HTTPS or localhost.
        `;

        console.error(error);
    }
}


// --------------------------------------------------
// CANVAS
// --------------------------------------------------

function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
}

window.addEventListener("resize", resizeCanvas);


// --------------------------------------------------
// DRAWING
// --------------------------------------------------

function getPosition(event) {

    const rect = canvas.getBoundingClientRect();

    let x;
    let y;

    if (event.touches) {

        x = event.touches[0].clientX - rect.left;
        y = event.touches[0].clientY - rect.top;

    } else {

        x = event.clientX - rect.left;
        y = event.clientY - rect.top;
    }

    return {
        x: x * (canvas.width / rect.width),
        y: y * (canvas.height / rect.height)
    };
}


function startDrawing(event) {

    event.preventDefault();

    const pos = getPosition(event);

    drawing = true;

    lastX = pos.x;
    lastY = pos.y;

    saveHistory();
}


function draw(event) {

    if (!drawing) return;

    event.preventDefault();

    const pos = getPosition(event);

    ctx.strokeStyle = colorPicker.value;
    ctx.lineWidth = Number(sizeSlider.value);

    ctx.beginPath();

    ctx.moveTo(lastX, lastY);

    ctx.lineTo(pos.x, pos.y);

    ctx.stroke();

    lastX = pos.x;
    lastY = pos.y;
}


function stopDrawing() {

    drawing = false;
}


// Mouse
canvas.addEventListener("mousedown", startDrawing);
canvas.addEventListener("mousemove", draw);
canvas.addEventListener("mouseup", stopDrawing);
canvas.addEventListener("mouseleave", stopDrawing);


// Touch
canvas.addEventListener("touchstart", startDrawing, {
    passive: false
});

canvas.addEventListener("touchmove", draw, {
    passive: false
});

canvas.addEventListener("touchend", stopDrawing);


// --------------------------------------------------
// UNDO
// --------------------------------------------------

function saveHistory() {

    history.push(
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        )
    );

    if (history.length > 20) {
        history.shift();
    }
}


function undo() {

    if (history.length === 0) return;

    const previous = history.pop();

    ctx.putImageData(previous, 0, 0);
}


// --------------------------------------------------
// CLEAR
// --------------------------------------------------

function clearDrawing() {

    saveHistory();

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


// --------------------------------------------------
// SAVE IMAGE
// --------------------------------------------------

function captureImage() {

    const output = document.createElement("canvas");

    output.width = video.videoWidth;
    output.height = video.videoHeight;

    const outCtx = output.getContext("2d");

    // Mirror camera
    outCtx.translate(output.width, 0);
    outCtx.scale(-1, 1);

    outCtx.drawImage(
        video,
        0,
        0,
        output.width,
        output.height
    );

    // Draw canvas over camera
    outCtx.drawImage(
        canvas,
        0,
        0,
        output.width,
        output.height
    );

    const link = document.createElement("a");

    link.download = "ar-drawing.png";
    link.href = output.toDataURL("image/png");

    link.click();
}

</script>

</body>
</html>
