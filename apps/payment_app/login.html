<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#2193b0,#6dd5ed);
}

.box{
width:340px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
padding:25px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,.25);
}

h1{
text-align:center;
color:white;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
outline:none;
font-size:16px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#00c853;
color:white;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#00b248;
}

#loginBtn{
background:#2979ff;
}

#loginBtn:hover{
background:#1565c0;
}

p{
margin-top:15px;
text-align:center;
color:white;
}
</style>

</head>
<body>

<div class="box">

<h1>P-PAY</h1>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button id="signupBtn">Create Account</button>

<button id="loginBtn">Login</button>

<p id="status"></p>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import{
getDatabase,
ref,
set,
get
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBq7UEsIwoudC2g8DRrG7EwqblX9SIDCF8",
  authDomain: "ticktok-7fb30.firebaseapp.com",
  databaseURL: "https://ticktok-7fb30-default-rtdb.firebaseio.com",
  projectId: "ticktok-7fb30",
  storageBucket: "ticktok-7fb30.firebasestorage.app",
  messagingSenderId: "493782050714",
  appId: "1:493782050714:web:2bda69e946d8bdfb50fc23",
  measurementId: "G-2FYPJB4Y9Y"
};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);
const db=getDatabase(app);
window.testDB = async () => {
    try {
        await set(ref(db, "test"), {
            hello: "world"
        });
        console.log("SUCCESS");
    } catch (e) {
        console.error(e);
    }
};
function makeEmail(username){
return username.toLowerCase()+"@rmusic.local";
}

signupBtn.onclick = async () => {

    const user = username.value.trim().toLowerCase();
    const pass = password.value;

    if(user=="" || pass==""){

        document.getElementById("status").innerText="Fill all fields";
        return;

    }

    try{

        const result = await createUserWithEmailAndPassword(
            auth,
            makeEmail(user),
            pass
        );

        const uid = result.user.uid;

        console.log("About to write user:", uid);

        console.log("Writing user...");

        await set(ref(db, "users/" + uid), {
            username: user,
            email: makeEmail(user),
            balance: 100
        });

        console.log("User written!");

        const snapshot = await get(ref(db, "users/" + uid));
        console.log("Exists:", snapshot.exists());
        console.log("Data:", snapshot.val());

        const check = await get(ref(db,"users/"+uid));

        if(!check.exists()){

            throw new Error("Database write failed.");

        }

        sessionStorage.setItem("signupDone","true");

        window.location="app.html";

        }catch(error){
        
            console.error("WRITE ERROR:", error);
        
            alert(
                error.code + "\n" +
                error.message + "\n\n" +
                JSON.stringify(error, null, 2)
            );
        
        }

};
loginBtn.onclick = async () => {

    const user = username.value.trim().toLowerCase();
    const pass = password.value;

    if(user=="" || pass==""){

        document.getElementById("status").innerText="Fill all fields";
        return;

    }

    try{

        await signInWithEmailAndPassword(
            auth,
            makeEmail(user),
            pass
        );

        window.location="app.html";

    }catch(error){

        document.getElementById("status").innerText=
        error.message;

    }

};

</script>

</body>
</html>
