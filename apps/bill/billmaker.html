<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billing App</title>
<style>
/* =====================================================
   APPLE INSPIRED BILLING UI
   Modern • Fast • Responsive • Glassmorphism
===================================================== */

:root{

--bg:#08090b;
--bg2:#13151a;
--glass:rgba(255,255,255,.08);
--glass2:rgba(255,255,255,.12);
--border:rgba(255,255,255,.12);

--text:#ffffff;
--muted:#b8c0cc;

--blue:#4da3ff;
--green:#42d392;
--red:#ff5c5c;

--radius:22px;

--shadow:
0 8px 40px rgba(0,0,0,.35);

}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:
Inter,
"SF Pro Display",
Segoe UI,
Arial,
sans-serif;
}

html{
scroll-behavior:smooth;
}

body{

min-height:100vh;

background:
radial-gradient(circle at top left,#21385c 0%,transparent 40%),
radial-gradient(circle at bottom right,#173324 0%,transparent 40%),
linear-gradient(140deg,#09090b,#111217,#17191d);

color:var(--text);

padding:35px;

display:flex;
justify-content:center;

overflow-x:hidden;

}

/* Floating Background */

body::before,
body::after{

content:"";

position:fixed;

width:420px;
height:420px;

border-radius:50%;

filter:blur(90px);

opacity:.25;

z-index:-1;

animation:float 18s infinite ease-in-out;

}

body::before{

background:#2787ff;

left:-150px;
top:-100px;

}

body::after{

background:#34d399;

right:-150px;
bottom:-120px;

animation-delay:-9s;

}

@keyframes float{

0%{
transform:translate(0,0);
}

50%{
transform:translate(60px,-40px);
}

100%{
transform:translate(0,0);
}

}

/* Card */

#home{

width:min(1200px,100%);

background:var(--glass);

backdrop-filter:blur(12px);

border:1px solid var(--border);

border-radius:32px;

padding:40px;

box-shadow:var(--shadow);

animation:fade .5s ease;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(25px);

}

to{

opacity:1;
transform:none;

}

}

h1{

font-size:clamp(34px,5vw,48px);

font-weight:700;

letter-spacing:-1px;

text-align:center;

margin-bottom:30px;

background:linear-gradient(90deg,#ffffff,#6db6ff);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

h2{

font-size:22px;

font-weight:600;

margin:30px 0 18px;

}

hr{

height:1px;

border:none;

background:rgba(255,255,255,.08);

margin:25px 0;

}

/* Inputs */

input,
textarea{

width:100%;

margin-top:8px;
margin-bottom:18px;

padding:15px 18px;

font-size:15px;

border-radius:18px;

border:1px solid rgba(255,255,255,.08);

background:rgba(255,255,255,.05);

color:white;

outline:none;

transition:
background .25s,
transform .2s,
border .25s,
box-shadow .25s;

}

input::placeholder,
textarea::placeholder{

color:#9ca3af;

}

input:focus,
textarea:focus{

background:rgba(255,255,255,.09);

border-color:#4da3ff;

box-shadow:
0 0 0 4px rgba(77,163,255,.18);

transform:scale(1.01);

}

textarea{

resize:vertical;

min-height:140px;

}

/* Table */

table{

width:100%;

border-collapse:collapse;

overflow:hidden;

border-radius:22px;

background:rgba(255,255,255,.04);

border:1px solid rgba(255,255,255,.06);

}

thead{

background:rgba(255,255,255,.08);

backdrop-filter:blur(10px);

}

th{

padding:18px;

font-weight:600;

font-size:15px;

}

td{

padding:12px;

border-top:1px solid rgba(255,255,255,.05);

transition:.2s;

text-align:center;

}

tbody tr{

transition:
background .2s,
transform .2s;

}

tbody tr:hover{

background:rgba(255,255,255,.04);

transform:scale(.995);

}

td input{

margin:0;

background:rgba(255,255,255,.04);

}

/* Buttons */

button{

padding:14px 24px;

border:none;

border-radius:18px;

cursor:pointer;

font-size:15px;

font-weight:600;

color:white;

background:
linear-gradient(145deg,#3798ff,#1b72ff);

transition:
transform .18s,
box-shadow .18s,
opacity .18s;

box-shadow:
0 10px 30px rgba(0,90,255,.25);

}

button:hover{

transform:translateY(-2px);

box-shadow:
0 18px 40px rgba(0,90,255,.35);

}

button:active{

transform:scale(.97);

}

.deleteBtn{

background:
linear-gradient(145deg,#ff6d6d,#e53e3e);

box-shadow:
0 10px 28px rgba(255,0,0,.22);

}

/* Totals */

#subtotal,
#grandTotal{

font-size:32px;

font-weight:700;

color:#5df2a4;

}

label{

display:block;

font-weight:600;

margin-top:12px;

color:var(--muted);

}

/* Scrollbar */

::-webkit-scrollbar{

width:10px;

}

::-webkit-scrollbar-thumb{

background:#2b74ff;

border-radius:20px;

}

::-webkit-scrollbar-track{

background:transparent;

}

/* Mobile */

@media(max-width:900px){

body{

padding:16px;

}

#home{

padding:22px;

border-radius:24px;

}

table{

display:block;

overflow-x:auto;

white-space:nowrap;

}

button{

width:100%;

margin-top:10px;

}

h1{

font-size:34px;

}

#subtotal,
#grandTotal{

font-size:26px;

}

}

/* Small Phones */

@media(max-width:500px){

input,
textarea{

font-size:14px;

padding:14px;

}

th,
td{

padding:10px;

font-size:13px;

}

h2{

font-size:20px;

}

}

/* Smooth Row Animation */

.itemRow{

animation:rowIn .25s ease;

}

@keyframes rowIn{

from{

opacity:0;
transform:translateY(15px);

}

to{

opacity:1;
transform:none;

}

}
</style>
</head>

<body>

<div id="home">

    <h1>Billing App</h1>

    <hr><br>

    <h2>Invoice Details</h2>

    Invoice No:
    <input id="invoiceNo" readonly>

    Date:
    <input id="invoiceDate" type="date">

    <br><br>

    <h2>Items</h2>

    <table border="1" width="100%">

        <thead>

            <tr>

                <th>#</th>
                <th>Item</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Total</th>
                <th>Delete</th>

            </tr>

        </thead>

        <tbody id="itemTable">

        </tbody>

    </table>

    <br>

    <button id="addItem">
        + Add Item
    </button>

    <hr><br>

    <h2>Bill Summary</h2>

    <p>

        Subtotal :

        <span id="subtotal">₹0.00</span>

    </p>

    <br>

    <label>

        Discount %

        <input
        id="discount"
        type="number"
        value="0">

    </label>

    <br><br>

    <label>

        GST %

        <input
        id="gst"
        type="number"
        value="0">

    </label>

    <br><br>

    <h2>

        Grand Total :

        <span id="grandTotal">

            ₹0.00

        </span>

    </h2>

    <hr><br>

    <h2>Notes</h2>

    <textarea

        id="notes"

        rows="5"

        cols="60"

        placeholder="Write notes here...">

    </textarea>

    <br><br>

    <button onclick="saveBill()">

        💾 Save Bill

    </button>

    <button onclick="newInvoice()">

        🆕 New Invoice

    </button>

    <button onclick="printBill()">

        🖨 Print / PDF

    </button>

</div>

<script>
/*=========================================================
 Billing App - script.js (Part 1A)
 Features:
 ✔ Auto Invoice Number
 ✔ Today's Date
 ✔ Add Item
 ✔ Delete Item
 ✔ Row Number
 ✔ Basic Event System

 Required HTML IDs

 invoiceNo
 invoiceDate
 itemTable
 addItem

=========================================================*/

let invoiceNumber =
parseInt(localStorage.getItem("invoiceNumber")) || 1;

const invoiceInput = document.getElementById("invoiceNo");
const invoiceDate = document.getElementById("invoiceDate");
const itemTable = document.getElementById("itemTable");
const addItemBtn = document.getElementById("addItem");

invoiceInput.value =
"INV-" + String(invoiceNumber).padStart(4, "0");

invoiceDate.value =
new Date().toISOString().split("T")[0];

let rowID = 0;

/*=====================================
Create Item Row
=====================================*/

function createRow() {

    rowID++;

    const row = document.createElement("tr");

    row.className="itemRow";

    row.dataset.id = rowID;

    row.innerHTML = `

<td class="rowNo">${rowID}</td>

<td>
<input
type="text"
class="itemName"
placeholder="Item Name">
</td>

<td>
<input
type="number"
class="qty"
min="1"
value="1">
</td>

<td>
<input
type="number"
class="price"
min="0"
step="0.01"
placeholder="₹0.00"
value="0">
</td>

<td class="total">
₹0
</td>

<td>

<button
class="deleteBtn">

Delete

</button>

</td>

`;

    itemTable.appendChild(row);

}

/*=====================================
Delete Row
=====================================*/

itemTable.addEventListener("click", function(e){

    if(!e.target.classList.contains("deleteBtn"))
        return;

    e.target.closest("tr").remove();

    refreshRowNumbers();

});

/*=====================================
Refresh Row Numbers
=====================================*/

function refreshRowNumbers(){

    const rows =
    itemTable.querySelectorAll("tr");

    let count=1;

    rows.forEach(row=>{

        row.dataset.id=count;

        row.querySelector(".rowNo").textContent=count;

        count++;

    });

    rowID=rows.length;

}

/*=====================================
Add Item Button
=====================================*/

addItemBtn.addEventListener("click",()=>{

    createRow();

});

/*=====================================
New Invoice
=====================================*/

function newInvoice(){

    invoiceNumber++;

    localStorage.setItem(
        "invoiceNumber",
        invoiceNumber
    );

    invoiceInput.value=
    "INV-"+String(invoiceNumber).padStart(4,"0");

    invoiceDate.value=
    new Date().toISOString().split("T")[0];

    itemTable.innerHTML="";

    rowID=0;

    createRow();

    calculateBill();

}

/*=====================================
Keyboard Shortcuts
=====================================*/

document.addEventListener("keydown",function(e){

    if(e.ctrlKey && e.key==="n"){

        e.preventDefault();

        newInvoice();

    }

});

/*=====================================
Start App
=====================================*/


/*=========================================================
 Billing App - script.js (Part 1B)
 Features
 ✔ Qty × Price
 ✔ Row Total
 ✔ Subtotal
 ✔ Discount
 ✔ GST
 ✔ Grand Total
=========================================================*/

/*
Required HTML IDs

subtotal
discount
gst
grandTotal

Example:

<span id="subtotal">₹0</span>

<input id="discount" type="number" value="0">

<input id="gst" type="number" value="0">

<span id="grandTotal">₹0</span>

*/

const subtotalElement = document.getElementById("subtotal");
const discountInput = document.getElementById("discount");
const gstInput = document.getElementById("gst");
const grandTotalElement = document.getElementById("grandTotal");


/*==========================================
Format Rupees
==========================================*/

function rupees(value){

    value = Number(value) || 0;

    return "₹" + value.toFixed(2);

}


/*==========================================
Calculate One Row
==========================================*/

function calculateRow(row){

    const qty =
    Number(
        row.querySelector(".qty").value
    ) || 0;

    const price =
    Number(
        row.querySelector(".price").value
    ) || 0;

    const total =
    qty * price;

    row.querySelector(".total").textContent =
    rupees(total);

    return total;

}


/*==========================================
Calculate Whole Bill
==========================================*/

function calculateBill(){

    let subtotal = 0;

    const rows =
    itemTable.querySelectorAll("tr");

    rows.forEach(row=>{

        subtotal += calculateRow(row);

    });

    subtotalElement.textContent =
    rupees(subtotal);

    let discount =
    Number(discountInput.value) || 0;

    let gst =
    Number(gstInput.value) || 0;

    let afterDiscount =
    subtotal - (subtotal * discount / 100);

    let grandTotal =
    afterDiscount +
    (afterDiscount * gst / 100);

    grandTotalElement.textContent =
    rupees(grandTotal);

}


/*==========================================
Watch Table Changes
==========================================*/

itemTable.addEventListener("input",function(e){

    if(
        e.target.classList.contains("qty") ||
        e.target.classList.contains("price")
    ){

        calculateBill();

    }

});


/*==========================================
Watch Discount
==========================================*/

discountInput.addEventListener("input",function(){

    calculateBill();

});


/*==========================================
Watch GST
==========================================*/

gstInput.addEventListener("input",function(){

    calculateBill();

});


/*==========================================
Update After New Row
==========================================*/

const oldCreateRow = createRow;

createRow = function(){

    oldCreateRow();

    calculateBill();

};


/*==========================================
Update After Delete
==========================================*/

itemTable.addEventListener("click",function(e){

    if(
        e.target.classList.contains("deleteBtn")
    ){

        setTimeout(calculateBill,20);

    }

});


/*==========================================
First Calculation
==========================================*/

calculateBill();

/*=========================================================
 Billing App - script.js (Part 1C)
 Features
 ✔ Auto Save
 ✔ Load Last Bill
 ✔ Ctrl + S
 ✔ Ctrl + P
 ✔ Ctrl + N
 ✔ Notes
=========================================================*/

const notes =
document.getElementById("notes") ||
{value:""};

/*==========================================
Save Bill
==========================================*/

function saveBill(){

    const rows = [];

    itemTable.querySelectorAll("tr").forEach(row=>{

        rows.push({

            item:
            row.querySelector(".itemName").value,

            qty:
            row.querySelector(".qty").value,

            price:
            row.querySelector(".price").value

        });

    });

    const bill={

        invoice:
        invoiceInput.value,

        date:
        invoiceDate.value,

        discount:
        discountInput.value,

        gst:
        gstInput.value,

        notes:
        notes ? notes.value : "",

        rows:
        rows

    };

    localStorage.setItem(
        "currentBill",
        JSON.stringify(bill)
    );

}


/*==========================================
Load Bill
==========================================*/

function loadBill(){

    const saved =
    localStorage.getItem("currentBill");

    if(!saved) return;

    const bill =
    JSON.parse(saved);

    invoiceInput.value =
    bill.invoice;

    invoiceDate.value =
    bill.date;

    discountInput.value =
    bill.discount;

    gstInput.value =
    bill.gst;

    if(notes)
    notes.value=bill.notes;

    itemTable.innerHTML="";

    rowID=0;

    bill.rows.forEach(r=>{

        oldCreateRow();

        const last =
        itemTable.lastElementChild;

        last.querySelector(".itemName").value =
        r.item;

        last.querySelector(".qty").value =
        r.qty;

        last.querySelector(".price").value =
        r.price;

    });

    calculateBill();

}


/*==========================================
Auto Save
==========================================*/

document.addEventListener("input",()=>{

    saveBill();

});


/*==========================================
Save Every 10 Seconds
==========================================*/

setInterval(saveBill,10000);


/*==========================================
Print Bill
==========================================*/

function printBill(){

    saveBill();

    const bill = document.getElementById("bill").innerHTML;

    const printWindow = window.open("", "_blank");

    printWindow.document.write(`
    <html>

    <head>

    <title>Invoice</title>

    <style>

    body{

        font-family:Arial;

        padding:30px;

        color:black;

    }

    table{

        width:100%;

        border-collapse:collapse;

    }

    th,td{

        border:1px solid black;

        padding:8px;

    }

    input,
    textarea,
    button{

        border:none;

        outline:none;

        resize:none;

        background:white;

        color:black;

        font:inherit;

    }

    </style>

    </head>

    <body>

    ${bill}

    </body>

    </html>
    `);

    printWindow.document.close();

    printWindow.focus();

    printWindow.print();

    printWindow.close();

}


/*==========================================
Keyboard Shortcuts
==========================================*/

document.addEventListener("keydown",function(e){

    if(e.ctrlKey && e.key==="s"){

        e.preventDefault();

        saveBill();

        alert("Bill Saved");

    }

    if(e.ctrlKey && e.key==="p"){

        e.preventDefault();

        printBill();

    }

});


/*==========================================
New Invoice Override
==========================================*/

const oldNewInvoice = newInvoice;

newInvoice=function(){

    if(confirm("Create New Invoice?")){

        oldNewInvoice();

        discountInput.value=0;

        gstInput.value=0;

        if(notes)
        notes.value="";

        calculateBill();

        saveBill();

    }

};


/*==========================================
Load Previous Bill On Start
==========================================*/

window.addEventListener("load",()=>{

    loadBill();

    if(itemTable.children.length===0){

        oldCreateRow();

    }

    calculateBill();

});
</script>

</body>
</html>
