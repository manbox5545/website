<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>CAMPLAGUE</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #000;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    touch-action: manipulation;
}


/* =====================================================
   LOADING SCREEN
===================================================== */

#loadingScreen {
    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #000;

    transition:
        opacity .7s ease,
        visibility .7s ease;
}

#loadingScreen.hide {
    opacity: 0;
    visibility: hidden;
}

.loadingAura {
    position: absolute;

    width: 70vw;
    height: 70vw;

    max-width: 650px;
    max-height: 650px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0,255,130,.22),
            rgba(0,220,255,.16),
            rgba(0,70,255,.10),
            transparent 70%
        );

    filter: blur(45px);

    animation:
        auraPulse 3s ease-in-out infinite,
        auraRotate 8s linear infinite;
}

.loadingContent {
    position: relative;

    z-index: 2;

    text-align: center;
}

.logo {
    font-size:
        clamp(45px, 12vw, 105px);

    font-weight: 900;

    letter-spacing: 5px;

    background:
        linear-gradient(
            100deg,
            #00ff88,
            #00f5d4,
            #00cfff,
            #0066ff,
            #00ff88
        );

    background-size: 300% 300%;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        gradientMove 4s ease infinite,
        logoFloat 2s ease-in-out infinite;
}

.loadingSubtitle {
    margin-top: 16px;

    color:
        rgba(180,255,240,.55);

    font-size: 11px;

    letter-spacing: 5px;

    text-transform: uppercase;
}

.loader {
    width: min(280px,65vw);

    height: 4px;

    margin:
        38px auto 0;

    border-radius: 10px;

    overflow: hidden;

    background:
        rgba(255,255,255,.08);
}

.loaderBar {
    width: 0%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #00ff88,
            #00f5d4,
            #00cfff,
            #0066ff
        );

    box-shadow:
        0 0 18px rgba(0,255,200,.8);

    animation:
        loadingProgress 2s
        cubic-bezier(.22,1,.36,1)
        forwards;
}


/* =====================================================
   APP
===================================================== */

#app {
    position: fixed;

    inset: 0;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity .6s ease;
}

#app.show {
    opacity: 1;

    visibility: visible;
}


/* =====================================================
   GALLERY
===================================================== */

#galleryScreen {
    position: absolute;

    inset: 0;

    overflow-y: auto;

    padding:
        25px 18px
        110px;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(0,255,180,.08),
            transparent 35%
        ),
        #050505;
}

.galleryHeader {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 22px;
}

.galleryTitle {
    font-size: 27px;

    font-weight: 800;

    letter-spacing: 1px;

    background:
        linear-gradient(
            90deg,
            #00ff88,
            #00d9ff,
            #0066ff
        );

    -webkit-background-clip: text;

    color: transparent;
}

.photoCount {
    color: #777;

    font-size: 12px;
}

#photoGrid {
    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 12px;
}

.photoCard {
    position: relative;

    overflow: hidden;

    border-radius: 18px;

    background: #111;

    border:
        1px solid
        rgba(255,255,255,.08);

    aspect-ratio: 1 / 1;

    animation:
        photoAppear .35s ease;
}

.photoCard img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}

.photoActions {
    position: absolute;

    left: 8px;
    right: 8px;
    bottom: 8px;

    display: flex;

    gap: 7px;
}

.photoAction {
    flex: 1;

    min-height: 36px;

    border: 1px solid
        rgba(255,255,255,.12);

    border-radius: 12px;

    background:
        rgba(0,0,0,.65);

    backdrop-filter:
        blur(12px);

    color: white;

    cursor: pointer;

    font-size: 14px;
}

.photoAction:active {
    transform: scale(.94);
}


/* =====================================================
   EMPTY GALLERY
===================================================== */

#emptyGallery {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    text-align: center;

    width: 90%;

    color: #666;
}

.emptyIcon {
    font-size: 55px;

    margin-bottom: 14px;

    opacity: .6;
}

.emptyTitle {
    color: #aaa;

    font-size: 18px;

    font-weight: 700;

    margin-bottom: 7px;
}

.emptyText {
    font-size: 13px;

    line-height: 1.5;
}


/* =====================================================
   CAMERA SCREEN
===================================================== */

#cameraScreen {
    position: absolute;

    inset: 0;

    background: #000;

    display: none;
}

#cameraScreen.active {
    display: block;
}

#camera {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
}

#camera.frontCamera {
    transform: scaleX(-1);
}



/* =====================================================
   CAMERA TOP BAR
===================================================== */

.cameraTop {
    position: absolute;

    top: 18px;

    left: 18px;
    right: 18px;

    z-index: 20;

    display: flex;

    justify-content:
        space-between;

    align-items:
        flex-start;
}

.cameraTopButton {
    width: 48px;
    height: 48px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(0,0,0,.42);

    backdrop-filter:
        blur(16px);

    color: white;

    font-size: 21px;

    cursor: pointer;

    transition:
        transform .2s ease,
        background .2s ease;
}

.cameraTopButton:active {
    transform: scale(.88);
}

.cameraTools {
    display: flex;

    flex-direction: column;

    gap: 10px;
}

.cameraTool {
    width: 48px;
    height: 48px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(0,0,0,.42);

    backdrop-filter:
        blur(16px);

    color: white;

    font-size: 20px;

    cursor: pointer;

    transition:
        .25s ease;
}

.cameraTool.active {
    background:
        rgba(0,255,180,.22);

    border-color:
        rgba(0,255,180,.5);

    box-shadow:
        0 0 20px
        rgba(0,255,180,.2);
}

.cameraTool.disabled {
    opacity: .25;

    pointer-events: none;
}


/* =====================================================
   CAMERA BOTTOM
===================================================== */

.cameraBottom {
    position: absolute;

    left: 0;
    right: 0;

    bottom: 30px;

    z-index: 20;

    display: flex;

    align-items: center;

    justify-content: center;

    height: 100px;
}


/* =====================================================
   SHUTTER AREA
===================================================== */

.cameraControls {
    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 20px;

    transition:
        transform .42s
        cubic-bezier(.22,1,.36,1);
}




/* =====================================================
   SHUTTER
===================================================== */

.shutterOuter {
    width: 76px;
    height: 76px;

    border-radius: 50%;

    border:
        3px solid white;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    flex-shrink: 0;

    transition:
        transform .18s ease;
}

.shutterOuter:active {
    transform: scale(.88);
}

.shutterInner {
    width: 62px;
    height: 62px;

    border-radius: 50%;

    background: white;

    transition:
        transform .15s ease,
        border-radius .2s ease;
}

.shutterOuter.capture
.shutterInner {
    transform: scale(.75);

    border-radius: 18px;
}


/* =====================================================
   FILTER BUTTON
===================================================== */

.filterButton {
    width: 76px;
    height: 76px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.25);

    background:
        rgba(0,0,0,.45);

    backdrop-filter:
        blur(18px);

    display: flex;

    align-items: center;

    justify-content: center;

    color: white;

    font-size: 27px;

    cursor: pointer;

    flex-shrink: 0;

    transition:
        transform .42s
        cubic-bezier(.22,1,.36,1),
        background .3s ease,
        border-color .3s ease;
}

.filterButton.active {
    background:
        rgba(255,255,255,.22);

    border-color:
        rgba(255,255,255,.65);

    transform:
        scale(.94);
}


/* =====================================================
   FILTER SLIDER HINT
===================================================== */

.filterHint {
    position: absolute;

    bottom: 105px;

    left: 50%;

    transform:
        translateX(-50%);

    color:
        rgba(255,255,255,.5);

    font-size: 10px;

    letter-spacing: 2px;

    white-space: nowrap;

    opacity: 0;

    transition:
        opacity .3s ease;
}

.cameraControls.filterActive
~ .filterHint {
    opacity: 1;
}


/* =====================================================
   FLASH MESSAGE
===================================================== */

#cameraMessage {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    z-index: 100;

    width: min(320px,85vw);

    padding: 18px;

    text-align: center;

    border-radius: 18px;

    background:
        rgba(0,0,0,.75);

    backdrop-filter:
        blur(18px);

    color: white;

    font-size: 13px;

    line-height: 1.5;

    display: none;
}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes loadingProgress {

    from {
        width: 0%;
    }

    to {
        width: 100%;
    }

}

@keyframes gradientMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}

@keyframes logoFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-7px);
    }

}

@keyframes auraPulse {

    0%,
    100% {
        transform: scale(.9);
        opacity: .7;
    }

    50% {
        transform: scale(1.1);
        opacity: 1;
    }

}

@keyframes auraRotate {

    from {
        rotate: 0deg;
    }

    to {
        rotate: 360deg;
    }

}

@keyframes photoAppear {

    from {
        opacity: 0;
        transform: scale(.92);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}


/* =====================================================
   DESKTOP
===================================================== */


/* IMAGE PREVIEW */
#imagePreview{position:fixed;inset:0;z-index:20000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.9);backdrop-filter:blur(14px)}
#imagePreview.active{display:flex}
.previewFrame{position:relative;width:min(94vw,1100px);height:min(88vh,900px);display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:20px;background:#080808;border:1px solid rgba(255,255,255,.15)}
#previewImage{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;cursor:zoom-in;transform-origin:center center;transition:transform .15s ease}
#previewImage.zoomed{cursor:grab}
.previewClose{position:absolute;top:12px;right:12px;z-index:3;width:46px;height:46px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(0,0,0,.65);color:white;font-size:23px;cursor:pointer}
.previewHint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:7px 12px;border-radius:20px;background:rgba(0,0,0,.6);color:rgba(255,255,255,.65);font-size:10px;white-space:nowrap;pointer-events:none}
.photoCard img{cursor:zoom-in}
.cameraControls.filterActive{transform:translateX(38px)}
.cameraControls.filterActive .filterButton{order:1;border:3px solid white;background:white;color:#111;font-size:0}
.cameraControls.filterActive .filterButton::after{content:"";display:block;width:62px;height:62px;border-radius:50%;background:#111}
.cameraControls.filterActive .shutterOuter{order:2}
@media(max-width:420px){
.cameraControls.filterActive{transform:translateX(35px)}
.cameraControls.filterActive .filterButton::after{width:57px;height:57px}
}


/* B&W shutter click animation */
.cameraControls.filterActive .filterButton.capture {
    transform: scale(.88);
}

.cameraControls.filterActive .filterButton.capture::after {
    transform: scale(.72);
    border-radius: 17px;
}

.filterButton.capture {
    transition:
        transform .12s ease,
        background .12s ease,
        border-color .12s ease;
}


/* CENTER SHUTTER + EFFECTS */
.cameraControls {
    width: 100%;
    justify-content: center;
    transform: none !important;
}

.effectsArea {
    position: absolute;
    right: 22px;
    bottom: 12px;
    z-index: 25;
}

.effectsButton {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2);
    background: rgba(0,0,0,.5);
    backdrop-filter: blur(16px);
    color: white;
    font-size: 24px;
    cursor: pointer;
    transition: transform .2s ease, background .2s ease;
}

.effectsButton:active {
    transform: scale(.88);
}

.effectsButton.active {
    background: rgba(0,255,180,.2);
    border-color: rgba(0,255,180,.5);
}

.effectsMenu {
    position: absolute;
    right: 0;
    bottom: 68px;
    width: 175px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 16px;
    background: rgba(5,5,5,.88);
    backdrop-filter: blur(18px);
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px) scale(.95);
    transform-origin: bottom right;
    transition: .22s ease;
}

.effectsMenu.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
}

.effectOption {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 46px;
    padding: 7px 9px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: transparent;
    color: white;
    text-align: left;
    cursor: pointer;
}

.effectOption.active {
    background: rgba(255,255,255,.1);
    border-color: rgba(255,255,255,.15);
}

.effectPreview {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border-radius: 8px;
    background: linear-gradient(135deg,#777,#ddd,#333);
}

.bwPreview {
    filter: grayscale(1);
}

.effectPopup {
    position: absolute;
    left: 50%;
    bottom: 128px;
    z-index: 30;
    transform: translate(-50%,10px);
    padding: 10px 16px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 22px;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(15px);
    color: white;
    font-size: 11px;
    letter-spacing: 1.8px;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    transition: .25s ease;
}

.effectPopup.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%,0);
}

#camera.bwPreviewLive {
    filter: grayscale(1);
}

.shutterOuter.capture {
    transform: scale(.86);
}

.shutterOuter.capture .shutterInner {
    transform: scale(.74);
    border-radius: 18px;
}

@media (max-width:420px) {
    .effectsArea {
        right: 12px;
        bottom: 10px;
    }

    .effectsButton {
        width: 54px;
        height: 54px;
    }

    .effectsMenu {
        bottom: 62px;
    }
}

@media (min-width: 700px) {

    #photoGrid {
        grid-template-columns:
            repeat(4,1fr);

        max-width: 1000px;

        margin: auto;
    }

    .galleryHeader {
        max-width: 1000px;

        margin-left: auto;
        margin-right: auto;
    }

}



/* =====================================================
   HAMOOD!! GREEN SCREEN EFFECT
===================================================== */

#hamoodVideo{
    display:none;
    position:absolute;
    width:1px;
    height:1px;
    opacity:0;
    pointer-events:none;
}

#compositeCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:5;
    background:#000;
}

#camera.hamoodActive{
    visibility:hidden;
}

#compositeCanvas.hamoodActive{
    display:block;
}

.hamoodBadge{
    position:absolute;
    left:50%;
    top:88px;
    z-index:35;
    transform:translate(-50%,-8px);
    padding:8px 14px;
    border:1px solid rgba(0,255,180,.35);
    border-radius:20px;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(14px);
    color:#8fffd3;
    font-size:10px;
    font-weight:800;
    letter-spacing:2px;
    opacity:0;
    visibility:hidden;
    transition:.25s ease;
    pointer-events:none;
}

.hamoodBadge.show{
    opacity:1;
    visibility:visible;
    transform:translate(-50%,0);
}

#recordingIndicator{
    position:absolute;
    left:50%;
    top:18px;
    z-index:40;
    transform:translateX(-50%);
    display:none;
    align-items:center;
    gap:8px;
    padding:8px 13px;
    border-radius:20px;
    background:rgba(0,0,0,.7);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(14px);
    font-size:11px;
    letter-spacing:1.5px;
}

#recordingIndicator.active{
    display:flex;
}

.recordingDot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#ff334f;
    box-shadow:0 0 12px rgba(255,51,79,.8);
    animation:recordingPulse 1s ease-in-out infinite;
}

@keyframes recordingPulse{
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.45;transform:scale(.72)}
}

.hamoodOption .effectPreview{
    background:linear-gradient(135deg,#20d66b,#39f2c2,#111);
    position:relative;
    overflow:hidden;
}

.hamoodOption .effectPreview::after{
    content:"🕺";
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    font-size:18px;
    background:rgba(0,255,90,.16);
}

.hamoodOption.active{
    background:rgba(0,255,160,.13);
    border-color:rgba(0,255,160,.4);
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 420px) {

    #photoGrid {
        gap: 8px;
    }

    .photoCard {
        border-radius: 14px;
    }

    .cameraControls {
        gap: 14px;
    }

    .shutterOuter,
    .filterButton {
        width: 70px;
        height: 70px;
    }

    .shutterInner {
        width: 57px;
        height: 57px;
    }

}

#openCameraButton {
    position: fixed;

    right: 22px;
    bottom: 22px;

    width: 68px;
    height: 68px;

    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.2);

    background:
        linear-gradient(
            135deg,
            #00ff88,
            #00d9ff,
            #0066ff
        );

    color: white;

    font-size: 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    z-index: 100;

    box-shadow:
        0 8px 30px rgba(0,0,0,.5),
        0 0 25px rgba(0,220,255,.25);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

#openCameraButton:active {
    transform: scale(.88);
}

</style>
</head>


<body>


<!-- =====================================================
     LOADING
===================================================== -->

<div id="loadingScreen">

    <div class="loadingAura"></div>

    <div class="loadingContent">

        <div class="logo">
            CAMPLAGUE
        </div>

        <div class="loadingSubtitle">
            Enter the plague
        </div>

        <div class="loader">
            <div class="loaderBar"></div>
        </div>

    </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div id="app">


    <!-- =================================================
         GALLERY / SWIPE PAGES
    ================================================== -->

    <section id="galleryScreen">
        <div id="galleryPager">

            <section class="galleryPanel" id="photosPanel">
                <div class="galleryHeader">
                    <div class="galleryTitle">PHOTOS</div>
                    <div class="photoCount" id="photoCount">0 photos</div>
                </div>

                <div id="photoGrid"></div>

                <div id="emptyGallery">
                    <div class="emptyIcon">📷</div>
                    <div class="emptyTitle">No photos yet</div>
                    <div class="emptyText">Capture your first moment with CAMPLAGUE.</div>
                </div>
            </section>

            <section class="galleryPanel" id="videosPanel">
                <div class="galleryHeader">
                    <div class="galleryTitle">VIDEOS</div>
                    <div class="photoCount" id="videoCount">0 videos</div>
                </div>

                <div id="videoGrid"></div>

                <div id="emptyVideos" class="emptyVideos">
                    <div class="emptyIcon">🎥</div>
                    <div class="emptyTitle">No videos yet</div>
                    <div class="emptyText">Long-press the shutter to record a video.</div>
                </div>
            </section>

        </div>

        <div class="gallerySwipeHint" id="gallerySwipeHint">SWIPE ← →</div>

        <button id="openCameraButton" aria-label="Take photo">📷</button>
    </section>

    <!-- =================================================
         CAMERA
    ================================================== -->

    <section id="cameraScreen">

        <video
            id="camera"
            autoplay
            playsinline
            muted>
        </video>

        <canvas id="compositeCanvas"></canvas>

        <video
            id="hamoodVideo"
            src="hamood.mp4"
            playsinline
            preload="auto"
            loop>
        </video>

        <div class="hamoodBadge" id="hamoodBadge">HAMOOD!!</div>

/* =====================================================
   INDEXED DB
===================================================== */

function openDatabase() {

    return new Promise(
        (resolve, reject) => {

            const request =
                indexedDB.open(
                    "CAMPLAGUE_DB",
                    2
                );


            request.onupgradeneeded =
                event => {

                    const database =
                        event.target.result;

                    if (
                        !database.objectStoreNames
                            .contains("photos")
                    ) {

                        database.createObjectStore(
                            "photos",
                            {
                                keyPath: "id",
                                autoIncrement: true
                            }
                        );

                    }

                    if (
                        !database.objectStoreNames
                            .contains("videos")
                    ) {

                        database.createObjectStore(
                            "videos",
                            {
                                keyPath: "id",
                                autoIncrement: true
                            }
                        );

                    }

                };


            request.onsuccess =
                event => {

                    db =
                        event.target.result;

                    resolve(db);

                };


            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* =====================================================
   SAVE PHOTO
===================================================== */

function savePhoto(blob) {

    return new Promise(
        (resolve, reject) => {

            const transaction =
                db.transaction(
                    ["photos"],
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    "photos"
                );


            const request =
                store.add({

                    blob: blob,

                    createdAt:
                        Date.now()

                });


            request.onsuccess =
                () => {

                    resolve(
                        request.result
                    );

                };


            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* =====================================================
   GET ALL PHOTOS
===================================================== */

function getPhotos() {

    return new Promise(
        (resolve, reject) => {

            const transaction =
                db.transaction(
                    ["photos"],
                    "readonly"
                );

            const store =
                transaction.objectStore(
                    "photos"
                );

            const request =
                store.getAll();


            request.onsuccess =
                () => {

                    resolve(
                        request.result
                            .reverse()
                    );

                };


            request.onerror =
                () => {

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* =====================================================
   DELETE PHOTO
===================================================== */

function deletePhoto(id) {

    return new Promise(
        (resolve, reject) => {

            const transaction =
                db.transaction(
                    ["photos"],
                    "readwrite"
                );

            const store =
                transaction.objectStore(
                    "photos"
                );


            const request =
                store.delete(id);


            request.onsuccess =
                () => resolve();


            request.onerror =
                () => reject(
                    request.error
                );

        }
    );

}

/* =====================================================

async function startCamera() {

    stopCamera();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showCameraMessage(
            "Camera is not available in this browser.<br><br>" +
            "Make sure CAMPLAGUE is opened over HTTPS."
        );
        return;
    }

    if (!window.isSecureContext) {
        showCameraMessage(
            "CAMPLAGUE is not running in a secure context.<br><br>" +
            "Open the hosted HTTPS address, not a file:// address."
        );
        return;
    }

    cameraMessage.style.display = "none";

    let videoStream = null;
    let lastCameraError = null;

    // Mobile browsers can be picky about camera constraints.
    // Try the requested lens first, then progressively simpler requests.
    const cameraRequests = [
        {
            video: {
                facingMode: { exact: facingMode },
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            },
            audio: false
        },
        {
            video: {
                facingMode: facingMode,
                width: { ideal: 1280 },
                height: { ideal: 720 }
            },
            audio: false
        },
        {
            video: true,
            audio: false
        }
    ];

    for (const constraints of cameraRequests) {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia(constraints);
            break;
        } catch (error) {
            lastCameraError = error;
            console.warn("Camera request failed:", constraints, error);
        }
    }

    if (!videoStream) {
        console.error("All camera requests failed:", lastCameraError);

        let message = "Camera could not be started.<br><br>";
        const name = lastCameraError?.name || "UnknownError";

        if (name === "NotAllowedError" || name === "PermissionDeniedError") {
            message +=
                "The browser is blocking camera access for this website. " +
                "Open this site's browser permissions and set Camera to Allow, then reload CAMPLAGUE.";
        } else if (name === "NotReadableError" || name === "TrackStartError") {
            message +=
                "The camera is currently busy. Close other apps using the camera and try again.";
        } else if (name === "NotFoundError" || name === "OverconstrainedError") {
            message +=
                "The requested camera is unavailable. Try switching between front and rear camera.";
        } else if (name === "SecurityError") {
            message +=
                "The browser blocked camera access because of the page security settings. Use HTTPS.";
        } else {
            message +=
                `Browser error: ${name}. Reload the page and try again.`;
        }

        showCameraMessage(message);
        return;
    }

    cameraStream = videoStream;
    cameraTrack = videoStream.getVideoTracks()[0] || null;

    // Do NOT request microphone until the camera is already working.
    // A microphone permission failure must never break the camera.
    try {
        const micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            },
            video: false
        });

        micStream.getAudioTracks().forEach(track => {
            cameraStream.addTrack(track);
        });

    } catch (micError) {
        console.warn("Microphone unavailable:", micError);
    }

    camera.srcObject = cameraStream;
    camera.muted = true;
    camera.playsInline = true;

    camera.classList.toggle(
        "frontCamera",
        facingMode === "user"
    );

    torchEnabled = false;
    updateFlashButton();

    try {
        await camera.play();
    } catch (playError) {
        console.warn("Camera autoplay/play failed:", playError);
    }

    if (camera.readyState < 1) {
        await new Promise(resolve => {
            const timeout = setTimeout(resolve, 3000);
            const onLoaded = () => {
                clearTimeout(timeout);
                camera.removeEventListener("loadedmetadata", onLoaded);
                resolve();
            };
            camera.addEventListener("loadedmetadata", onLoaded);
        });
    }

    if (hamoodEnabled) {
        resizeCompositeCanvas();
        setupHamoodAudio();
    }
}


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera() {

    if (!cameraStream)
        return;


    cameraStream
        .getTracks()
        .forEach(
            track =>
                track.stop()
        );


    cameraStream = null;

    cameraTrack = null;

}

/* =====================================================

===================================================== */

function updateFlashButton() {

    if (!cameraTrack) {

        flashButton.classList
            .add("disabled");

        return;

    }


    const capabilities =
        typeof cameraTrack
            .getCapabilities ===
            "function"

            ? cameraTrack
                .getCapabilities()

            : {};


    /*
        Torch is normally available
        only on supported rear cameras.
    */

    const frontCamera =
        facingMode === "user";


    if (
        frontCamera ||
        !capabilities.torch
    ) {

        flashButton.classList
            .add("disabled");

        torchEnabled = false;

        return;

    }


    flashButton.classList
        .remove("disabled");

}


/* =====================================================
   FLASHLIGHT
===================================================== */

flashButton.addEventListener(
    "click",
    async () => {

        if (!cameraTrack)
            return;


        const capabilities =
            cameraTrack
                .getCapabilities();


        if (!capabilities.torch)
            return;


        torchEnabled =
            !torchEnabled;


        try {

            await cameraTrack
                .applyConstraints({

                    advanced: [
                        {
                            torch:
                                torchEnabled
                        }
                    ]

                });


            flashButton
                .classList
                .toggle(
                    "active",
                    torchEnabled
                );


        } catch (error) {

            torchEnabled = false;

            flashButton
                .classList
                .remove(
                    "active"
                );

        }

    }
);

===================================================== */

function startHamood() {

    hamoodEnabled = true;

    camera.classList.add("hamoodActive");
    compositeCanvas.classList.add("hamoodActive");
    hamoodBadge.classList.add("show");

    hamoodVideo.currentTime = 0;
    hamoodVideo.muted = false;

    hamoodVideo.play().catch(error => {
        console.warn(
            "HAMOOD video could not play:",
            error
        );
    });

    resizeCompositeCanvas();

    if (!hamoodAnimationFrame) {
        renderHamoodFrame();
    }

    setupHamoodAudio();

}


function stopHamood() {

    hamoodEnabled = false;

    if (hamoodAnimationFrame) {
        cancelAnimationFrame(
            hamoodAnimationFrame
        );
        hamoodAnimationFrame = null;
    }

    hamoodVideo.pause();
    hamoodVideo.currentTime = 0;

    camera.classList.remove("hamoodActive");
    compositeCanvas.classList.remove("hamoodActive");
    hamoodBadge.classList.remove("show");

    if (recordingStarted) {
        stopVideoRecording();
    }

    teardownHamoodAudio();

}


function resizeCompositeCanvas() {
    if (!camera.videoWidth || !camera.videoHeight) return;

    // The green-screen processing itself is deliberately low-resolution.
    // The result is then scaled for the preview/recording. This avoids reading
    // hundreds of thousands of pixels every animation frame on low-end PCs.
    const maxWidth = 854;
    const scale = Math.min(1, maxWidth / camera.videoWidth);
    const w = Math.max(2, Math.round(camera.videoWidth * scale));
    const h = Math.max(2, Math.round(camera.videoHeight * scale));

    if (compositeCanvas.width !== w || compositeCanvas.height !== h) {
        compositeCanvas.width = w;
        compositeCanvas.height = h;
    }
}


function drawCover(
    context,
    source,
    sourceWidth,
    sourceHeight,
    destinationWidth,
    destinationHeight
) {

    const sourceRatio =
        sourceWidth / sourceHeight;

    const destinationRatio =
        destinationWidth / destinationHeight;

    let sx = 0;
    let sy = 0;
    let sw = sourceWidth;
    let sh = sourceHeight;

    if (sourceRatio > destinationRatio) {

        sw =
            sourceHeight *
            destinationRatio;

        sx =
            (sourceWidth - sw) / 2;

    } else {

        sh =
            sourceWidth /
            destinationRatio;

        sy =
            (sourceHeight - sh) / 2;

    }

    context.drawImage(
        source,
        sx,
        sy,
        sw,
        sh,
        0,
        0,
        destinationWidth,
        destinationHeight
    );

}


function drawHamoodWithChromaKey(
    context,
    video,
    canvasWidth,
    canvasHeight
) {

    if (
        !video.videoWidth ||
        !video.videoHeight
    )
        return;

    const targetHeight = canvasHeight * HAMOOD_SCALE;
    const targetWidth = targetHeight * video.videoWidth / video.videoHeight;
    const x = (canvasWidth - targetWidth) / 2;
    const y = canvasHeight - targetHeight;

    // Process the keyed video at low resolution, then upscale it.
    // This is the main performance fix for HAMOOD.
    const processMaxWidth = 480;
    const processScale = Math.min(1, processMaxWidth / targetWidth);
    const bufferWidth = Math.max(1, Math.round(targetWidth * processScale));
    const bufferHeight = Math.max(1, Math.round(targetHeight * processScale));

    if (
        !drawHamoodWithChromaKey.buffer ||
        drawHamoodWithChromaKey.buffer.width !== bufferWidth ||
        drawHamoodWithChromaKey.buffer.height !== bufferHeight
    ) {

        drawHamoodWithChromaKey.buffer =
            document.createElement("canvas");

        drawHamoodWithChromaKey.buffer.width =
            bufferWidth;

        drawHamoodWithChromaKey.buffer.height =
            bufferHeight;

        drawHamoodWithChromaKey.bufferContext =
            drawHamoodWithChromaKey.buffer
                .getContext("2d", {
                    willReadFrequently: true
                });

    }

    const buffer =
        drawHamoodWithChromaKey.buffer;

    const bufferContext =
        drawHamoodWithChromaKey.bufferContext;

    bufferContext.clearRect(
        0,
        0,
        buffer.width,
        buffer.height
    );

    bufferContext.drawImage(
        video,
        0,
        0,
        buffer.width,
        buffer.height
    );

    const image =
        bufferContext.getImageData(
            0,
            0,
            buffer.width,
            buffer.height
        );

    const pixels =
        image.data;

    for (
        let i = 0;
        i < pixels.length;
        i += 4
    ) {

        const red = pixels[i];
        const green = pixels[i + 1];
        const blue = pixels[i + 2];

        const greenStrength =
            green - (red + blue) / 2;

        const isGreen =
            green > HAMOOD_GREEN_THRESHOLD &&
            green > red * HAMOOD_GREEN_DOMINANCE &&
            green > blue * HAMOOD_GREEN_DOMINANCE &&
            greenStrength > 18;

        if (isGreen) {

            const edgeAmount =
                Math.min(
                    1,
                    greenStrength /
                    HAMOOD_EDGE_SOFTNESS
                );

            pixels[i + 3] =
                Math.round(
                    (1 - edgeAmount) * 255
                );

        } else {

            pixels[i + 3] = 255;

        }

    }

    bufferContext.putImageData(
        image,
        0,
        0
    );

    context.drawImage(
        buffer,
        x,
        y,
        targetWidth,
        targetHeight
    );

}


function renderHamoodFrame(now = performance.now()) {
    if (!hamoodEnabled) return;

    // Keep effect processing around 30fps instead of tying expensive chroma-key
    // work to a 60/120Hz display.
    if (now - lastHamoodFrameTime >= 33) {
        lastHamoodFrameTime = now;

        if (camera.videoWidth && camera.videoHeight) {
            resizeCompositeCanvas();
            const context = compositeCanvas.getContext("2d", { alpha: false });
            context.clearRect(0, 0, compositeCanvas.width, compositeCanvas.height);

            drawCover(
                context,
                camera,
                camera.videoWidth,
                camera.videoHeight,
                compositeCanvas.width,
                compositeCanvas.height
            );

            if (hamoodVideo.readyState >= 2) {
                drawHamoodWithChromaKey(
                    context,
                    hamoodVideo,
                    compositeCanvas.width,
                    compositeCanvas.height
                );
            }
        }
    }

    hamoodAnimationFrame = requestAnimationFrame(renderHamoodFrame);
}


window.addEventListener(
    "resize",
    () => {
        if (hamoodEnabled) {
            resizeCompositeCanvas();
        }
    }
);


/* =====================================================
   HAMOOD AUDIO MIXER
===================================================== */

async function setupHamoodAudio() {

    if (hamoodAudioContext)
        return;

    if (!cameraStream)
        return;

    try {

        const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContextClass)
            return;

        hamoodAudioContext =
            new AudioContextClass();

        hamoodAudioDestination =
            hamoodAudioContext
                .createMediaStreamDestination();

        hamoodMicSource =
            hamoodAudioContext
                .createMediaStreamSource(
                    cameraStream
                );

        hamoodMicSource.connect(
            hamoodAudioDestination
        );

        if (
            typeof hamoodVideo.captureStream ===
            "function"
        ) {

            const videoStream =
                hamoodVideo.captureStream();

            if (
                videoStream.getAudioTracks().length
            ) {

                hamoodVideoSource =
                    hamoodAudioContext
                        .createMediaStreamSource(
                            videoStream
                        );

                hamoodVideoSource.connect(
                    hamoodAudioDestination
                );

            }

        }

        await hamoodAudioContext.resume();

    } catch (error) {

        console.error(
            "HAMOOD audio setup failed:",
            error
        );

    }

}


function teardownHamoodAudio() {

    if (hamoodMicSource) {
        try {
            hamoodMicSource.disconnect();
        } catch {}
    }

    if (hamoodVideoSource) {
        try {
            hamoodVideoSource.disconnect();
        } catch {}
    }

    if (hamoodAudioContext) {
        hamoodAudioContext.close().catch(() => {});
    }

    hamoodAudioContext = null;
    hamoodAudioDestination = null;
    hamoodMicSource = null;
    hamoodVideoSource = null;

}


/* =====================================================
   LOCAL VIDEO STORAGE + UNIVERSAL LONG-PRESS RECORDING
===================================================== */

function saveVideo(blob, effect = recordingEffect) {
    return new Promise((resolve, reject) => {
        if (!db) {
            reject(new Error("Database is not ready."));
            return;
        }
        const tx = db.transaction(["videos"], "readwrite");
        const store = tx.objectStore("videos");
        const request = store.add({
            blob,
            createdAt: Date.now(),
            type: effect
        });
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}

function getVideos() {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(["videos"], "readonly");
        const store = tx.objectStore("videos");
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result.reverse());
        request.onerror = () => reject(request.error);
    });
}

function deleteVideo(id) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(["videos"], "readwrite");
        const request = tx.objectStore("videos").delete(id);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
    });
}

async function renderVideos() {
    if (!db || !videoGrid) return;

    const videos = await getVideos();
    videoGrid.innerHTML = "";
    videoCount.textContent = `${videos.length} ${videos.length === 1 ? "video" : "videos"}`;
    emptyVideos.style.display = videos.length ? "none" : "block";

    videos.forEach(videoRecord => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "videoCard";
        card.setAttribute("aria-label", "Open video preview");

        const url = URL.createObjectURL(videoRecord.blob);

        const thumb = document.createElement("video");
        thumb.src = url;
        thumb.playsInline = true;
        thumb.preload = "metadata";
        thumb.muted = true;
        thumb.className = "savedVideoThumb";

        const overlay = document.createElement("div");
        overlay.className = "videoThumbOverlay";
        overlay.innerHTML = '<span>▶</span>';

        const meta = document.createElement("div");
        meta.className = "videoMeta";
        meta.textContent = `${videoRecord.type || "Default"} • ${new Date(videoRecord.createdAt).toLocaleString()}`;

        card.append(thumb, overlay, meta);
        card.addEventListener("click", () => openVideoPreview(videoRecord, url));
        videoGrid.appendChild(card);
    });
}

function formatVideoTime(seconds) {
    if (!Number.isFinite(seconds)) return "0:00";
    const total = Math.max(0, Math.floor(seconds));
    const m = Math.floor(total / 60);
    const s = String(total % 60).padStart(2, "0");
    return `${m}:${s}`;
}

function openVideoPreview(record, url) {
    if (activeVideoUrl) URL.revokeObjectURL(activeVideoUrl);
    activeVideoRecord = record;
    activeVideoUrl = url;
    videoPreviewPlayer.src = url;
    videoPreviewPlayer.currentTime = 0;
    videoPlay.textContent = "▶";
    videoMute.textContent = "🔊";
    videoSeek.value = 0;
    videoTime.textContent = "0:00 / 0:00";
    videoPreview.classList.add("active");
    videoPreview.setAttribute("aria-hidden", "false");
}

function closeVideoPreview() {
    videoPreviewPlayer.pause();
    videoPreview.classList.remove("active");
    videoPreview.setAttribute("aria-hidden", "true");
    videoPreviewPlayer.removeAttribute("src");
    videoPreviewPlayer.load();
    if (activeVideoUrl) URL.revokeObjectURL(activeVideoUrl);
    activeVideoUrl = null;
    activeVideoRecord = null;
}

videoPlay.addEventListener("click", () => {
    if (videoPreviewPlayer.paused) videoPreviewPlayer.play().catch(() => {});
    else videoPreviewPlayer.pause();
});
videoPreviewPlayer.addEventListener("play", () => videoPlay.textContent = "❚❚");
videoPreviewPlayer.addEventListener("pause", () => videoPlay.textContent = "▶");
videoPreviewPlayer.addEventListener("loadedmetadata", () => {
    videoTime.textContent = `0:00 / ${formatVideoTime(videoPreviewPlayer.duration)}`;
});
videoPreviewPlayer.addEventListener("timeupdate", () => {
    const duration = videoPreviewPlayer.duration || 0;
    videoSeek.value = duration ? Math.round((videoPreviewPlayer.currentTime / duration) * 1000) : 0;
    videoTime.textContent = `${formatVideoTime(videoPreviewPlayer.currentTime)} / ${formatVideoTime(duration)}`;
});
videoSeek.addEventListener("input", () => {
    if (!videoPreviewPlayer.duration) return;
    videoPreviewPlayer.currentTime = (Number(videoSeek.value) / 1000) * videoPreviewPlayer.duration;
});
videoMute.addEventListener("click", () => {
    videoPreviewPlayer.muted = !videoPreviewPlayer.muted;
    videoMute.textContent = videoPreviewPlayer.muted ? "🔇" : "🔊";
});
videoFullscreen.addEventListener("click", () => {
    if (videoPreviewFrame.requestFullscreen) videoPreviewFrame.requestFullscreen().catch(() => {});
});
videoPreviewClose.addEventListener("click", closeVideoPreview);
videoPreview.addEventListener("click", e => {
    if (e.target === videoPreview) closeVideoPreview();
});
videoPreviewPlayer.addEventListener("dblclick", () => {
    if (videoPreviewFrame.requestFullscreen) videoPreviewFrame.requestFullscreen().catch(() => {});
});
videoPreviewSave.addEventListener("click", () => {
    if (!activeVideoUrl || !activeVideoRecord) return;
    const a = document.createElement("a");
    a.href = activeVideoUrl;
    a.download = `camplague-video-${activeVideoRecord.id}.webm`;
    document.body.appendChild(a);
    a.click();
    a.remove();
});
videoPreviewDelete.addEventListener("click", async () => {
    if (!activeVideoRecord) return;
    const id = activeVideoRecord.id;
    closeVideoPreview();
    await deleteVideo(id);
    await renderVideos();
});

function setGalleryPage(page, animate = true) {
    galleryPage = page ? 1 : 0;
    galleryPager.style.transition = animate ? "transform .42s cubic-bezier(.22,.8,.25,1)" : "none";
    galleryPager.style.transform = `translate3d(${-galleryPage * 50}%,0,0)`;
    gallerySwipeHint.textContent = galleryPage ? "VIDEOS • SWIPE → FOR PHOTOS" : "PHOTOS • SWIPE ← FOR VIDEOS";
}

function installGallerySwipe() {
    galleryPager.addEventListener("pointerdown", e => {
        if (e.target.closest("button, input, video")) return;
        gallerySwipeStartX = e.clientX;
        gallerySwipeStartY = e.clientY;
        gallerySwipeTracking = true;
        galleryPager.setPointerCapture?.(e.pointerId);
    });

    galleryPager.addEventListener("pointerup", e => {
        if (!gallerySwipeTracking) return;
        gallerySwipeTracking = false;
        const dx = e.clientX - gallerySwipeStartX;
        const dy = e.clientY - gallerySwipeStartY;
        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.15) {
            if (dx < 0 && galleryPage === 0) setGalleryPage(1);
            else if (dx > 0 && galleryPage === 1) setGalleryPage(0);
        }
    });

    galleryPager.addEventListener("pointercancel", () => gallerySwipeTracking = false);
}

installGallerySwipe();
setGalleryPage(0, false);


function getRecordingMimeType() {
    const types = [
        "video/webm;codecs=vp8,opus",
        "video/webm;codecs=vp9,opus",
        "video/webm"
    ];
    return types.find(type => MediaRecorder.isTypeSupported(type)) || "";
}

function ensureRecordCanvas() {
    if (!recordCanvas) {
        recordCanvas = document.createElement("canvas");
        recordCanvas.width = 854;
        recordCanvas.height = 480;
        recordContext = recordCanvas.getContext("2d", { alpha: false });
    }
    return recordCanvas;
}

function drawCameraToRecordCanvas() {
    if (!recordContext || !camera.videoWidth || !camera.videoHeight) return;
    const w = recordCanvas.width;
    const h = recordCanvas.height;
    recordContext.save();
    recordContext.clearRect(0, 0, w, h);
    recordContext.filter = bwEnabled ? "grayscale(1)" : "none";

    if (facingMode === "user") {
        recordContext.translate(w, 0);
        recordContext.scale(-1, 1);
    }

    recordContext.drawImage(camera, 0, 0, w, h);
    recordContext.restore();
    recordContext.filter = "none";
}

function drawHamoodToRecordCanvas() {
    if (!compositeCanvas.width || !compositeCanvas.height) return;
    recordContext.drawImage(compositeCanvas, 0, 0, recordCanvas.width, recordCanvas.height);
}

function renderRecordingFrame() {
    if (!videoRecording) return;
    if (hamoodEnabled) drawHamoodToRecordCanvas();
    else drawCameraToRecordCanvas();
}

async function startVideoRecording() {
    if (videoRecording || !camera.videoWidth || !window.MediaRecorder) return;

    try {
        ensureRecordCanvas();
        recordingEffect = hamoodEnabled ? "HAMOOD!!" : (bwEnabled ? "Black & White" : "Default");

        // Give the canvas one valid frame before captureStream starts.
        renderRecordingFrame();

        const canvasStream = recordCanvas.captureStream(30);
        const tracks = [...canvasStream.getVideoTracks()];

        if (hamoodEnabled) {
            await setupHamoodAudio();
            if (hamoodAudioDestination) {
                hamoodAudioDestination.stream.getAudioTracks().forEach(track => tracks.push(track));
            }
        } else if (cameraStream) {
            cameraStream.getAudioTracks().forEach(track => tracks.push(track));
        }

        recordingStream = new MediaStream(tracks);
        recordingMimeType = getRecordingMimeType();
        const options = recordingMimeType
            ? { mimeType: recordingMimeType, videoBitsPerSecond: 4500000 }
            : { videoBitsPerSecond: 4500000 };

        mediaRecorder = new MediaRecorder(recordingStream, options);
        recordedChunks = [];

        mediaRecorder.ondataavailable = event => {
            if (event.data && event.data.size > 0) recordedChunks.push(event.data);
        };

        mediaRecorder.onerror = event => {
            console.error("MediaRecorder error:", event.error);
            stopVideoRecording(true);
            showCameraMessage("Video recording failed.");
        };

        mediaRecorder.onstop = async () => {
            const mime = mediaRecorder.mimeType || recordingMimeType || "video/webm";
            const blob = new Blob(recordedChunks, { type: mime });
            recordedChunks = [];

            if (blob.size > 0) {
                try {
                    await saveVideo(blob, recordingEffect);
                    await renderVideos();
                    showCameraMessage("Video saved locally in VIDEOS.");
                } catch (error) {
                    console.error("Video save failed:", error);
                    showCameraMessage("Video was recorded but could not be saved locally.");
                }
            }

            if (recordingStream) {
                recordingStream.getTracks().forEach(track => track.stop());
                recordingStream = null;
            }
            mediaRecorder = null;
        };

        mediaRecorder.start(250);
        videoRecording = true;
        recordingStarted = true;
        recordingIndicator.classList.add("active");
        document.body.classList.add("isRecording");

        const frameInterval = 1000 / 30;
        recordRenderTimer = setInterval(renderRecordingFrame, frameInterval);
    } catch (error) {
        console.error("Could not start video recording:", error);
        videoRecording = false;
        recordingStarted = false;
        document.body.classList.remove("isRecording");
        recordingIndicator.classList.remove("active");
        showCameraMessage("Could not start video recording.");
    }
}

function stopVideoRecording(fromError = false) {
    clearInterval(recordRenderTimer);
    recordRenderTimer = null;
    videoRecording = false;
    recordingStarted = false;
    document.body.classList.remove("isRecording");
    recordingIndicator.classList.remove("active");

    if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
    } else if (recordingStream) {
        recordingStream.getTracks().forEach(track => track.stop());
        recordingStream = null;
    }
}

function beginShutterPress() {
    clearTimeout(videoPressTimer);
    videoPressTriggered = false;
    videoPressTimer = setTimeout(() => {
        videoPressTriggered = true;
        startVideoRecording();
    }, 500);
}

function endShutterPress() {
    clearTimeout(videoPressTimer);
    if (videoRecording) {
        stopVideoRecording();
        return;
    }
    if (!videoPressTriggered) capturePhoto(bwEnabled);
}

shutterButton.addEventListener("pointerdown", event => {
    event.preventDefault();
    shutterButton.setPointerCapture?.(event.pointerId);
    beginShutterPress();
});

shutterButton.addEventListener("pointerup", event => {
    event.preventDefault();
    endShutterPress();
});

shutterButton.addEventListener("pointercancel", () => {
    clearTimeout(videoPressTimer);
    if (videoRecording) stopVideoRecording();
});

shutterButton.addEventListener("contextmenu", event => event.preventDefault());

/* Keep the original tap behavior without creating a second recording handler. */

/* =====================================================
   CAPTURE PHOTO
===================================================== */

async function capturePhoto(useBW = bwEnabled) {

    if (!camera.videoWidth)
        return;


    /*
        Shutter animation
    */

    const activeShutter =
        shutterButton;

    activeShutter
        .classList
        .add("capture");


    setTimeout(() => {

        activeShutter
            .classList
            .remove("capture");

    }, 180);


    const width =
        camera.videoWidth;

    const height =
        camera.videoHeight;


    captureCanvas.width =
        width;

    captureCanvas.height =
        height;


    const context =
        captureCanvas
            .getContext("2d");


    /*
        Mirror selfie camera
        so front camera behaves
        naturally.
    */

        /*
        Apply B&W only to
        the captured photo.
    */

    if (useBW) {

        context.filter =
            "grayscale(1)";

    } else {

        context.filter =
            "none";

    }


    context.drawImage(
        camera,
        0,
        0,
        width,
        height
    );


    context.filter =
        "none";


    const blob =
        await new Promise(
            resolve => {

                captureCanvas
                    .toBlob(
                        resolve,
                        "image/jpeg",
                        .92
                    );

            }
        );


    if (!blob)
        return;


    try {

        await savePhoto(
            blob
        );

        /*
            Small gallery update
            without leaving camera.
        */

        console.log(
            "Photo saved locally:",
            blob.size,
            "bytes"
        );

    } catch (error) {

        console.error(
            "Save failed:",
            error
        );

        showCameraMessage(
            "Could not save the photo."
        );

    }

}


/* =====================================================
   CAMERA MESSAGE
===================================================== */

function showCameraMessage(
    message
) {

    cameraMessage.innerHTML =
        message;

    cameraMessage.style.display =
        "block";


    setTimeout(() => {

        cameraMessage.style.display =
            "none";

    }, 3000);

}


/* =====================================================
   INITIALIZATION
===================================================== */

(async function init() {

    try {

        await openDatabase();

        await renderGallery();
        await renderVideos();

    } catch (error) {

        console.error(
            "Database error:",
            error
        );

        alert(
            "CAMPLAGUE could not initialize local storage."
        );

    }

})();

.videoPreviewFrame{position:relative;width:min(1100px,96vw);max-height:92vh;padding:12px;border:1px solid rgba(0,255,180,.2);border-radius:24px;background:linear-gradient(145deg,rgba(8,18,18,.96),rgba(3,8,12,.98));box-shadow:0 30px 100px rgba(0,0,0,.65),0 0 50px rgba(0,255,180,.08);overflow:hidden}
#videoPreviewPlayer{display:block;width:100%;max-height:70vh;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:17px}
.videoPreviewClose{position:absolute;top:20px;right:20px;z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.62);color:#fff;cursor:pointer;font-size:18px;backdrop-filter:blur(10px)}
.videoControls{display:flex;align-items:center;gap:9px;margin-top:10px;padding:8px;border-radius:16px;background:rgba(0,255,180,.055);border:1px solid rgba(0,255,180,.12)}
.videoControl{width:40px;height:36px;flex:0 0 auto;border:1px solid rgba(0,255,180,.16);border-radius:11px;background:rgba(0,0,0,.45);color:#eafff8;cursor:pointer;font-size:15px}
.videoControl:hover{background:rgba(0,255,180,.12);border-color:rgba(0,255,180,.32)}
.videoSeek{flex:1;min-width:80px;accent-color:#00ff88;cursor:pointer}
.videoTime{min-width:90px;color:rgba(220,255,248,.62);font-size:11px;text-align:center;font-variant-numeric:tabular-nums}
.videoPreviewActions{display:flex;gap:9px;margin-top:9px}
.videoPreviewAction{flex:1;min-height:42px;border:1px solid rgba(0,255,180,.16);border-radius:13px;background:rgba(0,0,0,.42);color:#fff;cursor:pointer;font-size:13px}
.videoPreviewAction:hover{background:rgba(0,255,180,.1);border-color:rgba(0,255,180,.35)}
.videoPreviewAction.danger:hover{background:rgba(255,50,80,.1);border-color:rgba(255,50,80,.35)}

body.isRecording #shutterButton{border-color:#00ff88!important;box-shadow:0 0 0 6px rgba(0,255,136,.12),0 0 30px rgba(0,255,136,.55)}
body.isRecording #shutterButton .shutterInner{background:#ff304f!important;border-radius:16px!important}

@media(max-width:699px){
    #videoGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
    .galleryPanel{padding:18px 10px 105px}
    .galleryPanel .galleryHeader{margin-bottom:15px}
    .videoCard{padding:5px;border-radius:14px}
    .savedVideoThumb,.videoThumbOverlay{border-radius:10px}
    .videoThumbOverlay{inset:5px 5px auto 5px}
    .videoThumbOverlay span{width:38px;height:38px;font-size:15px}
    .videoMeta{font-size:8px;padding:7px 2px 2px}
    .videoPreviewFrame{width:98vw;padding:8px;border-radius:18px}
    .videoControls{gap:5px;padding:6px}
    .videoControl{width:36px;height:34px}
    .videoTime{min-width:74px;font-size:9px}
}
</style>

</body>
</html>
